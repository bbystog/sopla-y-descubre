<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metamorfosis</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#13353d;--mist:#e8f2f0;--sea:#1d7f86;--sun:#f2b84b;--leaf:#4f9d69;--coral:#e56f56;--soft:#5b7a80;--line:#cfe0dd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:700;background:linear-gradient(180deg,#f3faf8,#e1efec) fixed}
main{max-width:680px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top a{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:#fff;border:2px solid var(--line);color:var(--ink);text-decoration:none;font-size:1.3rem}
h1{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.7rem;margin:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tab{appearance:none;border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 4px;font:inherit;font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.05rem;color:var(--ink);cursor:pointer}
.tab span{display:block;font-size:1.7rem;line-height:1.2}
.tab[aria-selected=true]{background:var(--sea);border-color:var(--sea);color:#fff}
.card{background:#fff;border-radius:22px;box-shadow:0 6px 24px rgba(19,53,61,.09);overflow:hidden}
.scene{display:block;width:100%;height:auto;aspect-ratio:4/3;background:#dff0f4}
.info{padding:14px 16px 16px}
.badge{display:inline-block;background:var(--mist);color:var(--sea);border-radius:99px;padding:3px 12px;font-size:.85rem}
.info h2{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.6rem;margin:6px 0 4px}
.info p{margin:0;font-size:1.2rem;line-height:1.5}
.fact{margin-top:10px;background:#fff6dc;border-left:5px solid var(--sun);border-radius:10px;padding:8px 12px;font-size:1rem}
.steps{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto}
.step{flex:1;min-width:0;appearance:none;border:0;background:var(--mist);border-radius:12px;padding:6px 2px;font:inherit;font-size:.72rem;color:var(--soft);cursor:pointer;text-align:center}
.step b{display:block;font-size:1.2rem;font-family:'Fredoka',sans-serif}
.step[aria-current=true]{background:var(--sun);color:var(--ink)}
.step.done{background:#d6ecdc;color:#2c6b43}
.bar{height:6px;background:#d6e6e3;margin:0 16px 12px;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sea)}
.ctl{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:8px;margin-top:12px}
.btn{appearance:none;border:0;border-radius:16px;padding:14px 8px;font:inherit;font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.1rem;cursor:pointer;background:var(--sea);color:#fff;box-shadow:0 4px 0 #14595e}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #14595e}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #b98a24}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.speedlbl{font-size:.9rem;color:var(--soft);margin:12px 4px -6px}
.speed{display:flex;align-items:center;gap:10px;margin-top:12px;background:#fff;border-radius:16px;padding:8px 14px;border:2px solid var(--line);font-size:1.5rem}
.speed input{flex:1;min-width:0;height:34px;accent-color:var(--sea)}
.speed b{font-size:.9rem;color:var(--soft);min-width:3.2em;text-align:right;font-family:'Fredoka',sans-serif}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
/* animaciones */
svg *{transform-box:view-box}
.float,.bob,.flapR,.flapL,.dflap,.seg,.grow,.sway,.wiggle,.swim,.tail,.shrink,.ripple,.bubble,.climb,.emerge,.unfold,.throat,.fly,.wobble,.hop,.blink,.fadein,.heartup{transform-box:fill-box}
.fadein{animation:fadein .7s both}
@keyframes fadein{from{opacity:0}}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
.flapR{transform-origin:left center;animation:flapR .45s ease-in-out infinite alternate}
.flapL{transform-origin:right center;animation:flapL .45s ease-in-out infinite alternate}
@keyframes flapR{to{transform:scaleX(.3)}}
@keyframes flapL{to{transform:scaleX(.3)}}
.dflap{transform-origin:center bottom;animation:dflap .18s ease-in-out infinite alternate}
@keyframes dflap{to{transform:scaleY(.45)}}
.seg{animation:inch 1.4s ease-in-out infinite}
@keyframes inch{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.grow{transform-origin:center bottom;animation:grow 6s ease-in-out infinite alternate}
@keyframes grow{from{transform:scale(.62)}to{transform:scale(1)}}
.sway{transform-origin:center top;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.wiggle{animation:wiggle 1.2s ease-in-out infinite alternate}
@keyframes wiggle{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.tail{transform-origin:left center;animation:tail .5s ease-in-out infinite alternate}
@keyframes tail{from{transform:skewY(-14deg)}to{transform:skewY(14deg)}}
.shrink{transform-origin:left center;animation:shrink 5s ease-in-out infinite alternate}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(.3)}}
.ripple{transform-origin:center;animation:ripple 2.6s ease-out infinite}
@keyframes ripple{from{transform:scale(.2);opacity:.9}to{transform:scale(1.8);opacity:0}}
.bubble{animation:bubble 4s ease-in infinite}
@keyframes bubble{from{transform:translateY(0);opacity:.9}to{transform:translateY(-120px);opacity:0}}
.climb{animation:climb 5s ease-in-out infinite alternate}
@keyframes climb{from{transform:translateY(70px)}to{transform:translateY(0)}}
.emerge{transform-origin:center bottom;animation:emerge 6s ease-in-out infinite alternate}
@keyframes emerge{from{transform:translate(-8px,38px) scale(.55)}to{transform:translate(0,0) scale(1)}}
.unfold{transform-origin:center bottom;animation:unfold 6s ease-in-out infinite alternate}
@keyframes unfold{from{transform:scale(.15)}to{transform:scale(1)}}
.throat{transform-origin:center;animation:throat 1s ease-in-out infinite alternate}
@keyframes throat{to{transform:scale(1.35)}}
.fly{animation:flyaround 6s linear infinite}
@keyframes flyaround{0%{transform:translate(0,0)}25%{transform:translate(30px,-16px)}50%{transform:translate(0,-30px)}75%{transform:translate(-30px,-14px)}100%{transform:translate(0,0)}}
.wobble{animation:wobble 2s ease-in-out infinite alternate}
@keyframes wobble{from{transform:scale(1)}to{transform:scale(1.07)}}
.hop{animation:hop 2.4s ease-in-out infinite}
@keyframes hop{0%,60%,100%{transform:translateY(0)}80%{transform:translateY(-22px)}}
.heartup{animation:heartup 3s ease-out infinite}
@keyframes heartup{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:1}100%{transform:translateY(-60px) scale(1.2);opacity:0}}
.blink{animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){svg *{animation:none!important}}
</style>
</head>
<body>
<main>
 <div class="top"><a href="index.html" aria-label="Volver al inicio">←</a><h1>Metamorfosis</h1></div>
 <div class="tabs" role="tablist" id="tabs"></div>
 <div class="card">
  <svg class="scene" id="scene" viewBox="0 0 400 300" role="img" aria-label="Dibujo animado de la etapa"></svg>
  <div class="info">
   <span class="badge" id="badge"></span>
   <h2 id="title"></h2>
   <p id="text"></p>
   <div class="fact" id="fact"></div>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div class="steps" id="steps"></div>
 </div>
 <div class="speedlbl">⏱ Tiempo que pasa en cada diapositiva</div>
 <div class="speed"><span aria-hidden="true">🐇</span><input type="range" id="spd" min="4" max="45" step="1" value="15" aria-label="Segundos que dura cada diapositiva"><span aria-hidden="true">🐢</span><b id="spdv"></b></div>
 <div class="ctl">
  <button class="btn ghost" id="prev">◀ Antes</button>
  <button class="btn sun" id="play">⏸ Pausa</button>
  <button class="btn" id="next">Después ▶</button>
 </div>
 <div class="row2"><button class="btn ghost" id="say">🔊 Escuchar</button><button class="btn ghost" id="restart">↺ Desde el principio</button></div>
</main>
<script>
const DEFS=`<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3f3"/><stop offset="1" stop-color="#eaf7ec"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86cfdb"/><stop offset="1" stop-color="#1f8590"/></linearGradient>
<linearGradient id="pond" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ad6dd"/><stop offset="1" stop-color="#3f9aa6"/></linearGradient>
<radialGradient id="egg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fffdf0"/><stop offset="1" stop-color="#f1e3a8"/></radialGradient>
<radialGradient id="jelly" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#bfe6ea" stop-opacity=".8"/></radialGradient>
</defs>`;

/* ---------- piezas de dibujo ---------- */
const leaf=(x,y,w,h,r,c='#6fba6a')=>`<g transform="translate(${x} ${y}) rotate(${r})"><path d="M${-w} 0 Q0 ${-h} ${w} 0 Q0 ${h} ${-w} 0Z" fill="${c}"/><path d="M${-w} 0 L${w} 0" stroke="#3f8a52" stroke-width="2.5" stroke-linecap="round"/></g>`;
const skyBg=`<rect width="400" height="300" fill="url(#sky)"/><circle cx="340" cy="52" r="26" fill="#ffe28a"/><path d="M0 255 Q100 235 200 250 T400 245 V300 H0Z" fill="#a9d8a0"/>`;
const waterTop=`<rect width="400" height="300" fill="url(#sky)"/><rect y="150" width="400" height="150" fill="url(#pond)"/><path d="M0 150 Q50 143 100 150 T200 150 T300 150 T400 150" fill="none" stroke="#e8f7fa" stroke-width="3"/>`;
const underwater=`<rect width="400" height="300" fill="url(#water)"/><path d="M0 285 Q60 262 130 280 T260 276 T400 280 V300 H0Z" fill="#c7b27a"/>
<g stroke="#2f7d55" stroke-width="5" stroke-linecap="round" fill="none"><path d="M40 285 q-10 -50 4 -90"/><path d="M60 285 q12 -40 0 -80"/><path d="M350 285 q10 -60 -4 -110"/><path d="M370 285 q-12 -40 0 -85"/></g>`;
const bubbles=(xs)=>xs.map((x,i)=>`<circle class="bubble" style="animation-delay:${i*0.9}s" cx="${x}" cy="260" r="${4+i%3*2}" fill="none" stroke="#e8f7fa" stroke-width="2"/>`).join('');
const lily=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="0" rx="62" ry="17" fill="#5aae5f"/><path d="M0 0 L62 -6 L56 6Z" fill="#7ec0e8" opacity="0"/><path d="M0 0 L58 -8" stroke="#3f8a52" stroke-width="2"/></g>`;

/* mariposa adulta, centrada en 0,0 */
const butterfly=(s=1)=>`<g transform="scale(${s})">
<g class="flapR"><path d="M3,-4 C32,-70 100,-62 92,-14 C88,6 46,10 3,0Z" fill="#f08a24" stroke="#1d1d1d" stroke-width="3.5" stroke-linejoin="round"/><circle cx="70" cy="-26" r="6" fill="#fff"/><circle cx="52" cy="-8" r="4" fill="#fff"/>
<path d="M3,3 C40,6 78,22 62,56 C46,78 12,44 3,10Z" fill="#f4a73a" stroke="#1d1d1d" stroke-width="3.5" stroke-linejoin="round"/><circle cx="50" cy="38" r="5" fill="#fff"/></g>
<g class="flapL"><g transform="scale(-1 1)"><path d="M3,-4 C32,-70 100,-62 92,-14 C88,6 46,10 3,0Z" fill="#f08a24" stroke="#1d1d1d" stroke-width="3.5" stroke-linejoin="round"/><circle cx="70" cy="-26" r="6" fill="#fff"/><circle cx="52" cy="-8" r="4" fill="#fff"/>
<path d="M3,3 C40,6 78,22 62,56 C46,78 12,44 3,10Z" fill="#f4a73a" stroke="#1d1d1d" stroke-width="3.5" stroke-linejoin="round"/><circle cx="50" cy="38" r="5" fill="#fff"/></g></g>
<ellipse cx="0" cy="12" rx="6" ry="38" fill="#2b2118" transform="rotate(0)"/><circle cx="0" cy="-30" r="8" fill="#2b2118"/>
<path d="M-3 -36 q-8 -20 -20 -24 M3 -36 q8 -20 20 -24" stroke="#2b2118" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>`;

/* oruga: segmentos, cabeza a la derecha */
const caterpillar=(x,y,s=1)=>{
  let g='';for(let i=0;i<6;i++){const cx=-i*21;const c=i%2?'#e9e04e':'#a9d65a';
    g+=`<g class="seg" style="animation-delay:${i*0.14}s"><circle cx="${cx}" cy="0" r="${i===5?12:15}" fill="${c}" stroke="#2f5a22" stroke-width="2.5"/><path d="M${cx-8} 12 v6 M${cx+4} 12 v6" stroke="#2f5a22" stroke-width="3" stroke-linecap="round"/></g>`}
  return `<g transform="translate(${x} ${y}) scale(${s})">${g}<g class="seg"><circle cx="22" cy="-2" r="17" fill="#c9733a" stroke="#2f5a22" stroke-width="2.5"/><circle cx="28" cy="-6" r="4.5" fill="#fff"/><circle cx="29" cy="-6" r="2.2" fill="#1d1d1d"/><path d="M26 6 q6 5 12 0" stroke="#2f2218" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M18 -17 q-4 -12 -12 -14 M28 -17 q4 -12 12 -14" stroke="#2f2218" stroke-width="2.5" fill="none" stroke-linecap="round"/></g></g>`;
};
const chrysalis=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><g class="sway"><path d="M0 0 v10" stroke="#5b3d22" stroke-width="3"/><path d="M0 10 C-24 35 -28 80 0 108 C28 80 24 35 0 10Z" fill="#8fd49a" stroke="#4a9a5c" stroke-width="3"/><path d="M-20 34 q20 8 40 0" stroke="#d4a72e" stroke-width="3" fill="none"/><circle cx="-9" cy="40" r="2.8" fill="#d4a72e"/><circle cx="0" cy="44" r="2.8" fill="#d4a72e"/><circle cx="9" cy="40" r="2.8" fill="#d4a72e"/><path d="M-8 70 q8 14 16 0" stroke="#4a9a5c" stroke-width="2" fill="none"/></g></g>`;

/* libélula adulta mirando a la derecha, centrada en 0,0 */
const dragonfly=(s=1,body='#1f9bb0')=>`<g transform="scale(${s})">
<g class="dflap" style="animation-delay:.09s"><ellipse cx="-4" cy="-32" rx="52" ry="12" fill="#d8f1f7" fill-opacity=".7" stroke="#7fb9c6" stroke-width="2" transform="rotate(-12 -4 -32)"/></g>
<g class="dflap"><ellipse cx="18" cy="-30" rx="52" ry="12" fill="#d8f1f7" fill-opacity=".8" stroke="#7fb9c6" stroke-width="2" transform="rotate(10 18 -30)"/></g>
<path d="M-92 4 L26 0" stroke="${body}" stroke-width="9" stroke-linecap="round"/>
<g stroke="#0f5f6e" stroke-width="2">${[-78,-64,-50,-36,-22,-8].map(x=>`<path d="M${x} -3 v8"/>`).join('')}</g>
<ellipse cx="32" cy="-1" rx="16" ry="12" fill="${body}"/><circle cx="52" cy="-2" r="13" fill="#2fb4b0" stroke="#0f5f6e" stroke-width="2"/><circle cx="56" cy="-5" r="5" fill="#fff"/><circle cx="57" cy="-5" r="2.3" fill="#1d1d1d"/>
<path d="M30 8 l-6 14 M38 9 l-2 15 M24 9 l-12 12" stroke="#0f5f6e" stroke-width="2.5" stroke-linecap="round"/></g>`;
const nymph=(x,y,s=1,pads=false)=>`<g transform="translate(${x} ${y}) scale(${s})"><g class="wiggle">
<g stroke="#5b4630" stroke-width="3.5" stroke-linecap="round" fill="none"><path d="M-6 10 l-12 18 l-8 4 M8 10 l-2 20 l-8 6 M20 8 l8 18 l-2 8 M-6 -6 l-14 -14 M8 -8 l-4 -20 M20 -6 l12 -14"/></g>
<path d="M-62 2 C-62 -9 -34 -13 -10 -12 L34 -10 L34 12 L-10 14 C-34 15 -62 12 -62 2Z" fill="#9a7b52" stroke="#5b4630" stroke-width="3"/>
${pads?'<path d="M-4 -12 q10 -22 28 -16 q-8 12 -16 16Z" fill="#b89c70" stroke="#5b4630" stroke-width="2.5"/>':''}
<path d="M-62 2 l-14 -6 M-62 2 l-14 6 M-62 2 l-12 0" stroke="#5b4630" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="42" cy="0" rx="22" ry="17" fill="#a98a5e" stroke="#5b4630" stroke-width="3"/><circle cx="48" cy="-8" r="9" fill="#e8d9a0" stroke="#5b4630" stroke-width="2.5"/><circle cx="50" cy="-8" r="3.5" fill="#1d1d1d"/><path d="M52 8 q6 4 12 -1" stroke="#5b4630" stroke-width="3" fill="none" stroke-linecap="round"/></g></g>`;

const tadpole=(x,y,s=1,legs=0,tailScale=1)=>`<g transform="translate(${x} ${y}) scale(${s})">
<g class="shrink" style="animation:none"><g class="tail" style="transform:scaleX(${tailScale});transform-origin:left center"><path d="M-6 0 C-40 -18 -78 -16 -96 0 C-78 16 -40 18 -6 0Z" fill="#6c7a52" stroke="#3e4a30" stroke-width="3"/></g></g>
<ellipse cx="14" cy="0" rx="34" ry="24" fill="#6f7f55" stroke="#3e4a30" stroke-width="3"/><ellipse cx="14" cy="8" rx="20" ry="10" fill="#b5c48a" opacity=".7"/><circle cx="34" cy="-9" r="7" fill="#fff"/><circle cx="36" cy="-9" r="3.3" fill="#1d1d1d"/>
${legs>=1?`<path d="M-6 14 C-22 14 -34 24 -40 40 L-26 44 C-22 34 -12 30 0 30Z" fill="#8a9a64" stroke="#3e4a30" stroke-width="3" stroke-linejoin="round"/><path d="M-40 40 l-8 6 M-34 43 l-6 8 M-26 44 l-2 9" stroke="#3e4a30" stroke-width="3" stroke-linecap="round"/>`:''}
${legs>=2?`<path d="M28 18 C36 28 36 40 30 52 L42 54 C50 42 50 28 42 16Z" fill="#8a9a64" stroke="#3e4a30" stroke-width="3" stroke-linejoin="round"/><path d="M30 52 l-6 6 M36 53 l-2 8 M42 54 l4 7" stroke="#3e4a30" stroke-width="3" stroke-linecap="round"/>`:''}</g>`;

const frog=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})">
<path d="M-48 18 C-70 20 -78 40 -54 44 L-20 40Z" fill="#5fae4f" stroke="#2f6a2a" stroke-width="3" stroke-linejoin="round"/>
<ellipse cx="0" cy="0" rx="52" ry="38" fill="#69b957" stroke="#2f6a2a" stroke-width="3"/>
<ellipse cx="14" cy="14" rx="30" ry="20" fill="#e7f2b8"/>
<g class="throat"><ellipse cx="36" cy="10" rx="14" ry="9" fill="#f3e48a" stroke="#c9b24f" stroke-width="2"/></g>
<path d="M18 30 q22 4 34 -4 q-4 12 -22 14Z" fill="#5fae4f" stroke="#2f6a2a" stroke-width="3" stroke-linejoin="round"/>
<g class="blink"><circle cx="20" cy="-34" r="14" fill="#69b957" stroke="#2f6a2a" stroke-width="3"/><circle cx="23" cy="-35" r="8" fill="#fff"/><circle cx="25" cy="-35" r="4" fill="#1d1d1d"/></g>
<g class="blink"><circle cx="-6" cy="-34" r="14" fill="#69b957" stroke="#2f6a2a" stroke-width="3"/><circle cx="-3" cy="-35" r="8" fill="#fff"/><circle cx="-1" cy="-35" r="4" fill="#1d1d1d"/></g>
<path d="M30 -8 q10 4 18 0" stroke="#2f6a2a" stroke-width="3" fill="none" stroke-linecap="round"/></g>`;
const fly=(x,y)=>`<g transform="translate(${x} ${y})"><g class="fly"><ellipse cx="0" cy="0" rx="6" ry="3" fill="#333"/><ellipse class="dflap" cx="-2" cy="-5" rx="6" ry="3" fill="#cfe9f5" opacity=".8"/></g></g>`;

/* ---------- escenas ---------- */
const SC={
 m0:()=>skyBg+`<g stroke="#4f9d69" stroke-width="7" stroke-linecap="round" fill="none"><path d="M200 300 q-6 -50 0 -86"/></g>`+leaf(165,262,36,12,-25,'#82c77c')+leaf(236,258,36,12,205,'#82c77c')
  +`<g transform="translate(200 205)">${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-24" rx="13" ry="22" fill="#f28fb3" transform="rotate(${a})"/>`).join('')}<circle r="14" fill="#f2c14b"/></g>`
  +`<g transform="translate(140 128)"><g class="float">${butterfly(.85)}</g></g><g transform="translate(262 112)"><g class="float" style="animation-delay:-1.2s">${butterfly(.85)}</g></g>`
  +`<text class="heartup" style="animation-delay:0.0s" x="200" y="70" font-size="26" fill="#e56f56" text-anchor="middle">♥</text>`+`<text class="heartup" style="animation-delay:0.9s" x="110" y="90" font-size="26" fill="#e56f56" text-anchor="middle">♥</text>`+`<text class="heartup" style="animation-delay:1.8s" x="290" y="80" font-size="26" fill="#e56f56" text-anchor="middle">♥</text>`,

/* ---------- control ---------- */
const $=s=>document.querySelector(s);
let ci=0,si=0,playing=true,timer=null,t0=0;
let secs=15;
try{const v=parseFloat(localStorage.getItem('meta.secs'));if(v>=4&&v<=45)secs=v}catch(e){}
const DUR=()=>secs*1000;
function showSecs(){$('#spdv').textContent=secs+' s'}
const tabs=$('#tabs');
CYCLES.forEach((c,i)=>{const b=document.createElement('button');b.className='tab';b.role='tab';b.innerHTML=`<span>${ico(c.icon)}</span>${c.name}`;b.onclick=()=>{ci=i;si=0;render();restart()};tabs.appendChild(b)});

function render(){
  const c=CYCLES[ci],s=c.stages[si];
  [...tabs.children].forEach((b,i)=>b.setAttribute('aria-selected',i===ci));
  const sc=$('#scene');sc.innerHTML=DEFS+`<g class="fadein">${SC[s.scene]()}</g>`;
  $('#badge').textContent=c.kind+' · etapa '+(si+1)+' de '+c.stages.length;
  $('#title').textContent=s.n;$('#text').textContent=s.text;$('#fact').textContent='💡 '+s.fact;
  const st=$('#steps');st.innerHTML='';
  c.stages.forEach((x,i)=>{const b=document.createElement('button');b.className='step'+(i<si?' done':'');b.setAttribute('aria-current',i===si);b.innerHTML=`<b>${ico(x.ic)}</b>${x.n}`;b.onclick=()=>{si=i;render();restart()};st.appendChild(b)});
  $('#prev').disabled=si===0;
  $('#next').textContent=si===c.stages.length-1?'Otra vez ↺':'Después ▶';
  showSecs();
}
function restart(){t0=performance.now();if(!timer)loop()}
function loop(){
  timer=requestAnimationFrame(function f(now){
    const el=now-t0;
    const dur=DUR();
    $('#prog').style.width=(playing?Math.min(100,el/dur*100):0)+'%';
    if(playing&&el>=dur){advance(true)}
    timer=requestAnimationFrame(f);
  });
}
function advance(auto){
  const c=CYCLES[ci];
  if(si<c.stages.length-1)si++;
  else if(auto){ /* al terminar, seguir con el siguiente animal */ ci=(ci+1)%CYCLES.length;si=0}
  else si=0;
  render();t0=performance.now();
}
$('#next').onclick=()=>advance(false);
$('#prev').onclick=()=>{if(si>0){si--;render();t0=performance.now()}};
$('#play').onclick=()=>{playing=!playing;$('#play').textContent=playing?'⏸ Pausa':'▶ Seguir';t0=performance.now()};
$('#restart').onclick=()=>{si=0;render();t0=performance.now()};
$('#say').onclick=()=>{try{speechSynthesis.cancel();const s=CYCLES[ci].stages[si];const u=new SpeechSynthesisUtterance(s.n+'. '+s.text+' '+s.fact);u.lang='es-ES';u.rate=.85;speechSynthesis.speak(u)}catch(e){}};
const spd=$('#spd');spd.value=secs;
spd.oninput=()=>{secs=parseFloat(spd.value);try{localStorage.setItem('meta.secs',secs)}catch(e){}showSecs();t0=performance.now()};
render();restart();
</script>

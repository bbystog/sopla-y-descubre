<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lee alto y claro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#13353d;--mist:#e8f2f0;--sea:#1d7f86;--sun:#f2b84b;--leaf:#4f9d69;--coral:#e56f56;--card:#ffffff;--line:#cfe0dd;--soft:#5b7a80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--mist);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:700}
body{background:linear-gradient(180deg,#f3faf8 0%,#e1efec 100%) fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3,.disp{font-family:'Fredoka','Nunito',sans-serif;font-weight:600;margin:0}
#app{max-width:760px;margin:0 auto;padding:14px 16px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top .grow{flex:1;min-width:0}
.btn{appearance:none;border:0;border-radius:16px;padding:14px 20px;font:inherit;font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.1rem;cursor:pointer;background:var(--sea);color:#fff;box-shadow:0 4px 0 #14595e;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #14595e}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #b98a24}
.btn.leaf{background:var(--leaf);box-shadow:0 4px 0 #357048}
.btn.coral{background:var(--coral);box-shadow:0 4px 0 #a54a38}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.small{padding:8px 14px;font-size:.95rem;border-radius:12px}
.btn.big{font-size:1.4rem;padding:18px 28px;width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 6px 24px rgba(19,53,61,.09);border:2px solid #fff}
.chip{display:inline-block;background:var(--mist);border-radius:99px;padding:4px 12px;font-size:.85rem;color:var(--sea)}
.bar{height:10px;border-radius:99px;background:#d6e6e3;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sea),var(--leaf));width:0;transition:width .6s}
.hero{text-align:center;padding:26px 8px 8px}
.hero .owl{font-size:84px;line-height:1}
.hero h1{font-size:2.3rem;margin:6px 0 4px}
.hero p{margin:0 0 16px;color:var(--soft);font-size:1.05rem}
.stack{display:grid;gap:12px}
.read{font-size:var(--fs,1.7rem);line-height:1.55;font-weight:700;letter-spacing:.01em}
.read .w{padding:1px 3px;border-radius:7px;transition:background .15s}
.read .w.ok{background:#cdeed8;color:#17512c}
.read .w.miss{background:#fde0d9;color:#8e2f1e;text-decoration:underline wavy #e56f56}
.live{min-height:1.4em;color:var(--soft);font-size:.95rem;margin-top:8px}
.msg{border-radius:16px;padding:12px 14px;font-size:1.08rem;margin-top:12px;background:#fff6dc;border:2px solid var(--sun)}
.msg.bad{background:#fff0ec;border-color:var(--coral)}
.msg.good{background:#e6f6ec;border-color:var(--leaf)}
.mic{position:relative}
.mic.on{background:var(--coral);box-shadow:0 4px 0 #a54a38;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.025)}}
.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;background:#d8e8e5;display:block}
.ph{width:100%;aspect-ratio:4/3;border-radius:18px;background:linear-gradient(135deg,#cfe6e2,#e8f2f0);display:grid;place-items:center;font-family:'Fredoka';font-size:5rem;color:var(--sea)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.facts{display:grid;gap:4px;color:var(--soft);font-size:.95rem;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tile{background:#fff;border-radius:16px;padding:6px;text-align:center;border:2px solid #fff;box-shadow:0 3px 12px rgba(19,53,61,.08);cursor:pointer;font-size:.8rem;overflow:hidden}
.tile img,.tile .ph{aspect-ratio:1;border-radius:12px;font-size:2rem;object-fit:cover;width:100%}
.tile.lock{opacity:.4;cursor:default}
.modal{position:fixed;inset:0;background:rgba(19,53,61,.55);display:grid;place-items:center;padding:20px;z-index:50}
.modal .card{max-width:440px;width:100%;text-align:center;animation:pop .35s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.modal .big{font-size:64px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
label.opt input{width:22px;height:22px;margin-top:2px;accent-color:var(--sea);flex:none}
.small{font-size:.9rem;color:var(--soft);font-weight:600}
select{max-width:100%}#lvl{width:100%}input[type=number]{max-width:90px}select,input[type=number]{font:inherit;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.meter{height:12px;border-radius:99px;background:#d6e6e3;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;width:0;background:var(--leaf);transition:width .08s}
.tip{background:#eaf5f9;border-radius:14px;padding:10px 12px;font-size:.95rem;color:#24545c;margin-top:10px}
.fade{animation:fade .4s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@media(max-width:420px){.read{font-size:calc(var(--fs,1.7rem) - .15rem)}.hero h1{font-size:1.9rem}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const STAGES=[["Geografía","La Tierra es nuestro planeta. Gran parte de su superficie está cubierta de agua, y por eso se ve azul desde el espacio.","Ballena azul","Balaenoptera musculus","Todos los océanos","Balaenoptera musculus|Ballena azul","La ballena azul es el animal más grande que ha existido. Vive en los océanos y come animalitos diminutos llamados krill.",0],["Geografía","El Polo Norte es el punto más al norte de la Tierra. Allí hace muchísimo frío y hay mucho hielo.","Oso polar","Ursus maritimus","El Ártico","Ursus maritimus|Oso polar","El oso polar vive cerca del Polo Norte. Su pelo parece blanco, pero debajo tiene la piel negra, que le ayuda a guardar el calor.",0],["Geografía","La Antártida es un continente cubierto de hielo. Está en el extremo sur del planeta y casi nadie vive allí.","Pingüino emperador","Aptenodytes forsteri","La Antártida","Aptenodytes forsteri|Pingüino emperador","El pingüino emperador es el más grande de todos los pingüinos. El papá cuida el huevo sobre sus patas para que no se enfríe.",0],["Geografía","África es un continente enorme con selvas, desiertos y sabanas. En sus sabanas viven muchos animales grandes.","Elefante africano","Loxodonta africana","Sabanas de África","Loxodonta africana|Elefante africano","El elefante africano es el animal terrestre más grande. Usa su trompa para beber, oler y saludar a otros elefantes.",0],["Geografía","Australia es a la vez un país y un continente. Está rodeada de mar y tiene muchos animales que solo viven allí.","Canguro rojo","Osphranter rufus","Australia","Osphranter rufus|Canguro rojo","El canguro rojo es el marsupial más grande del mundo. Se mueve a saltos y sus crías crecen en una bolsa de su mamá.",0],["Geografía","Asia es el continente más grande de la Tierra. En ella hay montañas altísimas, desiertos y selvas.","Panda gigante","Ailuropoda melanoleuca","Montañas de China","Ailuropoda melanoleuca|Panda gigante","El panda gigante vive en las montañas de China. Come bambú casi todo el día y puede comer muchos kilos.",0],["Geografía","América del Sur tiene una selva enorme llamada Amazonia. Por ella pasa un río larguísimo, el Amazonas.","Jaguar","Panthera onca","Selvas de América","Panthera onca|Jaguar","El jaguar es el felino más grande de América. Le gusta el agua y nada muy bien, algo raro entre los gatos.",0],["Geografía","El río Amazonas es uno de los más largos del mundo. Lleva más agua que ningún otro río de la Tierra.","Delfín rosado","Inia geoffrensis","Ríos del Amazonas","Inia geoffrensis|Delfín rosado del Amazonas","El delfín rosado vive en los ríos del Amazonas. Cuando crece, su piel se vuelve rosada, y nada entre los árboles inundados.",0],["Geografía","El desierto del Sáhara está en África. Es el desierto cálido más grande del mundo y casi nunca llueve.","Dromedario","Camelus dromedarius","Desiertos de África y Asia","Camelus dromedarius|Dromedario","El dromedario tiene una sola joroba y aguanta muchos días sin beber. En la joroba guarda grasa, que le da energía.",0],["Geografía","La tundra es un lugar muy frío del norte, donde no crecen árboles altos. En verano se llena de flores pequeñas.","Zorro ártico","Vulpes lagopus","La tundra del Ártico","Vulpes lagopus|Zorro ártico","El zorro ártico cambia de color con las estaciones. En invierno es blanco como la nieve y en verano es de color marrón grisáceo.",0],["Geografía","Los océanos son grandes extensiones de agua salada. Se suele hablar de cinco: Pacífico, Atlántico, Índico, Ártico y Antártico.","Tortuga verde","Chelonia mydas","Mares cálidos","Chelonia mydas|Tortuga verde","La tortuga verde recorre miles de kilómetros por el mar. Cuando va a poner huevos, vuelve a la playa donde nació.",0],["Naturaleza","Algunos animales viajan muy lejos cuando llega el frío. A este largo viaje se le llama migración.","Mariposa monarca","Danaus plexippus","Norteamérica y México","Danaus plexippus|Mariposa monarca","La mariposa monarca viaja miles de kilómetros hasta México. Es un viaje larguísimo para un insecto tan pequeño.",0],["Naturaleza","Las aves tienen plumas y casi todas pueden volar. Ponen huevos y los cuidan hasta que nacen los polluelos.","Colibrí abeja","Mellisuga helenae","Cuba","Mellisuga helenae|Colibrí abeja","El colibrí abeja es el ave más pequeña del mundo. Vive en Cuba y mueve las alas tan deprisa que casi no se ven.",0],["Geografía","Una sabana es una llanura con hierba alta y pocos árboles. Hay sabanas muy grandes en África.","Jirafa","Giraffa camelopardalis","Sabanas de África","Giraffa camelopardalis|Jirafa","La jirafa es el animal más alto del mundo. Con su cuello largo llega a las hojas más altas de los árboles.",0],["Naturaleza","El Sol sale por la mañana y se esconde por la tarde. Gracias a él tenemos luz y calor en la Tierra.","León","Panthera leo","Sabanas de África","Panthera leo|León","El león vive en grupos llamados manadas. Los machos tienen una gran melena y su rugido se oye muy lejos.",0],["Geografía","Australia tiene bosques de eucaliptos. Estos árboles altos tienen hojas que huelen muy fuerte.","Koala","Phascolarctos cinereus","Bosques de Australia","Phascolarctos cinereus|Koala","El koala come hojas de eucalipto y duerme muchas horas al día. No es un oso, es un marsupial.",0],["Geografía","La selva tropical es calurosa y húmeda. Allí llueve casi todos los días y crecen árboles altísimos.","Tucán","Ramphastos toco","Selvas de América","Ramphastos toco|Tucán toco","El tucán tiene un pico enorme y de muchos colores. Aunque parece pesado, es muy ligero y le sirve para alcanzar la fruta.",0],["Geografía","El fondo del mar tiene valles, montañas y llanuras, igual que la tierra. Muchas partes todavía no se han explorado.","Pulpo común","Octopus vulgaris","Mares del mundo","Octopus vulgaris|Pulpo común","El pulpo tiene ocho brazos y tres corazones. Es muy listo y puede cambiar de color para esconderse.",0],["Geografía","En el norte del mundo hay grandes bosques de pinos y abetos. En invierno se cubren de nieve.","Búho nival","Bubo scandiacus","El Ártico","Bubo scandiacus|Búho nival","El búho nival tiene plumas blancas y vive en el Ártico. También caza de día, sobre todo pequeños roedores llamados lemmings.",0],["Naturaleza","Las rayas de una cebra son únicas, como las huellas de tus dedos. No hay dos cebras con las mismas rayas.","Cebra","Equus quagga","Sabanas de África","Equus quagga|Cebra","La cebra vive en grupos en África. Se piensa que sus rayas ayudan a espantar insectos y a confundir a los depredadores.",0],["Geografía","Las selvas de América Central están llenas de vida. Allí llueve mucho y crecen plantas de todos los colores.","Rana de ojos rojos","Agalychnis callidryas","Selvas de América Central","Agalychnis callidryas|Rana de ojos rojos","La rana de ojos rojos duerme de día pegada a una hoja. Si se asusta, abre los ojos y enseña sus colores para sorprender.",0],["Geografía","Algunos lagos tienen agua muy salada. En ellos viven algas y gambitas diminutas que sirven de comida a los flamencos.","Flamenco","Phoenicopterus roseus","Lagunas de agua salada","Phoenicopterus roseus|Flamenco común","El flamenco es rosa por lo que come. Descansa a menudo sobre una sola pata y vive en lagunas de agua poco profunda.",0],["Geografía","El río Nilo cruza África de sur a norte. Hace miles de años, el Nilo dio vida a la gran civilización de Egipto.","Hipopótamo","Hippopotamus amphibius","Ríos de África","Hippopotamus amphibius|Hipopótamo","El hipopótamo pasa el día dentro del agua para refrescarse. Sale de noche a comer hierba.",0],["Geografía","Los volcanes son montañas por las que sale roca derretida desde el interior de la Tierra. Esa roca caliente se llama lava.","Gorila de montaña","Gorilla beringei beringei","Montañas de África","Gorilla beringei beringei|Gorila de montaña","El gorila de montaña vive entre volcanes de África. Es fuerte, pero también muy tranquilo, y vive en familia.",0],["Geografía","En el norte de Europa, Asia y América hay grandes bosques fríos. En ellos viven animales de pelo espeso.","Alce","Alces alces","Bosques del norte","Alces alces|Alce","El alce es el ciervo más grande del mundo. Los machos tienen unas astas enormes que pierden y les vuelven a crecer cada año.",0],["Geografía","Un glaciar es un enorme río de hielo que avanza muy despacio. Se forma con la nieve que se acumula durante muchos años.","Foca leopardo","Hydrurga leptonyx","Mares helados de la Antártida","Hydrurga leptonyx|Foca leopardo","La foca leopardo tiene manchas como un leopardo. Es una gran cazadora y come peces, krill y hasta pingüinos.",0],["Naturaleza","Los caracoles llevan su casa a cuestas. Es una concha que los protege del sol y de los peligros.","Caracol de jardín","Cornu aspersum","Jardines y campos","Cornu aspersum|Caracol común","El caracol de jardín se mueve muy despacio, deslizándose sobre una baba. Sale cuando el suelo está húmedo.",0],["Naturaleza","Las flores tienen un polvito amarillo llamado polen. Los insectos lo llevan de una flor a otra y así nacen nuevas plantas.","Abeja melífera","Apis mellifera","Campos y jardines","Apis mellifera|Abeja melífera","La abeja melífera vive en colmenas con miles de hermanas. Con el néctar de las flores fabrica la miel.",0],["Naturaleza","En otoño muchos árboles pierden sus hojas. Antes de caer, se vuelven amarillas, naranjas y rojas.","Zorro rojo","Vulpes vulpes","Bosques y campos","Vulpes vulpes|Zorro rojo","El zorro rojo tiene una cola larga y muy peluda. Oye tan bien que puede encontrar ratones debajo de la nieve.",0],["Geografía","Las montañas más altas tienen nieve durante todo el año. Allí el aire es frío y cuesta respirar.","Águila real","Aquila chrysaetos","Montañas del hemisferio norte","Aquila chrysaetos|Águila real","El águila real vuela muy alto sobre las montañas. Tiene tan buena vista que ve a su presa desde muy lejos.",0],["Geografía","España está en el sur de Europa, en un territorio llamado península ibérica. Está rodeada por el mar Mediterráneo, el océano Atlántico y el mar Cantábrico.","Lince ibérico","Lynx pardinus","España y Portugal","Lynx pardinus|Lince ibérico","El lince ibérico es un gato salvaje con pinceles en las orejas y una pequeña barba. Vive solo en España y Portugal y come sobre todo conejos.",1],["Geografía","La cordillera Cantábrica recorre el norte de España. Sus montañas tienen bosques de robles y hayas, y en ellas llueve mucho.","Oso pardo","Ursus arctos","Montañas y bosques de Europa","Ursus arctos|Oso pardo","El oso pardo es uno de los animales salvajes más grandes de España. Come frutos, raíces y miel, y pasa parte del invierno durmiendo en una cueva.",1],["Geografía","Europa es un continente con muchos países, y España es uno de ellos. Se puede viajar de un país a otro en pocas horas.","Cigüeña blanca","Ciconia ciconia","Europa y África","Ciconia ciconia|Cigüeña blanca","La cigüeña blanca construye enormes nidos en torres y tejados. Muchas viajan a África cuando llega el frío y vuelven en primavera.",1],["Geografía","Los Pirineos son una cordillera entre España y Francia. Sus cumbres son altas y conservan nieve gran parte del año.","Cabra montés","Capra pyrenaica","Montañas de España","Capra pyrenaica|Cabra montés","La cabra montés trepa por las rocas con una agilidad asombrosa. Los machos tienen cuernos largos y curvados que les crecen toda la vida.",1],["Geografía","El mar Mediterráneo está entre Europa, África y Asia. Sus aguas son cálidas y en verano muchas personas visitan sus playas.","Delfín mular","Tursiops truncatus","Mares templados","Tursiops truncatus|Delfín mular","El delfín mular es muy listo y sociable. Se comunica con silbidos y chasquidos, y le gusta saltar y jugar con las olas.",1],["Geografía","Un valle es el terreno bajo que hay entre dos montañas. Muchas veces por él corre un río.","Quebrantahuesos","Gypaetus barbatus","Montañas de Europa, África y Asia","Gypaetus barbatus|Quebrantahuesos","El quebrantahuesos es un buitre enorme que vive en las montañas. Deja caer huesos desde el aire para romperlos y comer lo que hay dentro.",1],["Geografía","Una isla es un trozo de tierra rodeado de agua por todas partes. España tiene islas como Mallorca, Menorca o Tenerife.","Tortuga boba","Caretta caretta","Mares templados del mundo","Caretta caretta|Tortuga boba","La tortuga boba nada por el Mediterráneo y por el Atlántico. Pone sus huevos en la arena de las playas, de noche y con mucha tranquilidad.",1],["Geografía","El sur de España tiene un clima cálido y soleado. En verano hace mucho calor y casi no llueve.","Camaleón común","Chamaeleo chamaeleon","Sur de España y norte de África","Chamaeleo chamaeleon|Camaleón común","El camaleón común vive en el sur de España. Cada uno de sus ojos se mueve por su lado y su lengua es larguísima para atrapar insectos.",1],["Geografía","En las montañas del norte de España hay bosques húmedos donde crecen helechos y musgo. Son lugares tranquilos y llenos de vida.","Urogallo","Tetrao urogallus","Bosques de montaña de Europa","Tetrao urogallus|Urogallo","El urogallo es un ave grande del bosque. Los machos hacen sonidos extraños y bailan para llamar la atención de las hembras.",1],["Geografía","Europa tiene bosques muy antiguos que casi no han cambiado en siglos. En algunos de ellos todavía se pueden ver animales grandes.","Bisonte europeo","Bison bonasus","Bosques del este de Europa","Bison bonasus|Bisonte europeo","El bisonte europeo es el mamífero terrestre más pesado de Europa. Estuvo a punto de desaparecer, pero hoy vive otra vez en libertad en algunos bosques.",1],["Naturaleza","Un bosque es un lugar con muchos árboles juntos. En él viven aves, insectos, plantas y mamíferos que se necesitan unos a otros.","Lobo ibérico","Canis lupus signatus","Península ibérica","Canis lupus signatus|Lobo ibérico|Lobo","El lobo ibérico vive en grupos familiares llamados manadas. Aúlla para comunicarse con los suyos y su aullido se oye muy lejos.",1],["Geografía","El bosque mediterráneo tiene encinas, alcornoques y matorrales. Sus hojas son duras para aguantar el calor del verano.","Gineta","Genetta genetta","Europa y África","Genetta genetta|Gineta","La gineta parece un gato muy esbelto con una larga cola de anillos. Sale de noche, trepa muy bien y caza ratones, pájaros e insectos.",1],["Geografía","Un río nace en la montaña, baja por los valles y casi siempre termina en el mar. En su camino da agua a plantas y animales.","Nutria europea","Lutra lutra","Ríos de Europa y Asia","Lutra lutra|Nutria europea|Nutria","La nutria europea nada de maravilla y tiene el pelo tan denso que no deja pasar el agua. Come peces, ranas y cangrejos.",1],["Naturaleza","La lluvia llena los ríos y las lagunas, y hace crecer las plantas. Después de llover, el bosque huele a tierra mojada.","Salamandra común","Salamandra salamandra","Bosques húmedos de Europa","Salamandra salamandra|Salamandra común","La salamandra común tiene la piel negra con manchas amarillas, que avisan de que no conviene comerla. Sale en las noches húmedas.",1],["Naturaleza","En otoño los días son más cortos y empiezan los fríos. Algunos animales se preparan para pasar el invierno durmiendo.","Erizo europeo","Erinaceus europaeus","Bosques y jardines de Europa","Erinaceus europaeus|Erizo europeo","El erizo europeo está cubierto de miles de púas. Cuando tiene miedo se hace una bola, y en invierno duerme en un refugio.",1],["Naturaleza","Algunos animales hacen su casa bajo tierra. Las madrigueras son túneles que los protegen del frío, del calor y de los peligros.","Tejón europeo","Meles meles","Bosques de Europa","Meles meles|Tejón europeo|Tejón","El tejón excava grandes madrigueras con muchas entradas. Sale de noche a buscar lombrices, frutas y pequeños animales.",1],["Geografía","Los ríos de montaña tienen agua fresca y limpia. En ellos viven pequeños animales que necesitan que el agua no esté sucia.","Desmán ibérico","Galemys pyrenaicus","Ríos de montaña de España y Portugal","Galemys pyrenaicus|Desmán ibérico","El desmán ibérico es un pequeño mamífero con una trompa larga y móvil. Nada muy bien y vive solo en algunos ríos de montaña de España y Portugal.",1],["Geografía","Las dehesas son bosques abiertos de encinas, con pastos para el ganado. Solo existen en España y Portugal.","Águila imperial ibérica","Aquila adalberti","España y Portugal","Aquila adalberti|Águila imperial ibérica","El águila imperial ibérica tiene manchas blancas en los hombros. Vive en España y Portugal y construye su nido en lo alto de los árboles.",1],["Geografía","Los arroyos de montaña bajan con mucha fuerza. Sus aguas frías y transparentes forman cascadas y pequeñas pozas.","Mirlo acuático","Cinclus cinclus","Arroyos de montaña de Europa","Cinclus cinclus|Mirlo acuático","El mirlo acuático es un pájaro que camina por el fondo de los arroyos. Se sumerge para buscar larvas de insectos entre las piedras.",1],["Geografía","Los lagos son grandes extensiones de agua rodeadas de tierra. Pueden ser de agua dulce o de agua salada.","Trucha común","Salmo trutta","Ríos fríos de Europa","Salmo trutta|Trucha común|Trucha","La trucha común vive en ríos fríos de aguas limpias. Salta fuera del agua para atrapar insectos y nada contra la corriente.",1],["Geografía","Los ríos desembocan en el mar. El lugar donde el río y el mar se encuentran se llama desembocadura.","Salmón atlántico","Salmo salar","Atlántico norte y sus ríos","Salmo salar|Salmón del Atlántico|Salmón atlántico","El salmón atlántico nace en un río, vive en el mar y vuelve al río para poner huevos. Para llegar hasta allí salta cascadas.",1],["Naturaleza","Las charcas son pequeños depósitos de agua. En ellas viven renacuajos, libélulas y muchos otros animales.","Cangrejo de río","Austropotamobius pallipes","Ríos de Europa","Austropotamobius pallipes|Cangrejo de río","El cangrejo de río tiene diez patas, dos de ellas con grandes pinzas. Se esconde bajo las piedras de día y sale de noche a comer.",1],["Naturaleza","En verano el calor aprieta y el campo se llena de sonidos. Uno de los más conocidos es el canto de las cigarras.","Cigarra","Cicadidae","Zonas cálidas del mundo","Cicadidae|Cigarra","La cigarra pasa años bajo tierra antes de salir al aire libre. Los machos cantan con una membrana de su cuerpo que vibra muy deprisa.",1],["Naturaleza","Por la noche el cielo se llena de estrellas. Lejos de las ciudades se ven muchísimas, porque hay menos luces.","Luciérnaga","Lampyridae","Zonas templadas y tropicales","Lampyridae|Luciérnaga","La luciérnaga produce luz en su cuerpo para comunicarse con otras luciérnagas. Es una luz fría que no quema.",1],["Naturaleza","Las plantas necesitan luz, agua y aire para crecer. Con la luz del Sol fabrican su propio alimento.","Mantis religiosa","Mantis religiosa","Europa, África y Asia","Mantis religiosa","La mantis religiosa espera inmóvil con las patas delanteras plegadas. Cuando pasa un insecto, lo atrapa en un instante.",1],["Historia","Los antiguos egipcios vieron a un escarabajo rodar una bolita y pensaron que empujaba el Sol por el cielo. Por eso lo consideraban sagrado.","Escarabajo pelotero","Scarabaeus sacer","Zonas cálidas de África y Europa","Scarabaeus sacer|Escarabajo pelotero","El escarabajo pelotero hace bolas con excrementos de otros animales y las empuja con las patas traseras. Con ellas se alimenta y cuida a sus crías.",1],["Geografía","Una cueva es un hueco grande dentro de la roca. Algunas son muy profundas, oscuras y húmedas.","Murciélago grande de herradura","Rhinolophus ferrumequinum","Cuevas de Europa, África y Asia","Rhinolophus ferrumequinum|Murciélago grande de herradura","El murciélago de herradura descansa colgado boca abajo en las cuevas. De noche emite sonidos que rebotan en los objetos y le ayudan a orientarse.",1],["Geografía","El mar Mediterráneo tiene aguas cálidas y mucha vida. Antiguamente lo visitaban grandes focas que hoy son muy raras.","Foca monje del Mediterráneo","Monachus monachus","Mar Mediterráneo y Atlántico","Monachus monachus|Foca monje del Mediterráneo","La foca monje del Mediterráneo es una de las focas más escasas del mundo. Descansa y cría en cuevas junto al mar.",1],["Geografía","Las costas son el borde entre la tierra y el mar. Allí hay playas, acantilados, rocas y calas.","Sepia común","Sepia officinalis","Mares templados","Sepia officinalis|Sepia común|Sepia","La sepia cambia de color en un instante para esconderse o comunicarse. Tiene tres corazones y lanza tinta cuando se asusta.",1],["Naturaleza","Las algas son plantas del mar. Algunas crecen en forma de grandes praderas donde viven muchos animales pequeños.","Caballito de mar","Hippocampus","Mares templados y tropicales","Hippocampus|Caballito de mar","El caballito de mar nada de pie y se agarra a las algas con la cola. El macho lleva los huevos en una bolsa hasta que nacen las crías.",1],["Historia","Hace miles de años, junto al río Nilo, nació el antiguo Egipto. Sus habitantes construyeron templos, ciudades y enormes pirámides de piedra.","Ibis sagrado","Threskiornis aethiopicus","África","Threskiornis aethiopicus|Ibis sagrado","El ibis sagrado es un ave blanca de cuello y cabeza negros, con un pico largo y curvado. Los antiguos egipcios lo respetaban mucho y lo representaban en sus dibujos.",2],["Historia","Los egipcios vivían cerca del Nilo porque sus aguas regaban los campos. Cada año el río crecía y dejaba una tierra negra muy fértil.","Cocodrilo del Nilo","Crocodylus niloticus","Ríos y lagos de África","Crocodylus niloticus|Cocodrilo del Nilo","El cocodrilo del Nilo puede pasar horas casi sin moverse, esperando una presa. Las mamás cuidan sus huevos y llevan a las crías al agua con la boca.",2],["Historia","Los faraones eran los reyes del antiguo Egipto. Sobre la frente llevaban la imagen de una serpiente, símbolo de poder y de protección.","Cobra egipcia","Naja haje","África","Naja haje|Cobra egipcia","La cobra egipcia levanta el cuerpo y abre su capucha cuando se siente amenazada. Su veneno es muy fuerte, así que es mejor mantenerse lejos.",2],["Historia","Los egipcios construyeron las pirámides como tumbas para sus faraones. La más grande, la pirámide de Guiza, se levantó hace más de cuatro mil años.","Mangosta egipcia","Herpestes ichneumon","África y sur de Europa","Herpestes ichneumon|Mangosta egipcia","La mangosta egipcia es rápida y valiente. Puede cazar serpientes, ratones y huevos de aves, y los antiguos egipcios la apreciaban por eso.",2],["Historia","Los egipcios escribían con dibujos llamados jeroglíficos. Cada dibujo representaba una palabra o un sonido, y los grababan en piedra o los pintaban en papiro.","Babuino sagrado","Papio hamadryas","Noreste de África y Arabia","Papio hamadryas|Babuino sagrado","El babuino sagrado vive en grupos grandes y pasa la noche en las rocas. Los egipcios lo asociaban con el dios de la escritura, Thot.",2],["Historia","Mesopotamia significa tierra entre ríos, porque está entre el Tigris y el Éufrates. Allí se inventó la escritura hace más de cinco mil años.","Chacal dorado","Canis aureus","África, Europa y Asia","Canis aureus|Chacal dorado","El chacal dorado se parece a un lobo pequeño y vive en parejas o en grupos familiares. Come frutos, insectos y pequeños animales, y aúlla al atardecer.",2],["Historia","Los antiguos griegos eran grandes marineros. Navegaban por el mar Mediterráneo para comerciar y fundaron muchas ciudades en sus orillas.","Halcón peregrino","Falco peregrinus","Casi todo el mundo","Falco peregrinus|Halcón peregrino","El halcón peregrino es el animal más rápido del mundo. Cuando se lanza en picado sobre su presa, supera los trescientos kilómetros por hora.",2],["Historia","Atenas fue una de las ciudades más importantes de la antigua Grecia. Allí nació la democracia, una forma de gobierno en la que el pueblo vota.","Mochuelo europeo","Athene noctua","Europa, Asia y norte de África","Athene noctua|Mochuelo europeo","El mochuelo europeo es un búho pequeño con ojos amarillos y mirada seria. Los atenienses lo ponían en sus monedas como símbolo de sabiduría.",2],["Historia","Los primeros Juegos Olímpicos se celebraron en Olimpia, en Grecia, hace casi tres mil años. Los atletas corrían, saltaban y lanzaban la jabalina.","Caballo de Przewalski","Equus ferus przewalskii","Estepas de Mongolia","Equus ferus przewalskii|Caballo de Przewalski","El caballo de Przewalski es el último caballo realmente salvaje. Es bajo y fuerte, con una melena corta y erguida, y vive en las estepas de Mongolia.",2],["Historia","Aníbal fue un general de Cartago que cruzó los Alpes con un ejército y elefantes. Fue un viaje larguísimo, por montañas nevadas y muy frías.","Elefante asiático","Elephas maximus","Sur y sureste de Asia","Elephas maximus|Elefante asiático","El elefante asiático es más pequeño que el africano y tiene las orejas menores. Desde hace siglos las personas lo han usado para trabajar.",2],["Historia","Según una leyenda, Roma fue fundada por dos hermanos gemelos, Rómulo y Remo. Cuentan que una loba los cuidó cuando eran bebés.","Lobo gris","Canis lupus","Norteamérica, Europa y Asia","Canis lupus|Lobo gris","El lobo gris vive y caza en manada. Cada manada tiene un territorio, y los lobos se comunican con aullidos que se oyen a muchos kilómetros.",2],["Historia","Los romanos construyeron carreteras, acueductos y puentes tan sólidos que muchos siguen en pie. Un acueducto servía para llevar agua a las ciudades.","Ganso común","Anser anser","Europa y Asia","Anser anser|Ganso común|Ganso silvestre","Los gansos advirtieron con sus graznidos a los romanos de un ataque nocturno al Capitolio, según cuenta la historia. Son aves vigilantes y muy ruidosas.",2],["Historia","El Imperio romano llegó a ocupar casi todo el Mediterráneo. En él se hablaba latín, de donde nacieron el español y otros idiomas.","Buitre leonado","Gyps fulvus","Sur de Europa, norte de África y Asia","Gyps fulvus|Buitre leonado","El buitre leonado planea durante horas sin batir las alas. Se alimenta de animales muertos, y así mantiene limpio el campo.",2],["Historia","La Ruta de la Seda fue un camino de miles de kilómetros que unía China con Europa. Por ella viajaban comerciantes con telas, especias y otros tesoros.","Camello bactriano","Camelus bactrianus","Desiertos de Asia central","Camelus bactrianus|Camello bactriano","El camello bactriano tiene dos jorobas y soporta el frío del invierno y el calor del verano. Cargaba con mercancías por la Ruta de la Seda.",2],["Geografía","El Himalaya es la cordillera más alta del mundo. Allí se encuentra el monte Everest, con casi nueve mil metros de altura.","Yak","Bos grunniens","Montañas del Himalaya y Tíbet","Bos grunniens|Yak","El yak tiene un pelaje largo y espeso que lo protege del frío extremo. Vive a gran altura, donde el aire tiene poco oxígeno.",2],["Historia","Hace mucho tiempo, las personas comenzaron a criar animales en granjas. Así tenían huevos, leche y carne sin tener que ir siempre a cazar.","Gallo bankiva","Gallus gallus","Sureste de Asia","Gallus gallus|Gallo bankiva","El gallo bankiva es el antepasado salvaje de las gallinas. Vive en los bosques del sureste de Asia, y el macho tiene plumas brillantes.",2],["Historia","Según una leyenda china, una princesa descubrió la seda cuando un capullo cayó en su té. La seda fue un secreto de China durante siglos.","Gusano de seda","Bombyx mori","China","Bombyx mori|Gusano de seda","El gusano de seda es la oruga de una polilla. Se envuelve en un capullo hecho de un único hilo larguísimo, del que se obtiene la seda.",2],["Geografía","China es uno de los países más grandes del mundo. Tiene una muralla enorme, construida a lo largo de siglos para proteger sus fronteras.","Panda rojo","Ailurus fulgens","Montañas del Himalaya y China","Ailurus fulgens|Panda rojo","El panda rojo vive en los bosques de montaña y trepa a los árboles con facilidad. Su cola larga y anillada le sirve de abrigo.",2],["Geografía","La India es un país muy grande del sur de Asia. Tiene montañas nevadas, selvas, desiertos y ríos sagrados, como el Ganges.","Tigre de Bengala","Panthera tigris tigris","India y países vecinos","Panthera tigris tigris|Tigre de Bengala","El tigre de Bengala tiene un pelaje anaranjado con rayas negras, distintas en cada individuo. Es buen nadador y caza sobre todo de noche.",2],["Geografía","El río Ganges nace en el Himalaya y recorre el norte de la India. Millones de personas viven cerca de sus orillas y lo consideran sagrado.","Rinoceronte indio","Rhinoceros unicornis","India y Nepal","Rhinoceros unicornis|Rinoceronte indio","El rinoceronte indio tiene un solo cuerno y una piel con pliegues, como si llevara armadura. Le gusta bañarse en el barro y en los ríos.",2],["Historia","Los palacios de los antiguos reyes de la India tenían jardines con fuentes y animales de lujo. Ahí se paseaban aves de plumas muy llamativas.","Pavo real común","Pavo cristatus","India y Sri Lanka","Pavo cristatus|Pavo real común|Pavo real","El pavo real macho abre su cola como un abanico lleno de ojos de colores. Lo hace para impresionar a las hembras.",2],["Geografía","Las selvas del sur de Asia son calurosas y húmedas. Allí se esconden serpientes enormes, aves de colores y animales que casi nadie ve.","Cobra real","Ophiophagus hannah","Sur y sureste de Asia","Ophiophagus hannah|Cobra real","La cobra real es la serpiente venenosa más larga del mundo. Su alimento favorito son otras serpientes, y es la única que construye un nido.",2],["Historia","Los mayas fueron un pueblo de Centroamérica que levantó ciudades con grandes pirámides. Eran expertos observando las estrellas y midiendo el tiempo.","Quetzal","Pharomachrus mocinno","Bosques nubosos de Centroamérica","Pharomachrus mocinno|Quetzal","El quetzal macho tiene plumas verdes y brillantes y una cola larguísima. Para los mayas era un ave sagrada, símbolo de libertad.",2],["Historia","Los mayas escribían con signos que hoy se llaman glifos. Con ellos anotaban su calendario, sus reyes y las historias de sus dioses.","Guacamayo rojo","Ara macao","Selvas de América","Ara macao|Guacamayo rojo","El guacamayo rojo tiene plumas escarlata, azules y amarillas. Es muy ruidoso y puede vivir más de cincuenta años.",2],["Geografía","Centroamérica es una franja de tierra estrecha que une dos continentes. Entre sus costas hay volcanes, selvas y playas.","Tapir centroamericano","Tapirus bairdii","Centroamérica y norte de Colombia","Tapirus bairdii|Tapir centroamericano","El tapir centroamericano tiene una pequeña trompa con la que agarra hojas y frutos. Nada y bucea muy bien, y descansa en la selva.",2],["Historia","Los incas construyeron un gran imperio en las montañas de los Andes. Sus caminos y puentes colgantes comunicaban ciudades muy lejanas.","Llama","Lama glama","Los Andes","Lama glama|Llama","La llama es un animal fuerte que los incas usaban para transportar cargas. Cuando se enfada, puede escupir a quien la molesta.",2],["Historia","Machu Picchu es una ciudad inca construida en lo alto de una montaña. Sus muros de piedra encajan tan bien que no necesitan cemento.","Alpaca","Vicugna pacos","Los Andes","Vicugna pacos|Alpaca","La alpaca se cría por su lana, muy suave y cálida. Vive en grupos y en los Andes ayuda a muchas familias a ganarse la vida.",2],["Geografía","Los Andes son la cordillera más larga del mundo. Recorren América del Sur de norte a sur y tienen cumbres cubiertas de nieve.","Vicuña","Vicugna vicugna","Los Andes","Vicugna vicugna|Vicuña","La vicuña es un pariente salvaje y delgado de la llama. Su lana es finísima y los incas la reservaban para sus reyes.",2],["Geografía","En los Andes el aire es muy fino porque se está a mucha altura. Las aves que allí viven vuelan sin esfuerzo sobre los valles.","Cóndor andino","Vultur gryphus","Los Andes","Vultur gryphus|Cóndor andino","El cóndor andino es una de las aves voladoras más grandes del mundo. Con las alas abiertas mide más de tres metros.",2],["Historia","Hace mucho tiempo, los reyes de Persia y de Mesopotamia cazaban leones y los dibujaban en sus palacios. Los consideraban símbolo de fuerza.","León asiático","Panthera leo persica","Bosque de Gir, India","Panthera leo persica|León asiático","El león asiático vive hoy solo en un bosque de la India. Es algo más pequeño que el africano y su melena es más corta.",2],["Minerales","Una roca es un trozo duro de la Tierra, formado por uno o varios minerales. Hay rocas de muchos colores, tamaños y formas.","Topo europeo","Talpa europaea","Europa y Asia","Talpa europaea|Topo europeo","El topo europeo pasa casi toda la vida bajo tierra. Con sus patas delanteras, anchas como palas, excava largos túneles en busca de lombrices.",3],["Minerales","Los minerales son materiales sólidos que se forman en la naturaleza. Nunca han estado vivos y tienen formas muy ordenadas, como los cristales.","Rata topo desnuda","Heterocephalus glaber","Este de África","Heterocephalus glaber|Rata topo desnuda","La rata topo desnuda vive en colonias bajo tierra, con una reina que manda. Excava túneles muy largos con sus grandes dientes delanteros.",3],["Minerales","El cuarzo es un mineral muy común. Puede ser transparente como el agua, y la arena de muchas playas está hecha de pequeños granos de cuarzo.","Armadillo de nueve bandas","Dasypus novemcinctus","América","Dasypus novemcinctus|Armadillo de nueve bandas","El armadillo tiene una coraza de placas duras que lo protege. Excava con sus garras para buscar insectos y gusanos.",3],["Minerales","Un cristal es un sólido con caras planas y lisas. Algunos cristales se forman cuando el agua con minerales se enfría despacio.","Pangolín terrestre","Smutsia temminckii","África","Smutsia temminckii|Pangolín terrestre","El pangolín está cubierto de escamas duras, del mismo material que nuestras uñas. Cuando se asusta, se enrolla como una bola.",3],["Minerales","El granito es una roca muy dura que se usa para hacer edificios y monumentos. En él se pueden ver puntitos brillantes y de colores.","Oso hormiguero gigante","Myrmecophaga tridactyla","América Central y del Sur","Myrmecophaga tridactyla|Oso hormiguero gigante","El oso hormiguero gigante no tiene dientes. Con su lengua, que mide más de medio metro, atrapa hormigas y termitas sin parar.",3],["Minerales","La arcilla es una tierra suave que, mojada, se puede moldear. Al cocerla se pone dura y sirve para hacer ladrillos y vasijas.","Cerdo hormiguero","Orycteropus afer","África","Orycteropus afer|Cerdo hormiguero","El cerdo hormiguero es un animal nocturno que excava madrigueras y se alimenta de termitas. Tiene orejas largas y un hocico en forma de tubo.",3],["Minerales","El desierto está lleno de arena y de rocas. De día hace un calor enorme, pero de noche puede refrescar mucho.","Lagarto cornudo","Phrynosoma","Desiertos de América del Norte","Phrynosoma|Lagarto cornudo","El lagarto cornudo tiene el cuerpo plano y lleno de espinas. Su color se parece tanto a la arena que es muy difícil verlo.",3],["Minerales","Algunos minerales son metales. Los metales son duros, brillan y se pueden calentar y moldear para fabricar herramientas, monedas y joyas.","Monstruo de Gila","Heloderma suspectum","Desiertos de México y Estados Unidos","Heloderma suspectum|Monstruo de Gila","El monstruo de Gila es un lagarto lento, de piel negra y naranja. Guarda reservas de grasa en la cola y puede pasar meses sin comer.",3],["Minerales","La sal que ponemos en la comida es un mineral. Se puede sacar del mar, dejando que el agua se evapore, o de minas bajo tierra.","Zorro fénec","Vulpes zerda","Desierto del Sáhara","Vulpes zerda|Zorro fénec|Fénec","El fénec es el zorro más pequeño del mundo. Sus enormes orejas le dan buen oído y le ayudan a soltar el calor del cuerpo.",3],["Minerales","El oro es un metal amarillo y brillante que no se oxida. Desde hace miles de años se usa para hacer joyas, monedas y objetos valiosos.","Suricata","Suricata suricatta","Desiertos del sur de África","Suricata suricatta|Suricata","La suricata vive en grupos familiares. Siempre hay una vigilante que se pone de pie y avisa a las demás si ve algún peligro.",3],["Minerales","El cobre es un metal de color rojizo que conduce muy bien la electricidad. Por eso se usa en los cables y en muchos aparatos.","Escorpión emperador","Pandinus imperator","África occidental","Pandinus imperator|Escorpión emperador","El escorpión emperador es grande y de color negro. Si se le ilumina con luz ultravioleta, su cuerpo brilla con un color azul verdoso.",3],["Minerales","Las conchas del mar están hechas de un mineral llamado carbonato de calcio. Este mismo mineral forma la roca llamada caliza.","Cangrejo ermitaño","Pagurus bernhardus","Costas de Europa","Pagurus bernhardus|Cangrejo ermitaño","El cangrejo ermitaño no tiene concha propia, así que se protege dentro de la de un caracol vacío. Cuando crece, se muda a una más grande.",3],["Minerales","Los arrecifes de coral son estructuras de piedra caliza construidas poco a poco. Los forman animales diminutos que viven en el mar.","Coral cerebro","Diploria labyrinthiformis","Mares cálidos del Caribe","Diploria labyrinthiformis|Coral cerebro","El coral cerebro está formado por muchos pólipos diminutos que construyen un esqueleto de piedra. Su superficie recuerda a un cerebro.",3],["Minerales","La arena de la playa se forma cuando el viento, el agua y el tiempo van rompiendo las rocas en granitos muy pequeños.","Estrella de mar común","Asterias rubens","Costas del Atlántico norte","Asterias rubens|Estrella de mar común|Estrella de mar","La estrella de mar tiene cinco brazos y no tiene cerebro. Si pierde un brazo, puede hacer que le crezca otro.",3],["Minerales","Las olas rompen contra las rocas y las desgastan durante siglos. Así se forman los acantilados y las pequeñas calas.","Erizo de mar","Paracentrotus lividus","Mar Mediterráneo y Atlántico","Paracentrotus lividus|Erizo de mar","El erizo de mar es una bola cubierta de púas. Se mueve despacio sobre las rocas con unos pequeños pies con ventosas.",3],["Minerales","Una perla es una bolita brillante que se forma dentro de ciertas conchas. Se considera una joya, aunque no sea una piedra.","Ostra perlífera","Pinctada margaritifera","Mares cálidos del Pacífico e Índico","Pinctada margaritifera|Ostra perlífera","Cuando un grano de arena entra en la ostra, ella lo cubre capa a capa con una sustancia suave y brillante. Así se forma la perla.",3],["Minerales","En los mares cálidos hay almejas muy grandes. Sus conchas son tan duras como piedras y, con el tiempo, pueden convertirse en fósiles.","Almeja gigante","Tridacna gigas","Mares cálidos del Pacífico","Tridacna gigas|Almeja gigante","La almeja gigante es el molusco con concha más grande del mundo. Puede medir más de un metro y vivir cien años.",3],["Minerales","Un fósil es el resto de un ser vivo que se ha conservado en la roca durante millones de años. Los fósiles nos cuentan cómo era la vida antigua.","Nautilo","Nautilus pompilius","Mares del Indo-Pacífico","Nautilus pompilius|Nautilo","El nautilo tiene una concha en espiral dividida en cámaras. Casi no ha cambiado en cientos de millones de años.",3],["Minerales","Los trilobites fueron animales marinos que ya no existen. Los conocemos porque dejaron fósiles de más de quinientos millones de años.","Cangrejo herradura","Limulus polyphemus","Costas de América del Norte","Limulus polyphemus|Cangrejo herradura","El cangrejo herradura tiene sangre de color azul y existe desde hace más de cuatrocientos millones de años. Es un auténtico fósil viviente.",3],["Minerales","Los científicos buscan fósiles estudiando las capas de roca. Cada capa se formó en un momento distinto de la historia de la Tierra.","Celacanto","Latimeria chalumnae","Océano Índico","Latimeria chalumnae|Celacanto","Se creía que el celacanto llevaba millones de años extinguido, pero en mil novecientos treinta y ocho se pescó uno vivo. Vive en aguas profundas.",3],["Minerales","Algunos animales de hoy se parecen mucho a los de hace millones de años. Los llamamos fósiles vivientes.","Tuátara","Sphenodon punctatus","Nueva Zelanda","Sphenodon punctatus|Tuátara","El tuátara es un reptil de Nueva Zelanda muy parecido a los de hace doscientos millones de años. Vive muchísimos años y es muy lento.",3],["Minerales","El hierro es un metal muy fuerte y pesado. Con él se fabrican puentes, trenes, barcos y miles de herramientas.","Ornitorrinco","Ornithorhynchus anatinus","Este de Australia","Ornithorhynchus anatinus|Ornitorrinco","El ornitorrinco es un mamífero que pone huevos. Tiene pico de pato, cola de castor y patas con membranas para nadar.",3],["Minerales","El imán es una piedra especial que atrae al hierro. La brújula usa un imán para señalar siempre hacia el norte.","Equidna de pico corto","Tachyglossus aculeatus","Australia y Nueva Guinea","Tachyglossus aculeatus|Equidna de pico corto|Equidna","El equidna está cubierto de púas y pone huevos. Con su larga lengua pegajosa atrapa hormigas y termitas.",3],["Minerales","Las cuevas se forman cuando el agua va disolviendo poco a poco la roca durante miles de años. Dentro puede reinar una oscuridad total.","Pez ciego de las cuevas","Astyanax mexicanus","Cuevas de México","Astyanax mexicanus|Pez ciego de las cuevas|Pez ciego mexicano","Algunos peces de cueva han perdido los ojos porque en la oscuridad no los necesitan. Se orientan con otros sentidos, como el tacto.",3],["Minerales","Las estalactitas cuelgan del techo de las cuevas, y las estalagmitas crecen desde el suelo. Se forman gota a gota durante siglos.","Proteo","Proteus anguinus","Cuevas del sureste de Europa","Proteus anguinus|Proteo","El proteo es un anfibio ciego de piel clara que vive en cuevas con agua. Puede pasar años sin comer y vive más de cien años.",3],["Minerales","El calor y la presión dentro de la Tierra transforman las rocas. Así, la caliza se convierte en mármol, una roca muy bonita.","Gecko leopardo","Eublepharis macularius","Asia central y meridional","Eublepharis macularius|Gecko leopardo","El gecko leopardo tiene manchas y guarda grasa en la cola. A diferencia de otros geckos, tiene párpados y no trepa por las paredes.",3],["Minerales","Hay lagos tan salados que casi nada puede vivir en ellos. Cuando el agua se seca, deja una gruesa capa blanca de sal.","Artemia","Artemia salina","Lagos salados del mundo","Artemia salina|Artemia","La artemia es un diminuto crustáceo que vive en aguas muy saladas. Sus huevos resisten la sequía durante años y eclosionan al mojarse.",3],["Minerales","El volcán expulsa lava, cenizas y gases. Cuando la lava se enfría, se convierte en una roca oscura y dura llamada basalto.","Dragón de Komodo","Varanus komodoensis","Islas de Indonesia","Varanus komodoensis|Dragón de Komodo","El dragón de Komodo es el lagarto más grande del mundo. Vive en islas volcánicas de Indonesia y puede medir tres metros.",3],["Minerales","Las islas Galápagos nacieron de volcanes que surgieron del fondo del mar. En sus rocas negras viven animales que no existen en otro lugar.","Iguana marina","Amblyrhynchus cristatus","Islas Galápagos","Amblyrhynchus cristatus|Iguana marina","La iguana marina de las Galápagos es la única que se zambulle en el mar. Come algas y luego estornuda para soltar la sal.",3],["Geología","La Tierra está formada por capas, como una cebolla. En el centro hay un núcleo muy caliente, después el manto y, por fuera, la corteza donde vivimos.","Tiburón ballena","Rhincodon typus","Mares cálidos","Rhincodon typus|Tiburón ballena","El tiburón ballena es el pez más grande del mundo. A pesar de su tamaño, solo come plancton, es decir, animalitos y algas diminutos.",4],["Geología","La corteza terrestre está rota en grandes piezas llamadas placas. Las placas se mueven muy despacio, unos pocos centímetros cada año.","Tiburón blanco","Carcharodon carcharias","Mares templados y cálidos","Carcharodon carcharias|Tiburón blanco","El tiburón blanco tiene muchas filas de dientes. Cuando pierde uno, otro nuevo ocupa su lugar, así que nunca se queda sin dientes.",4],["Geología","Cuando dos placas chocan, la tierra se arruga y se levantan montañas. Así se formaron el Himalaya y los Alpes.","Manta raya gigante","Mobula birostris","Mares tropicales y templados","Mobula birostris|Manta raya gigante|Manta raya","La manta raya gigante parece que vuela bajo el agua moviendo sus enormes aletas. Con las alas abiertas puede medir siete metros.",4],["Geología","Un terremoto ocurre cuando las placas de la Tierra se mueven de golpe y el suelo tiembla. Algunos son tan suaves que ni se notan.","Pez luna","Mola mola","Mares templados y tropicales","Mola mola|Pez luna","El pez luna parece una cabeza redonda con aletas. Es el pez óseo más pesado del mundo y se alimenta sobre todo de medusas.",4],["Geología","Un tsunami es una ola gigante que se forma cuando un terremoto sacude el fondo del mar. Puede viajar muy lejos y llegar con mucha fuerza.","Pez payaso","Amphiprion ocellaris","Arrecifes del Indo-Pacífico","Amphiprion ocellaris|Pez payaso","El pez payaso vive protegido entre los tentáculos de las anémonas. Su piel tiene una capa especial que evita que le piquen.",4],["Geología","El fondo del océano tiene fosas muy profundas. La fosa de las Marianas, en el Pacífico, mide más de diez mil metros de profundidad.","Pez globo","Tetraodontidae","Mares tropicales","Tetraodontidae|Pez globo","Cuando se asusta, el pez globo se llena de agua y se hincha como una pelota. Muchos de ellos son venenosos.",4],["Geología","Las corrientes marinas son grandes ríos dentro del océano. Llevan agua caliente o fría de un lugar a otro y cambian el clima.","Pez vela","Istiophorus platypterus","Mares tropicales y templados","Istiophorus platypterus|Pez vela","El pez vela abre una gran aleta en el lomo, que parece una vela. Es uno de los peces más rápidos que existen.",4],["Geología","Las mareas hacen que el mar suba y baje todos los días. Esto sucede por la fuerza de atracción de la Luna.","Atún rojo","Thunnus thynnus","Océano Atlántico y Mediterráneo","Thunnus thynnus|Atún rojo","El atún rojo cruza el océano Atlántico en largos viajes. Es un nadador potente y puede pesar cientos de kilos.",4],["Geología","Los océanos cubren más de dos tercios de la superficie de la Tierra. Su agua es salada porque lleva minerales que arrastran los ríos.","Orca","Orcinus orca","Todos los océanos","Orcinus orca|Orca","La orca es el delfín más grande del mundo. Vive en familias y caza en equipo, comunicándose con silbidos y chasquidos.",4],["Geología","El mar tiene zonas muy profundas donde no llega la luz del sol. Allí hace frío y el agua presiona con muchísima fuerza.","Cachalote","Physeter macrocephalus","Todos los océanos","Physeter macrocephalus|Cachalote","El cachalote puede sumergirse más de mil metros y aguantar una hora sin respirar. Allí caza calamares gigantes en total oscuridad.",4],["Geología","Los icebergs son enormes bloques de hielo que flotan en el mar. Solo se ve una pequeña parte, pues la mayor parte queda bajo el agua.","Narval","Monodon monoceros","Mares del Ártico","Monodon monoceros|Narval","El narval macho tiene un colmillo largo y retorcido, que en realidad es un diente. A veces lo llaman el unicornio del mar.",4],["Geología","Un glaciar es un río de hielo que se mueve muy despacio. Al avanzar, va excavando valles y arrastra rocas como una gran excavadora.","Beluga","Delphinapterus leucas","Mares del Ártico","Delphinapterus leucas|Beluga","La beluga es una ballena pequeña de color blanco. Hace tantos sonidos distintos que se la llama el canario del mar.",4],["Geología","El hielo del Ártico flota sobre el mar. Si se derrite, el nivel del agua no cambia mucho, pero los animales que lo usan sufren.","Morsa","Odobenus rosmarus","Mares del Ártico","Odobenus rosmarus|Morsa","La morsa tiene dos grandes colmillos que usa para salir del agua y subirse al hielo. Vive en grupos numerosos y le gusta estar muy junta.",4],["Geología","Los ríos erosionan las rocas poco a poco y las arrastran hasta el mar. Con el tiempo, abren cañones y valles muy profundos.","Manatí","Trichechus manatus","Costas y ríos tropicales","Trichechus manatus|Manatí","El manatí es un animal grande, lento y tranquilo. Pasa el día comiendo plantas acuáticas y sale a respirar cada pocos minutos.",4],["Geología","Una bahía es una entrada del mar en la costa. Suele estar protegida del viento y de las olas, y es un buen refugio para los barcos.","Dugongo","Dugong dugon","Costas del Indo-Pacífico","Dugong dugon|Dugongo","El dugongo se alimenta de hierbas marinas que crecen en el fondo. Se dice que los marineros antiguos lo confundían con las sirenas.",4],["Geología","Una península es una porción de tierra rodeada de agua por casi todos los lados. España y Portugal forman la península ibérica.","León marino de California","Zalophus californianus","Costa del Pacífico de Norteamérica","Zalophus californianus|León marino de California","El león marino de California es sociable y muy ruidoso, y ladra para comunicarse. Nada rápido y le gusta jugar con las olas.",4],["Geología","Un cabo es una punta de tierra que entra en el mar. Muchas veces tiene un faro para guiar a los barcos de noche.","Elefante marino del sur","Mirounga leonina","Antártida y mares del sur","Mirounga leonina|Elefante marino del sur","El elefante marino del sur es la foca más grande del mundo. El macho tiene una nariz grande y blanda, como una pequeña trompa.",4],["Geología","Una isla puede nacer cuando un volcán submarino crece hasta salir del agua. Con los años, en la isla crecen plantas y llegan animales.","Nutria marina","Enhydra lutris","Costas del Pacífico norte","Enhydra lutris|Nutria marina","La nutria marina flota de espaldas y usa piedras para abrir mariscos. Tiene el pelo más denso de todos los animales.",4],["Geología","Las playas están hechas de arena, que a su vez nace de rocas desgastadas. Algunas arenas son blancas, otras doradas y otras negras.","Tortuga laúd","Dermochelys coriacea","Todos los océanos tropicales y templados","Dermochelys coriacea|Tortuga laúd","La tortuga laúd es la tortuga más grande del mundo. En lugar de un caparazón duro, tiene una piel gruesa y resistente.",4],["Geología","El agua del mar se evapora con el calor del Sol, sube al cielo y forma nubes. Después cae como lluvia y vuelve a los ríos.","Medusa luna","Aurelia aurita","Mares de todo el mundo","Aurelia aurita|Medusa luna","La medusa luna está formada casi toda por agua. No tiene cerebro ni corazón, pero se desplaza abriendo y cerrando su cuerpo.",4],["Geología","El fondo del mar guarda barcos hundidos, cañones y montañas. Muchos lugares todavía no han sido vistos por ninguna persona.","Calamar gigante","Architeuthis dux","Aguas profundas del mundo","Architeuthis dux|Calamar gigante","El calamar gigante vive en aguas muy profundas y tiene los ojos más grandes del mundo animal, del tamaño de un balón.",4],["Geología","Las grandes rocas del fondo marino están cubiertas de vida. En las grietas se esconden animales diminutos que parecen joyas.","Pulpo de anillos azules","Hapalochlaena lunulata","Mares del Indo-Pacífico","Hapalochlaena lunulata|Pulpo de anillos azules","El pulpo de anillos azules es pequeño, pero su veneno es muy peligroso. Cuando se siente amenazado, sus anillos brillan con un azul intenso.",4],["Geología","Una fosa oceánica es una grieta muy profunda en el fondo del mar. Allí vive una fauna extraña, adaptada a la oscuridad y a la presión.","Cangrejo araña gigante","Macrocheira kaempferi","Mares de Japón","Macrocheira kaempferi|Cangrejo araña gigante","El cangrejo araña gigante tiene patas tan largas que, extendidas, miden unos tres metros. Vive en el fondo del mar de Japón.",4],["Geología","Las rocas del fondo del mar tienen cavidades y grietas. Son buenos escondites para animales que prefieren no ser vistos.","Langosta europea","Homarus gammarus","Costas del Atlántico y Mediterráneo","Homarus gammarus|Langosta europea","La langosta europea es azulada y se vuelve roja al cocinarla. Vive escondida en grietas y sale de noche a buscar comida.",4],["Geología","Los ríos largos nacen lejos del mar. Algunos peces los recorren en un viaje increíble de miles de kilómetros para reproducirse.","Anguila europea","Anguilla anguilla","Atlántico y ríos de Europa","Anguilla anguilla|Anguila europea","La anguila europea nace en el mar de los Sargazos, cruza el Atlántico y sube por los ríos. Años después regresa allí para poner huevos.",4],["Geología","A miles de metros de profundidad el mar es totalmente oscuro. Los animales que viven allí fabrican su propia luz para ver y atraer comida.","Rape","Lophius piscatorius","Atlántico y Mediterráneo","Lophius piscatorius|Rape","El rape tiene una gran boca y una pequeña caña que cuelga sobre ella. La mueve para atraer a otros peces, que se acercan y caen en su boca.",4],["Geología","En el fondo oceánico hay lugares donde sale agua muy caliente por grietas del suelo. Allí viven animales que no necesitan la luz del sol.","Tiburón duende","Mitsukurina owstoni","Aguas profundas del mundo","Mitsukurina owstoni|Tiburón duende","El tiburón duende vive en aguas profundas y tiene un hocico alargado y una mandíbula que se proyecta hacia adelante para atrapar a sus presas.",4],["Geología","Muchos ríos tienen cascadas, donde el agua cae desde lo alto. Algunas son tan grandes que su estruendo se oye desde muy lejos.","Lamprea marina","Petromyzon marinus","Atlántico norte y sus ríos","Petromyzon marinus|Lamprea marina","La lamprea marina parece una anguila, pero no tiene mandíbula. Tiene una boca redonda con dientes, con la que se pega a otros peces.",4],["Geología","Los océanos esconden criaturas enormes que se ven muy pocas veces. Algunas inspiraron antiguas leyendas sobre monstruos y serpientes marinas.","Pez remo","Regalecus glesne","Aguas profundas del mundo","Regalecus glesne|Pez remo","El pez remo es el pez óseo más largo del mundo, pues alcanza ocho metros. Nada despacio en aguas profundas y se ve muy pocas veces.",4],["Países","Canadá es un país muy grande de América del Norte. Tiene bosques inmensos, miles de lagos y, en invierno, mucha nieve.","Oso negro americano","Ursus americanus","Bosques de Norteamérica","Ursus americanus|Oso negro americano","El oso negro americano trepa a los árboles con facilidad y come de todo: frutas, raíces, pescado y miel. En invierno duerme en una cueva.",5],["Países","Estados Unidos ocupa gran parte de América del Norte. En el centro tiene enormes praderas, donde la hierba se mece con el viento.","Bisonte americano","Bison bison","Praderas de Norteamérica","Bison bison|Bisonte americano","El bisonte americano es el mamífero terrestre más grande de Norteamérica. Estuvo a punto de desaparecer, pero hoy se protege en parques.",5],["Geografía","Las Montañas Rocosas atraviesan Canadá y Estados Unidos. Tienen picos nevados, bosques frondosos y valles con ríos transparentes.","Puma","Puma concolor","América","Puma concolor|Puma","El puma es un gran felino que vive desde Canadá hasta la Patagonia. Salta muy alto y no ruge, pero ronronea y maúlla.",5],["Países","México es un país de América del Norte, con desiertos, selvas y volcanes. Su capital es la Ciudad de México.","Coyote","Canis latrans","Norteamérica y Centroamérica","Canis latrans|Coyote","El coyote es un animal muy adaptable y listo. Aúlla al atardecer y vive en desiertos, praderas, bosques e incluso ciudades.",5],["Geografía","Los Grandes Lagos, entre Canadá y Estados Unidos, son tan grandes que parecen mares. Son lagos de agua dulce y forman el mayor conjunto de agua dulce del mundo.","Castor americano","Castor canadensis","Ríos y lagos de Norteamérica","Castor canadensis|Castor americano|Castor","El castor americano construye diques de ramas y barro para formar lagunas. Sus dientes son tan duros que pueden cortar troncos de árboles.",5],["Geografía","Las cataratas del Niágara están en la frontera entre Canadá y Estados Unidos. El agua cae desde gran altura con un enorme estruendo.","Mapache","Procyon lotor","Norteamérica","Procyon lotor|Mapache","El mapache tiene una máscara oscura sobre los ojos y patas muy hábiles. Parece lavar la comida entre sus manos antes de comerla.",5],["Geografía","El Misisipi es uno de los ríos más largos de Norteamérica. Cruza Estados Unidos de norte a sur y desemboca en el golfo de México.","Zarigüeya","Didelphis virginiana","Norteamérica","Didelphis virginiana|Zarigüeya de Virginia|Zarigüeya","La zarigüeya es un marsupial. Cuando tiene miedo se queda inmóvil, como si estuviera dormida, hasta que pasa el peligro.",5],["Países","La bandera de Estados Unidos tiene franjas y estrellas. El ave que simboliza al país es un águila de cabeza blanca.","Águila calva","Haliaeetus leucocephalus","Norteamérica","Haliaeetus leucocephalus|Águila calva|Pigargo americano","El águila calva no es calva, pues tiene plumas blancas en la cabeza. Construye nidos enormes y se alimenta sobre todo de peces.",5],["Geografía","El Gran Cañón es un valle profundo excavado por el río Colorado durante millones de años. Sus rocas muestran capas de diferentes colores.","Pavo salvaje","Meleagris gallopavo","Norteamérica","Meleagris gallopavo|Pavo salvaje","El pavo salvaje es un ave grande que prefiere caminar antes que volar. Los machos abren la cola en abanico para atraer a las hembras.",5],["Geografía","Alaska es el estado más grande de Estados Unidos. Tiene glaciares, bosques enormes y montañas que casi todo el año están cubiertas de nieve.","Wapití","Cervus canadensis","Bosques y montañas de Norteamérica","Cervus canadensis|Wapití","El wapití es un ciervo grande con enormes astas. En otoño los machos hacen un sonido muy potente llamado berrea.",5],["Geografía","Las cumbres de las Rocosas son escarpadas y están cubiertas de hielo. Allí viven animales que saben moverse por precipicios.","Cabra de las nieves","Oreamnos americanus","Montañas de Norteamérica","Oreamnos americanus|Cabra de las nieves","La cabra de las nieves es blanca y tiene pezuñas especiales que le permiten caminar con seguridad sobre las rocas heladas.",5],["Geografía","Los desiertos de América del Norte tienen cactus, rocas rojizas y cañones. Casi no llueve, pero la vida se las arregla para sobrevivir.","Borrego cimarrón","Ovis canadensis","Montañas y desiertos de Norteamérica","Ovis canadensis|Borrego cimarrón","Los machos del borrego cimarrón chocan sus cuernos con gran estruendo para demostrar quién manda. Tienen la cabeza muy fuerte.",5],["Geografía","En el norte de Canadá los bosques son tan grandes que parecen no tener fin. En invierno el frío puede ser muy intenso.","Glotón","Gulo gulo","Bosques fríos del norte","Gulo gulo|Glotón","El glotón es pequeño pero fuerte y valiente. Recorre grandes distancias por la nieve y puede enfrentarse a animales más grandes.",5],["Geografía","En invierno, la nieve cubre bosques y praderas de Canadá. Los animales de allí tienen un pelaje espeso para soportar el frío.","Lince canadiense","Lynx canadensis","Bosques del norte de América","Lynx canadensis|Lince canadiense","El lince canadiense tiene patas anchas y peludas que funcionan como raquetas de nieve. Caza sobre todo liebres.",5],["Geografía","Las praderas de América del Norte son llanuras cubiertas de hierba. Allí el cielo parece enorme y se ve el horizonte muy lejos.","Perro de la pradera","Cynomys ludovicianus","Praderas de Norteamérica","Cynomys ludovicianus|Perro de la pradera","El perro de la pradera vive en colonias subterráneas con muchas galerías. Cuando hay peligro, lanza ladridos para avisar a todos.",5],["Naturaleza","En las praderas y los bosques viven animales que se defienden de formas muy curiosas. Uno de ellos se protege con un olor muy fuerte.","Mofeta rayada","Mephitis mephitis","Norteamérica","Mephitis mephitis|Mofeta rayada","La mofeta rayada avisa antes de atacar: levanta la cola y patalea. Si no funciona, lanza un líquido con olor intenso.",5],["Países","Brasil es el país más grande de América del Sur. Tiene la mayor parte de la selva amazónica y playas muy famosas.","Perezoso de tres dedos","Bradypus variegatus","Selvas de América Central y del Sur","Bradypus variegatus|Perezoso de tres dedos","El perezoso de tres dedos se mueve tan despacio que a veces le crecen algas en el pelo. Pasa casi toda su vida colgado de los árboles.",5],["Geografía","El Pantanal de Brasil es una enorme llanura inundable. Cuando llega la época de lluvias, gran parte del terreno se cubre de agua.","Capibara","Hydrochoerus hydrochaeris","Ríos y lagunas de América del Sur","Hydrochoerus hydrochaeris|Capibara|Carpincho","El capibara es el roedor más grande del mundo. Le encanta el agua, vive en grupos y se lleva bien con otros animales.",5],["Geografía","El río Amazonas atraviesa la selva y recibe agua de cientos de ríos. En sus orillas viven serpientes, peces y aves de colores.","Anaconda verde","Eunectes murinus","Selvas y pantanos de América del Sur","Eunectes murinus|Anaconda verde","La anaconda verde es una de las serpientes más pesadas del mundo. Nada muy bien y pasa mucho tiempo dentro del agua.",5],["Geografía","Los ríos amazónicos esconden peces de todos los tamaños. Algunos se mueven en grupo y se alimentan de lo que encuentran.","Piraña roja","Pygocentrus nattereri","Ríos de América del Sur","Pygocentrus nattereri|Piraña roja|Piraña","La piraña roja tiene dientes afilados y suele nadar en bancos. Come peces, frutas y restos de animales.",5],["Naturaleza","En la selva amazónica a veces se oye un rugido lejano. No es un león: es un mono que grita para marcar su territorio.","Mono aullador rojo","Alouatta seniculus","Selvas de América del Sur","Alouatta seniculus|Mono aullador rojo","El mono aullador tiene una voz tan potente que se oye a varios kilómetros. Es uno de los animales más ruidosos de la selva.",5],["Naturaleza","En lo alto de los árboles de la selva viven animales que casi nunca bajan al suelo. Se desplazan balanceándose entre las ramas.","Mono araña","Ateles","Selvas de América Central y del Sur","Ateles|Mono araña","El mono araña usa su cola larga como una quinta mano. Con ella se agarra a las ramas y se balancea por la selva.",5],["Países","Chile es un país largo y estrecho entre los Andes y el océano Pacífico. Tiene desiertos, volcanes, glaciares y miles de islas.","Oso de anteojos","Tremarctos ornatus","Andes de América del Sur","Tremarctos ornatus|Oso de anteojos","El oso de anteojos es el único oso de América del Sur. Tiene manchas claras alrededor de los ojos, como unas gafas.",5],["Geografía","El desierto de Atacama, en Chile, es uno de los lugares más secos de la Tierra. En algunas partes no ha llovido en años.","Chinchilla","Chinchilla lanigera","Andes de Chile","Chinchilla lanigera|Chinchilla","La chinchilla tiene el pelo más suave y denso que casi cualquier otro mamífero. Vive en las rocas de los Andes y salta con agilidad.",5],["Geografía","La Patagonia es una región del sur de Argentina y Chile. Tiene mucho viento, glaciares y llanuras donde apenas hay árboles.","Guanaco","Lama guanicoe","Los Andes y la Patagonia","Lama guanicoe|Guanaco","El guanaco es un pariente salvaje de la llama. Vive en rebaños y, cuando algo lo asusta, lo avisa con un relincho y echa a correr.",5],["Geografía","La pampa es una llanura inmensa de Argentina, Uruguay y Brasil. Está cubierta de hierba y es ideal para el ganado.","Ñandú","Rhea americana","Pampas de América del Sur","Rhea americana|Ñandú","El ñandú es un ave grande que no puede volar, pero corre muy rápido. El macho cuida los huevos y a las crías.",5],["Naturaleza","En las selvas de América del Sur hay animales con hocicos muy largos para buscar insectos. Se alimentan por la noche o a primera hora.","Tamandúa","Tamandua tetradactyla","Selvas de América del Sur","Tamandua tetradactyla|Tamandúa","El tamandúa es un pariente más pequeño del oso hormiguero gigante. Trepa a los árboles para buscar hormigas y termitas.",5],["Naturaleza","Los felinos de la selva cazan de noche. Tienen un pelaje con manchas que los camufla entre las hojas.","Ocelote","Leopardus pardalis","América Central y del Sur","Leopardus pardalis|Ocelote","El ocelote es un gato salvaje de manchas bonitas. Caza de noche y trepa a los árboles y nada con facilidad.",5],["Historia","En la Edad Media había castillos con murallas y torres. Los caballeros montaban a caballo y defendían a su señor y a sus tierras.","Caballo","Equus ferus caballus","Todo el mundo","Equus caballus|Caballo","El caballo ha acompañado a las personas durante miles de años. Es rápido, fuerte e inteligente, y se comunica con relinchos y con el cuerpo.",6],["Historia","En la Edad Media los campesinos trabajaban la tierra con arados. Para llevar las cargas por caminos de piedra, usaban animales fuertes y pacientes.","Burro","Equus africanus asinus","Todo el mundo","Equus africanus asinus|Burro","El burro es un animal resistente y tranquilo. Puede cargar peso durante horas y recorrer caminos difíciles sin quejarse.",6],["Historia","Los pueblos medievales vivían de la agricultura y la ganadería. Cada familia cuidaba sus campos y animales para tener leche, carne y lana.","Vaca","Bos taurus","Todo el mundo","Bos taurus|Vaca","La vaca pasa muchas horas pastando y rumiando. Tiene cuatro cámaras en el estómago para digerir bien la hierba.",6],["Historia","Los pastores cuidaban rebaños en las montañas durante el verano. La lana de las ovejas se hilaba y se tejía para hacer ropa de abrigo.","Oveja","Ovis aries","Todo el mundo","Ovis aries|Oveja doméstica|Oveja","La oveja vive en rebaño y reconoce las caras de otras ovejas y de personas. Su lana se esquila una vez al año.",6],["Historia","En las aldeas medievales, junto a las casas había corrales con animales. Algunos criaban cerdos, que comían todo lo que encontraban.","Cerdo","Sus scrofa domesticus","Todo el mundo","Sus scrofa domesticus|Cerdo","El cerdo es un animal muy inteligente y limpio. Desciende del jabalí y tiene un olfato finísimo.",6],["Historia","Los perros acompañan a las personas desde hace miles de años. Cuidaban el ganado, ayudaban a cazar y protegían las casas.","Perro","Canis lupus familiaris","Todo el mundo","Perro","El perro fue el primer animal domesticado por las personas. Entiende nuestros gestos y es capaz de reconocer muchas palabras.",6],["Historia","En los castillos y en las casas del campo había gatos. Los gatos cazaban ratones y protegían el grano guardado para el invierno.","Gato doméstico","Felis catus","Todo el mundo","Felis catus|Gato doméstico|Gato","El gato doméstico caza con sigilo y puede saltar varias veces su altura. Ronronea cuando está contento y también cuando se siente mal.",6],["Historia","En las aldeas había lagunas donde nadaban patos y gansos. Eran una fuente importante de huevos y plumas para las camas.","Ánade real","Anas platyrhynchos","Europa, Asia y Norteamérica","Anas platyrhynchos|Ánade real|Pato real","El ánade real, o pato real, vuela, nada y camina. Sus plumas tienen una grasa especial que impide que se empapen.",6],["Historia","Los conejos eran muy apreciados en la Edad Media, porque daban carne y piel. Se criaban en pequeños cercados llamados conejares.","Conejo europeo","Oryctolagus cuniculus","Península ibérica y Europa","Oryctolagus cuniculus|Conejo europeo|Conejo","El conejo europeo vive en madrigueras llamadas vivares. Tiene los dientes siempre creciendo, y por eso necesita roer.",6],["Historia","Antes de la radio y del teléfono, los mensajes se enviaban a caballo o con un ave. Algunas aves sabían volver siempre a casa.","Paloma bravía","Columba livia","Casi todo el mundo","Columba livia|Paloma bravía","La paloma bravía tiene una gran orientación y puede volver a su palomar desde cientos de kilómetros. Por eso se usó como mensajera.",6],["Historia","En la Edad Media los nobles practicaban la cetrería, que es cazar con aves de presa entrenadas. Era un arte difícil y muy apreciado.","Halcón sacre","Falco cherrug","Europa del este y Asia","Falco cherrug|Halcón sacre","El halcón sacre es un ave de presa grande y poderosa. Durante siglos fue uno de los favoritos de los reyes para cazar.",6],["Historia","Los cetreros entrenaban a las aves en sus guantes de cuero. Cada ave de presa tenía un nombre y cuidados propios.","Azor común","Accipiter gentilis","Bosques del hemisferio norte","Accipiter gentilis|Azor común","El azor común es un ave rápida y ágil que caza entre los árboles. Sus alas cortas y su cola larga le permiten girar sin chocar.",6],["Historia","Los vikingos navegaban en barcos largos llamados drakkar. Se cuenta que usaban cuervos para encontrar tierra cuando se perdían en el mar.","Cuervo grande","Corvus corax","Hemisferio norte","Corvus corax|Cuervo grande|Cuervo","El cuervo es uno de los pájaros más listos. Puede resolver problemas, imitar sonidos y recordar a las personas.",6],["Historia","En el siglo catorce, una enfermedad llamada peste negra se extendió por Europa. Las ciudades sucias y llenas de ratas ayudaron a que se propagara.","Rata negra","Rattus rattus","Casi todo el mundo","Rattus rattus|Rata negra","La rata negra trepa muy bien y vive en edificios y barcos. Es lista y se adapta a casi cualquier lugar.",6],["Historia","En los castillos había fosos llenos de agua. En ellos nadaban aves elegantes, como los cisnes, que los reyes cuidaban con esmero.","Cisne vulgar","Cygnus olor","Lagos y ríos de Europa y Asia","Cygnus olor|Cisne vulgar|Cisne","El cisne vulgar tiene un cuello largo y curvado. Forma parejas para toda la vida y cuida mucho a sus crías.",6],["Historia","Los ríos medievales servían de caminos y eran fuente de pesca. Junto a la orilla, algunas aves esperaban inmóviles a que pasara algún pez.","Garza real","Ardea cinerea","Europa, Asia y África","Ardea cinerea|Garza real","La garza real puede quedarse quieta durante un buen rato. Cuando pasa un pez, lanza su largo pico y lo atrapa.",6],["Historia","La pesca fue muy importante para los pueblos de la Edad Media. En los ríos se pescaba con redes, cañas y trampas de mimbre.","Martín pescador","Alcedo atthis","Europa, Asia y norte de África","Alcedo atthis|Martín pescador","El martín pescador es un ave de color azul brillante. Se lanza en picado al agua y sale con un pez en el pico.",6],["Historia","Los reyes y nobles de la Edad Media cazaban en bosques reservados para ellos. Allí vivían jabalíes, ciervos y corzos.","Jabalí","Sus scrofa","Europa, Asia y norte de África","Sus scrofa|Jabalí","El jabalí tiene un hocico potente con el que remueve la tierra en busca de raíces. Vive en grupos y sale sobre todo de noche.",6],["Historia","Los caballeros salían a cazar en grandes cacerías con perros y cuernos. La caza proporcionaba alimento a las familias nobles.","Ciervo rojo","Cervus elaphus","Europa, Asia y norte de África","Cervus elaphus|Ciervo rojo|Ciervo","Los machos del ciervo rojo tienen astas que se caen y vuelven a crecer cada año. En otoño berrean para atraer a las hembras.",6],["Historia","Los bosques medievales eran grandes y oscuros. Para los viajeros eran lugares misteriosos, llenos de animales y de leyendas.","Corzo","Capreolus capreolus","Bosques de Europa y Asia","Capreolus capreolus|Corzo","El corzo es un ciervo pequeño y ágil, de ojos grandes. Se esconde entre los arbustos y sale a comer al amanecer y al atardecer.",6],["Historia","Los pueblos antiguos observaban a los animales del campo para aprender de ellos. Algunos corren tan rápido que es imposible alcanzarlos.","Liebre europea","Lepus europaeus","Europa y Asia","Lepus europaeus|Liebre europea|Liebre","La liebre europea corre a más de sesenta kilómetros por hora. Sus largas patas traseras le permiten esquivar a sus enemigos.",6],["Historia","Los monjes medievales escribían libros a mano en tinta y pergamino. Cada libro tardaba meses o incluso años en terminarse.","Ardilla roja","Sciurus vulgaris","Bosques de Europa y Asia","Sciurus vulgaris|Ardilla roja|Ardilla común","La ardilla roja guarda nueces y bellotas para el invierno. A veces olvida dónde las ha escondido y así planta nuevos árboles.",6],["Historia","En los monasterios se cultivaban huertos y se hacían manuscritos. Allí también se estudiaban las plantas y los animales.","Lirón gris","Glis glis","Bosques de Europa","Glis glis|Lirón gris","El lirón gris duerme el invierno entero en su refugio. Puede pasar siete meses durmiendo sin apenas moverse.",6],["Historia","Los peleteros fabricaban abrigos con pieles de animales. Algunas pieles se consideraban tan valiosas que solo las usaban los reyes.","Marta común","Martes martes","Bosques de Europa","Martes martes|Marta común|Marta","La marta común es un animal ágil que trepa a los árboles con soltura. Come ratones, aves, huevos y frutos del bosque.",6],["Historia","En la Edad Media las capas de los reyes llevaban adornos de piel blanca con motitas negras. Esa piel pertenecía a un pequeño animal.","Armiño","Mustela erminea","Hemisferio norte","Mustela erminea|Armiño","En invierno el armiño se vuelve completamente blanco, salvo la punta de la cola, que se queda negra. Es un cazador pequeño pero veloz.",6],["Historia","Los trovadores eran poetas y músicos que recorrían castillos cantando historias. A menudo comparaban su canto con el de las aves.","Ruiseñor común","Luscinia megarhynchos","Europa y África","Luscinia megarhynchos|Ruiseñor común|Ruiseñor","El ruiseñor es pequeño y de color pardo, pero su canto es potente y hermoso. Muchas veces canta de noche.",6],["Historia","Con la imprenta, inventada hace más de quinientos años, los libros se empezaron a fabricar más deprisa. Así más personas pudieron leer.","Petirrojo","Erithacus rubecula","Europa y Asia","Erithacus rubecula|Petirrojo","El petirrojo tiene el pecho de un color naranja rojizo. Canta incluso en invierno y defiende con valentía su territorio.",6],["Historia","Los grandes navegantes salieron de Europa en busca de nuevos mares. Cruzaron el océano Atlántico y descubrieron tierras que no conocían.","Albatros errante","Diomedea exulans","Océanos del hemisferio sur","Diomedea exulans|Albatros errante","El albatros errante tiene las alas más largas de todas las aves, de más de tres metros. Puede volar durante horas sin batirlas.",6],["Historia","Lo

s vikingos viajaron a Islandia, Groenlandia y América del Norte hace más de mil años. Navegaban en frías aguas, entre icebergs y tormentas.","Frailecillo atlántico","Fratercula arctica","Atlántico norte","Fratercula arctica|Frailecillo atlántico|Frailecillo","El frailecillo tiene un pico muy colorido. Bucea para pescar y puede llevar varios peces en el pico a la vez.",6],["Espacio","El Sol es una estrella enorme y muy caliente. Está tan lejos que su luz tarda unos ocho minutos en llegar a la Tierra.","Mariquita de siete puntos","Coccinella septempunctata","Europa, Asia y norte de África","Coccinella septempunctata|Mariquita de siete puntos|Mariquita","La mariquita es un escarabajo pequeño, rojo con puntos negros. Se alimenta de pulgones, así que ayuda a cuidar las plantas.",7],["Espacio","El Sol da luz y calor a todos los planetas de nuestro sistema solar. Sin él, la Tierra sería oscura, helada y sin vida.","Hormiga cortadora de hojas","Atta cephalotes","Selvas de América","Atta cephalotes|Hormiga cortadora de hojas","La hormiga cortadora de hojas lleva trocitos de hoja al hormiguero. Con ellos cultiva un hongo, que es su comida.",7],["Espacio","Hay ocho planetas que giran alrededor del Sol. De los más cercanos a los más lejanos son Mercurio, Venus, Tierra, Marte, Júpiter, Saturno, Urano y Neptuno.","Termita","Isoptera","Zonas cálidas del mundo","Isoptera|Termita","Las termitas construyen enormes termiteros con túneles y cámaras. En ellos viven millones de individuos, cada uno con su trabajo.",7],["Espacio","La Luna es el satélite natural de la Tierra y gira a su alrededor. Se ve distinta cada noche porque el Sol la ilumina por diferentes lados.","Libélula emperador","Anax imperator","Europa, Asia y África","Anax imperator|Libélula emperador|Libélula","La libélula emperador vuela muy deprisa y puede frenar en el aire. Sus ojos enormes ven casi en todas las direcciones.",7],["Espacio","Las fases de la Luna son luna nueva, cuarto creciente, luna llena y cuarto menguante. Cada ciclo dura casi un mes.","Saltamontes","Caelifera","Todo el mundo","Caelifera|Saltamontes","El saltamontes tiene patas traseras muy fuertes para dar grandes saltos. Algunos producen sonidos frotando las patas contra las alas.",7],["Espacio","Un eclipse solar ocurre cuando la Luna pasa justo entre el Sol y la Tierra. Durante unos minutos el día se oscurece como si fuera de noche.","Grillo campestre","Gryllus campestris","Europa y norte de África","Gryllus campestris|Grillo campestre|Grillo común","El grillo campestre canta al atardecer. Lo hace frotando las alas, y con ese sonido llama a sus hembras.",7],["Espacio","Marte es conocido como el planeta rojo, porque su suelo tiene mucho óxido de hierro. Hasta ahora solo lo han visitado robots.","Escarabajo Hércules","Dynastes hercules","Selvas de América Central y del Sur","Dynastes hercules|Escarabajo Hércules","El escarabajo Hércules tiene unos cuernos enormes y es uno de los más grandes del mundo. Puede cargar cientos de veces su propio peso.",7],["Espacio","Las estrellas son bolas de gas muy calientes que producen luz propia. Las vemos pequeñas porque están lejísimos de nosotros.","Polilla atlas","Attacus atlas","Selvas de Asia","Attacus atlas|Polilla atlas","La polilla atlas es una de las mariposas nocturnas más grandes del mundo. Sus alas pueden medir veinticinco centímetros de punta a punta.",7],["Espacio","La Vía Láctea es la galaxia donde vivimos. Es un enorme remolino de estrellas, y el Sol es una de ellas.","Araña de jardín","Araneus diadematus","Europa y Norteamérica","Araneus diadematus|Araña de jardín","La araña de jardín teje redes redondas muy bonitas. Cada mañana puede reparar su tela o fabricar una nueva.",7],["Espacio","Saturno es el planeta de los anillos, que están hechos de hielo y roca. Es tan ligero que, si hubiera un mar enorme, flotaría en él.","Viuda negra","Latrodectus mactans","Américas","Latrodectus mactans|Viuda negra","La viuda negra es una araña de color oscuro con una mancha roja en el vientre. Es tímida y se esconde en lugares apartados.",7],["Espacio","Júpiter es el planeta más grande del sistema solar. Tiene una gran mancha roja, que es una tormenta que dura siglos.","Tarántula goliat","Theraphosa blondi","Selvas de América del Sur","Theraphosa blondi|Tarántula goliat","La tarántula goliat es la araña más grande del mundo en peso. Vive en madrigueras y sale de noche a cazar.",7],["Espacio","Los astronautas viajan al espacio en cohetes. Allí no hay aire ni gravedad, así que flotan y deben llevar trajes especiales.","Milpiés gigante africano","Archispirostreptus gigas","África oriental","Archispirostreptus gigas|Milpiés gigante africano","El milpiés gigante africano tiene cientos de patas y puede medir más de treinta centímetros. Cuando se asusta, se enrolla como un caracol.",7],["Clima","La Tierra gira sobre sí misma una vez al día. Por eso, mientras en un lugar es de día, en el lado opuesto es de noche.","Cochinilla de la humedad","Armadillidium vulgare","Europa y América","Armadillidium vulgare|Cochinilla de la humedad","La cochinilla de la humedad no es un insecto, sino un crustáceo terrestre. Cuando tiene miedo se enrolla como una pequeña bola.",7],["Clima","La Tierra tarda un año en dar una vuelta completa alrededor del Sol. Gracias a su inclinación, existen las cuatro estaciones.","Lombriz de tierra","Lumbricus terrestris","Casi todo el mundo","Lumbricus terrestris|Lombriz de tierra","La lombriz de tierra abre pequeños túneles en el suelo y lo mezcla. Así deja la tierra suelta y fértil para las plantas.",7],["Clima","En primavera los días se alargan y las plantas florecen. Muchas aves construyen sus nidos y cantan para encontrar pareja.","Estornino pinto","Sturnus vulgaris","Europa, Asia y Norteamérica","Sturnus vulgaris|Estornino pinto|Estornino","El estornino pinto vuela en bandadas enormes que dibujan formas en el cielo. También puede imitar sonidos que oye.",7],["Clima","En verano los días son largos y hace calor. Muchos animales aprovechan para criar y comer todo lo que pueden.","Golondrina común","Hirundo rustica","Casi todo el mundo","Hirundo rustica|Golondrina común","La golondrina construye su nido de barro bajo los tejados. En otoño viaja a África y en primavera regresa al mismo sitio.",7],["Clima","En otoño los días se acortan y bajan las temperaturas. Muchas aves se marchan hacia lugares más cálidos.","Vencejo común","Apus apus","Europa, Asia y África","Apus apus|Vencejo común","El vencejo común pasa casi toda la vida volando. Come, bebe y hasta duerme en el aire, y solo se posa para criar.",7],["Clima","En invierno hace frío y a veces nieva. Algunos animales duermen y otros buscan alimento escondido bajo la nieve.","Gorrión común","Passer domesticus","Casi todo el mundo","Passer domesticus|Gorrión común","El gorrión común vive cerca de las personas y se alimenta de semillas y migas. Le gusta bañarse en polvo y en agua.",7],["Clima","El viento es aire que se mueve. Puede ser una brisa suave o un temporal fuerte que arranca ramas y mueve el mar.","Lechuza común","Tyto alba","Casi todo el mundo","Tyto alba|Lechuza común","La lechuza común vuela sin hacer ruido. Su cara tiene forma de corazón y oye tan bien que caza ratones sin verlos.",7],["Clima","La lluvia se forma cuando las gotitas de las nubes se juntan y pesan demasiado. Entonces caen al suelo y llenan los ríos.","Pelícano blanco","Pelecanus onocrotalus","Humedales de Europa, Asia y África","Pelecanus onocrotalus|Pelícano blanco","El pelícano blanco tiene una bolsa grande bajo el pico, con la que atrapa los peces. Varios pelícanos pescan juntos en equipo.",7],["Clima","Un huracán es una tormenta enorme que gira sobre el mar cálido. Trae viento muy fuerte, lluvia y olas altas.","Cormorán grande","Phalacrocorax carbo","Costas y ríos de casi todo el mundo","Phalacrocorax carbo|Cormorán grande","El cormorán grande se zambulle para pescar y después abre las alas al sol para secarlas. Sus plumas no son tan impermeables como las de otras aves.",7],["Clima","Las tormentas tienen rayos, truenos y mucha lluvia. Primero se ve el rayo y después se oye el trueno, porque la luz viaja más rápido que el sonido.","Gaviota patiamarilla","Larus michahellis","Costas de Europa","Larus michahellis|Gaviota patiamarilla","La gaviota patiamarilla es grande y ruidosa. Se adapta a vivir en puertos y ciudades, y come peces, restos y huevos.",7],["Clima","Hay animales que hacen viajes larguísimos cada año para encontrar un clima mejor. Algunos recorren más de medio planeta.","Charrán ártico","Sterna paradisaea","Del Ártico a la Antártida","Sterna paradisaea|Charrán ártico","El charrán ártico hace la migración más larga del mundo, de polo a polo. Cada año recorre decenas de miles de kilómetros.",7],["Clima","En el norte de Europa los inviernos son muy fríos y los lagos se congelan. Algunas aves buscan entonces aguas libres de hielo.","Cisne cantor","Cygnus cygnus","Norte de Europa y Asia","Cygnus cygnus|Cisne cantor","El cisne cantor tiene el pico amarillo con la punta negra. Pasa el verano en el norte y vuela hacia el sur cuando llega el frío.",7],["Clima","Las aves migratorias se orientan con el Sol, las estrellas y los campos magnéticos de la Tierra. Muchas viajan en formación de V.","Grulla común","Grus grus","Europa y Asia","Grus grus|Grulla común","La grulla común vuela en grandes bandadas con forma de V. Hace un sonido fuerte y trompeteante que se oye desde lejos.",7],["Clima","En el bosque, durante la primavera, se oye un ruido de golpecitos rápidos. Es un ave que golpea un tronco con el pico.","Pico picapinos","Dendrocopos major","Bosques de Europa y Asia","Dendrocopos major|Pico picapinos","El pico picapinos golpea los troncos para buscar insectos y hacer su nido. Su cráneo está preparado para aguantar los golpes.",7],["Clima","Un arcoíris aparece cuando la luz del sol atraviesa las gotas de lluvia. Se ven siete colores: rojo, naranja, amarillo, verde, azul, añil y violeta.","Águila pescadora","Pandion haliaetus","Casi todo el mundo","Pandion haliaetus|Águila pescadora","El águila pescadora se lanza en picado y atrapa los peces con las garras. Tiene las patas con espinas que evitan que se le resbalen.",7],["Clima","Las montañas más altas, como el Himalaya, tienen poco oxígeno. Aun así, algunas aves cruzan sus cumbres en sus viajes migratorios.","Ganso indio","Anser indicus","Asia central y sur de Asia","Anser indicus|Ganso indio","El ganso indio vuela sobre el Himalaya durante sus viajes migratorios. Se sabe que cruza cumbres altísimas, donde el aire es muy fino.",7],["Clima","Las auroras boreales son luces de colores que bailan en el cielo cerca del Polo Norte. Se producen por partículas del Sol que chocan con el aire.","Mirlo común","Turdus merula","Europa, Asia y norte de África","Turdus merula|Mirlo común","El mirlo común canta al amanecer y al anochecer. Los machos son negros con el pico amarillo, y las hembras son marrones.",7],["Cuerpo humano","El corazón es un músculo que bombea la sangre por todo el cuerpo. Late sin parar, de día y de noche, durante toda la vida.","Guepardo","Acinonyx jubatus","Sabanas de África","Acinonyx jubatus|Guepardo","El guepardo es el animal terrestre más rápido del mundo. En carreras cortas llega a cien kilómetros por hora, aunque se cansa pronto.",8],["Cuerpo humano","Los pulmones son dos órganos que nos permiten respirar. Cuando inspiramos, entra el aire, y cuando espiramos, sale.","Leopardo","Panthera pardus","África y Asia","Panthera pardus|Leopardo","El leopardo trepa a los árboles llevando a su presa para que otros animales no se la quiten. Tiene el pelaje cubierto de manchas en forma de rosetas.",8],["Cuerpo humano","El esqueleto está formado por más de doscientos huesos. Los huesos sostienen el cuerpo y protegen órganos importantes, como el cerebro.","Leopardo de las nieves","Panthera uncia","Montañas de Asia central","Panthera uncia|Leopardo de las nieves","El leopardo de las nieves vive en altas montañas de Asia. Tiene una cola larga y gruesa con la que se abriga el cuerpo cuando duerme.",8],["Cuerpo humano","Los músculos nos permiten caminar, saltar y hacer gestos. Se hacen más fuertes cuando los usamos y descansamos bien.","Tigre siberiano","Panthera tigris altaica","Bosques fríos del este de Rusia","Panthera tigris altaica|Tigre siberiano","El tigre siberiano es el felino más grande del mundo. Tiene un pelaje espeso que lo protege del frío intenso de su hogar.",8],["Cuerpo humano","El cerebro es el centro de control de nuestro cuerpo. Con él pensamos, recordamos, sentimos y hablamos.","Hiena manchada","Crocuta crocuta","África","Crocuta crocuta|Hiena manchada","La hiena manchada vive en grupos dirigidos por hembras. Emite una voz parecida a una risa, y sus mandíbulas son muy fuertes.",8],["Cuerpo humano","Los ojos nos permiten ver. La luz entra por la pupila, que se agranda en la oscuridad y se achica cuando hay mucha luz.","Licaón","Lycaon pictus","Sabanas de África","Lycaon pictus|Licaón","El licaón caza en manada con mucha cooperación. Cada uno tiene un dibujo distinto de manchas en el pelaje, como una huella.",8],["Cuerpo humano","Los oídos recogen los sonidos del aire y los envían al cerebro. Gracias a ellos oímos la música, las voces y los ruidos.","Okapi","Okapia johnstoni","Selvas del Congo","Okapia johnstoni|Okapi","El okapi es pariente de la jirafa, pero tiene el cuello corto y rayas en las patas. Su lengua es tan larga que puede limpiarse las orejas.",8],["Cuerpo humano","La nariz nos permite oler. Los olores nos avisan de peligros, como el humo, y también nos hacen disfrutar de la comida.","Mandril","Mandrillus sphinx","Selvas de África central","Mandrillus sphinx|Mandril","El mandril tiene la cara con rayas rojas y azules muy llamativas. Es el mono más grande del mundo y vive en grupos numerosos.",8],["Cuerpo humano","La lengua nos ayuda a saborear lo que comemos y a hablar. Tiene unos puntitos llamados papilas gustativas, que reconocen lo dulce, lo salado, lo ácido y lo amargo.","Chimpancé","Pan troglodytes","África central y occidental","Pan troglodytes|Chimpancé","El chimpancé usa herramientas, como palitos, para sacar termitas de sus nidos. Es muy inteligente y se parece mucho a las personas.",8],["Cuerpo humano","La piel es el órgano más grande del cuerpo. Nos protege, nos permite sentir el frío, el calor y las caricias, y nos ayuda a mantener la temperatura.","Orangután de Borneo","Pongo pygmaeus","Selvas de Borneo","Pongo pygmaeus|Orangután de Borneo|Orangután","La palabra orangután significa hombre del bosque. Es un gran simio de pelo rojizo, que vive en los árboles y construye un nido nuevo cada noche.",8],["Cuerpo humano","Los dientes sirven para morder y masticar. Los niños pequeños tienen veinte dientes de leche, que más tarde se caen y son reemplazados.","Bonobo","Pan paniscus","Selvas del Congo","Pan paniscus|Bonobo","El bonobo es un simio muy parecido al chimpancé, pero más tranquilo. Vive en grupos pacíficos y solo se encuentra en un país de África.",8],["Cuerpo humano","El estómago es una bolsa que recibe la comida y la mezcla con jugos para digerirla. Después, los alimentos pasan al intestino.","Lémur de cola anillada","Lemur catta","Madagascar","Lemur catta|Lémur de cola anillada|Lémur","El lémur de cola anillada tiene trece anillos negros y blancos en la cola. Por la mañana se sienta al sol con los brazos abiertos para calentarse.",8],["Cuerpo humano","La sangre lleva oxígeno y alimento a todas las partes del cuerpo. Circula por unos tubitos llamados venas y arterias.","Aye-aye","Daubentonia madagascariensis","Madagascar","Daubentonia madagascariensis|Aye-aye","El aye-aye tiene un dedo muy largo y delgado. Golpea los troncos y escucha para saber dónde hay larvas, y después las saca con ese dedo.",8],["Cuerpo humano","Los sentidos son la vista, el oído, el olfato, el gusto y el tacto. Con ellos conocemos el mundo que nos rodea.","Tarsero","Tarsius","Islas del sudeste de Asia","Tarsius|Tarsero","El tarsero es un primate diminuto con los ojos enormes. Salta de rama en rama y puede girar la cabeza casi por completo.",8],["Cuerpo humano","Cuando dormimos, el cuerpo descansa y el cerebro ordena lo que hemos aprendido. Por eso, dormir bien es muy importante.","Loris lento","Nycticebus","Selvas de Asia","Nycticebus|Loris lento","El loris lento se mueve despacio y silenciosamente por los árboles. Tiene ojos grandes y sale de noche a buscar insectos y frutos.",8],["Cuerpo humano","Las manos tienen veintisiete huesos cada una y nos sirven para tocar, agarrar y dibujar. Los dedos son muy sensibles.","Gibón de manos blancas","Hylobates lar","Selvas del sudeste de Asia","Hylobates lar|Gibón de manos blancas|Gibón","El gibón se balancea de rama en rama con sus largos brazos. Las parejas cantan juntas por la mañana, y su canto se oye muy lejos.",8],["Cuerpo humano","Las cuerdas vocales están en la garganta y vibran cuando hablamos. Con la boca, la lengua y los labios damos forma a los sonidos y a las palabras.","Mono capuchino","Cebus","Selvas de América Central y del Sur","Cebus|Mono capuchino","El mono capuchino usa piedras para romper nueces duras. Es muy listo y vive en grupos ruidosos y sociables.",8],["Cuerpo humano","Para hablar bien hay que respirar profundamente, abrir bien la boca y mover los labios con claridad. Así, todos nos entienden mejor.","Rinoceronte blanco","Ceratotherium simum","Sabanas de África","Ceratotherium simum|Rinoceronte blanco","El rinoceronte blanco es el segundo animal terrestre más grande. Tiene la boca ancha y plana, perfecta para pastar la hierba.",8],["Cuerpo humano","Los pulmones se llenan de aire cuando respiramos profundamente. Si soltamos el aire despacio, podemos hablar más fuerte y por más tiempo.","Ñu azul","Connochaetes taurinus","Sabanas de África","Connochaetes taurinus|Ñu azul|Ñu","Cada año, millones de ñus recorren la sabana buscando hierba fresca. Es una de las migraciones de animales más grandes del planeta.",8],["Cuerpo humano","La voz puede ser suave o fuerte, aguda o grave. Cuando leemos en voz alta, se entiende mejor si hablamos despacio y sin prisas.","Impala","Aepyceros melampus","Sabanas de África","Aepyceros melampus|Impala","La impala es una antílope ágil que puede saltar más de tres metros de alto. Cuando huye, da saltos para despistar al enemigo.",8],["Cuerpo humano","La garganta es el tubo por donde pasan el aire y la comida. Al hablar, el aire sale por ella y hace vibrar las cuerdas vocales.","Búfalo cafre","Syncerus caffer","Sabanas de África","Syncerus caffer|Búfalo cafre","El búfalo cafre vive en grandes manadas y se defiende en grupo. Sus cuernos forman una especie de casco sobre la frente.",8],["Cuerpo humano","Cuando corremos, el corazón late más rápido y respiramos con más fuerza. Después de descansar, el cuerpo vuelve a la calma.","Facóquero","Phacochoerus africanus","Sabanas de África","Phacochoerus africanus|Facóquero","El facóquero corre con la cola levantada como si fuera una antena. Tiene colmillos largos y se refugia en madrigueras.",8],["Cuerpo humano","El cuerpo necesita beber agua. Casi dos tercios de nuestro cuerpo es agua, y la usamos para respirar, sudar y digerir.","Oso bezudo","Melursus ursinus","India y Sri Lanka","Melursus ursinus|Oso bezudo|Oso perezoso","El oso bezudo tiene el pelaje largo y despeinado. Usa sus labios para aspirar hormigas y termitas, haciendo mucho ruido.",8],["Cuerpo humano","Comer frutas, verduras, legumbres y pescado ayuda a crecer sano. También es importante masticar bien y sin prisa.","Oso malayo","Helarctos malayanus","Selvas del sudeste de Asia","Helarctos malayanus|Oso malayo","El oso malayo es el oso más pequeño del mundo. Tiene una mancha clara en el pecho y una lengua larguísima para sacar miel.",8],["Cuerpo humano","El tacto nos permite sentir lo que tocamos. Los dedos y los labios son las partes del cuerpo más sensibles.","Kiwi","Apteryx","Nueva Zelanda","Apteryx|Kiwi","El kiwi es un ave que no vuela y tiene las plumas como pelo. Su pico largo tiene los orificios nasales en la punta para oler lombrices.",8],["Cuerpo humano","Los ojos ven mejor con buena luz. Es importante cuidarlos y no acercarlos demasiado a las pantallas.","Avestruz","Struthio camelus","Sabanas y desiertos de África","Struthio camelus|Avestruz","El avestruz es la mayor ave del mundo y no vuela, pero corre muy rápido. Sus ojos son más grandes que su cerebro.",8],["Cuerpo humano","Las orejas recogen los sonidos. Si nos tapamos las orejas al hablar, oímos mejor nuestra propia voz y podemos corregirla.","Casuario","Casuarius casuarius","Selvas de Nueva Guinea y Australia","Casuarius casuarius|Casuario","El casuario tiene en la cabeza una especie de casco y plumas que parecen pelo. Es tímido, pero muy fuerte si se siente amenazado.",8],["Cuerpo humano","Cuando hablamos, el aire pasa por la boca y los dientes ayudan a pronunciar algunos sonidos. Por eso, hablar claro requiere usar todos los músculos.","Emú","Dromaius novaehollandiae","Australia","Dromaius novaehollandiae|Emú","El emú es la segunda ave más grande del mundo. Corre mucho y el macho cuida los huevos hasta que nacen los polluelos.",8],["Cuerpo humano","El cerebro puede aprender toda la vida, pero de pequeños aprendemos muy rápido. Repetir con calma ayuda a recordar mejor.","Loro gris africano","Psittacus erithacus","Selvas de África","Psittacus erithacus|Loro gris africano|Loro gris","El loro gris africano es muy listo y puede aprender muchas palabras. Imita voces y sonidos, y entiende lo que significan algunas de ellas.",8],["Cultura","París es la capital de Francia y está a orillas del río Sena. Su monumento más famoso es la torre Eiffel, hecha de hierro hace más de cien años.","Ajolote","Ambystoma mexicanum","Lagos de México","Ambystoma mexicanum|Ajolote","El ajolote es un anfibio mexicano que conserva sus branquias toda la vida. Puede regenerar patas, cola e incluso partes del corazón.",9],["Cultura","Roma es la capital de Italia y tiene el Coliseo, un enorme anfiteatro donde se celebraban espectáculos. Fue construido hace casi dos mil años.","Kakapo","Strigops habroptila","Nueva Zelanda","Strigops habroptila|Kakapo","El kakapo es un loro que no puede volar y es de hábitos nocturnos. Es el loro más pesado del mundo y está en grave peligro de extinción.",9],["Cultura","Londres es la capital del Reino Unido. Tiene un reloj gigante llamado Big Ben y un río, el Támesis, que cruza la ciudad.","Saola","Pseudoryx nghetinhensis","Montañas de Vietnam y Laos","Pseudoryx nghetinhensis|Saola","El saola es un animal tan raro que se descubrió en mil novecientos noventa y dos. Casi nadie lo ha visto en libertad, y lo llaman el unicornio de Asia.",9],["Cultura","Tokio es la capital de Japón. Es una ciudad enorme, con rascacielos, trenes muy rápidos, jardines y templos antiguos.","Takín","Budorcas taxicolor","Montañas del Himalaya","Budorcas taxicolor|Takín","El takín parece una mezcla de cabra y vaca. Vive en las montañas del Himalaya y tiene una capa de pelo espeso, a veces dorado.",9],["Cultura","Nueva York es una gran ciudad de Estados Unidos. Tiene la Estatua de la Libertad, un regalo de Francia que recibe a los barcos.","Mono narigudo","Nasalis larvatus","Selvas de Borneo","Nasalis larvatus|Mono narigudo","El mono narigudo tiene una nariz grande y carnosa. Es buen nadador y vive junto a los ríos y manglares de la isla de Borneo.",9],["Cultura","En la India se celebra Holi, una fiesta en la que las personas se lanzan polvos de colores. Es una fiesta alegre que da la bienvenida a la primavera.","Cuón","Cuon alpinus","Bosques de Asia","Cuon alpinus|Cuón|Perro salvaje asiático","El cuón es un perro salvaje de pelaje rojizo. Caza en manada y se comunica con silbidos muy particulares.",9],["Cultura","El panda gigante es el símbolo de China. En otros países, otros animales representan a la nación y aparecen en escudos y banderas.","Binturong","Arctictis binturong","Selvas del sudeste de Asia","Arctictis binturong|Binturong","El binturong tiene una cola prensil que usa para agarrarse. Su pelo huele a palomitas de maíz, una característica muy extraña.",9],["Cultura","Madagascar es una gran isla de África con una fauna única. Allí viven animales que no existen en ningún otro lugar del mundo.","Fosa","Cryptoprocta ferox","Madagascar","Cryptoprocta ferox|Fosa","La fosa es el mayor depredador de Madagascar. Parece una mezcla entre gato y mangosta, trepa muy bien y tiene una cola muy larga.",9],["Cultura","En Madagascar hay animales que parecen bailarines. Para cruzar el suelo, algunos lo hacen a saltitos, de lado, con los brazos en alto.","Sifaka de Verreaux","Propithecus verreauxi","Madagascar","Propithecus verreauxi|Sifaka de Verreaux|Sifaka","El sifaka salta de un árbol a otro con una fuerza impresionante. Cuando baja al suelo, avanza dando saltitos laterales como si bailara.",9],["Cultura","La música se hace con instrumentos como el piano, la guitarra o el violín. También puede hacerse solo con la voz, cantando.","Ave lira soberbia","Menura novaehollandiae","Bosques de Australia","Menura novaehollandiae|Ave lira soberbia|Ave lira","El ave lira macho tiene una cola con forma de lira. Imita los sonidos que oye, incluso el de una cámara o una sierra.",9],["Cultura","Cada país tiene sus bailes tradicionales. Las personas se ponen trajes típicos y bailan al ritmo de música especial en las fiestas.","Ave del paraíso","Paradisaea apoda","Selvas de Nueva Guinea","Paradisaea apoda|Ave del paraíso","El ave del paraíso macho baila con sus largas plumas para conquistar a la hembra. Es una de las aves más hermosas que existen.",9],["Cultura","Muchas culturas tienen máscaras que se usan en las fiestas y los rituales. A veces representan animales o espíritus del bosque.","Cálao rinoceronte","Buceros rhinoceros","Selvas del sudeste de Asia","Buceros rhinoceros|Cálao rinoceronte","El cálao rinoceronte tiene sobre el pico una prominencia en forma de cuerno. Es un ave grande que vive en las selvas de Asia.",9],["Cultura","Las islas Galápagos pertenecen a Ecuador y están en el océano Pacífico. Allí estudió Charles Darwin a los animales y desarrolló sus ideas sobre la evolución.","Piquero de patas azules","Sula nebouxii","Costas del Pacífico americano","Sula nebouxii|Piquero de patas azules","El piquero de patas azules las mueve con mucha gracia al bailar para impresionar a su pareja. Cuanto más azules, más atractivo resulta.",9],["Cultura","El teatro es un arte en el que unos actores cuentan una historia sobre un escenario. El público mira, escucha y aplaude al final.","Pingüino rey","Aptenodytes patagonicus","Islas del océano Antártico","Aptenodytes patagonicus|Pingüino rey","El pingüino rey es el segundo pingüino más grande. Se reconoce por las manchas anaranjadas del cuello y de la cabeza.",9],["Cultura","El ballet es un baile con saltos, giros y movimientos elegantes. Los bailarines practican durante años para hacerlo parecer fácil.","Cisne negro","Cygnus atratus","Australia","Cygnus atratus|Cisne negro","El cisne negro es originario de Australia. Tiene el plumaje oscuro y el pico rojo, y le gusta nadar en lagos tranquilos.",9],["Cultura","Los colores del arte vienen de pigmentos, que son polvos de colores. Antes se sacaban de plantas, minerales y animales.","Ibis escarlata","Eudocimus ruber","América del Sur","Eudocimus ruber|Ibis escarlata","El ibis escarlata es de un rojo intenso por los crustáceos que come. Vive en bandadas sobre manglares y costas.",9],["Cultura","Muchos museos guardan pinturas, esculturas y objetos antiguos. Visitarlos es una forma de viajar en el tiempo.","Espátula común","Platalea leucorodia","Europa, Asia y África","Platalea leucorodia|Espátula común","La espátula común tiene el pico plano, con forma de cuchara. Lo mueve de un lado a otro dentro del agua para atrapar peces.",9],["Cultura","En África hay fiestas con tambores, canciones y bailes. La música une a las personas y cuenta historias antiguas.","Secretario","Sagittarius serpentarius","Sabanas de África","Sagittarius serpentarius|Secretario|Ave secretario","El secretario es un ave de largas patas que caza serpientes a pisotones. Prefiere caminar por la sabana antes que volar.",9],["Cultura","Los cuentos populares suelen tener animales que hablan. La zorra lista, el lobo malo o la tortuga paciente enseñan lecciones a niños y mayores.","Marabú africano","Leptoptilos crumenifer","África","Leptoptilos crumenifer|Marabú africano|Marabú","El marabú es una cigüeña enorme con las alas muy largas. Se alimenta de carroña y de pequeños animales, y vive en la sabana.",9],["Cultura","El idioma español lo hablan millones de personas en América, España y otros lugares. Cada región tiene palabras y acentos propios.","Quokka","Setonix brachyurus","Australia Occidental","Setonix brachyurus|Quokka","El quokka es un pequeño marsupial que parece sonreír. Vive en una isla de Australia y no tiene miedo a las personas.",9],["Cultura","Australia está al otro lado del mundo. Cuando aquí es de día, allí es de noche, y sus estaciones son al revés que las nuestras.","Wombat común","Vombatus ursinus","Australia","Vombatus ursinus|Wombat común|Wombat","El wombat excava madrigueras con sus fuertes garras. Es el único animal que produce excrementos con forma de cubito.",9],["Cultura","Tasmania es una isla al sur de Australia. Es famosa por sus bosques, sus montañas y por los animales únicos que viven allí.","Demonio de Tasmania","Sarcophilus harrisii","Tasmania","Sarcophilus harrisii|Demonio de Tasmania","El demonio de Tasmania suelta chillidos tremendos por la noche. Tiene una de las mordidas más fuertes entre los mamíferos de su tamaño.",9],["Cultura","El canguro y el emú aparecen en el escudo de Australia. Los países eligen animales que los representan como símbolo.","Numbat","Myrmecobius fasciatus","Australia Occidental","Myrmecobius fasciatus|Numbat","El numbat es un marsupial con rayas en el lomo que come termitas. A diferencia de otros marsupiales, sale de día.",9],["Cultura","Los aborígenes australianos son los pueblos más antiguos de Australia. Tienen historias de la creación que cuentan con pinturas y canciones.","Petauro del azúcar","Petaurus breviceps","Australia y Nueva Guinea","Petaurus breviceps|Petauro del azúcar","El petauro del azúcar planea entre los árboles con una membrana entre sus patas. Le gusta el néctar y la savia dulce.",9],["Cultura","En Australia hay un perro salvaje que llegó hace miles de años. Hoy forma parte de la naturaleza del continente.","Dingo","Canis lupus dingo","Australia","Canis lupus dingo|Dingo","El dingo es un perro salvaje de color arena. Aúlla en vez de ladrar y suele cazar en pequeños grupos.",9],["Cultura","Los camaleones de Madagascar cambian de color según su estado de ánimo. Los colores sirven para comunicarse más que para esconderse.","Camaleón pantera","Furcifer pardalis","Madagascar","Furcifer pardalis|Camaleón pantera","El camaleón pantera es un reptil de colores muy vivos, que cambia según las emociones. Sus ojos giran por separado.",9],["Cultura","Hay leyendas sobre criaturas que caminan sobre el agua. En la naturaleza, un lagarto verde es capaz de hacerlo de verdad.","Basilisco verde","Basiliscus plumifrons","Selvas de América Central","Basiliscus plumifrons|Basilisco verde","El basilisco verde corre sobre el agua apoyándose en las patas traseras. Por eso lo llaman el lagarto Jesucristo.",9],["Cultura","Los camuflajes son un arte en la naturaleza. Algunos animales se parecen tanto a una hoja seca que no se ven aunque estén delante.","Geco satánico de cola de hoja","Uroplatus phantasticus","Madagascar","Uroplatus phantasticus|Geco satánico de cola de hoja","El geco de cola de hoja se parece a una hoja seca. De día se queda quieto en una rama y es casi invisible.",9],["Cultura","Los colores brillantes pueden ser una advertencia. En la naturaleza, un animal de colores llamativos suele avisar de que no es buena idea tocarlo.","Rana dardo azul","Dendrobates tinctorius azureus","Selvas de Surinam","Dendrobates tinctorius azureus|Rana dardo azul","La rana dardo azul es diminuta y de color azul brillante. Su piel tiene veneno que avisa a los depredadores de que se alejen.",9],["Cultura","Los cristales y las gemas se usan para hacer joyas. Algunos animales parecen estar hechos de cristal por lo transparentes que son.","Rana de cristal","Centrolenidae","Selvas de América Central y del Sur","Centrolenidae|Rana de cristal","La rana de cristal tiene la piel del vientre transparente. A través de ella se pueden ver el corazón y otros órganos.",9],["Cultura","Los dragones aparecen en leyendas de muchas culturas. Algunos animales de verdad se parecen a pequeños dragones, con crestas y escamas.","Tritón crestado","Triturus cristatus","Europa","Triturus cristatus|Tritón crestado","El tritón crestado macho luce una cresta en el lomo en la época de cría. Parece un pequeño dragón que vive en las charcas.",9],["Cultura","Las serpientes han aparecido en mitos y leyendas desde la Antigüedad. En muchos lugares simbolizan la sabiduría y la medicina.","Pitón bola","Python regius","África occidental y central","Python regius|Pitón bola","La pitón bola, cuando se asusta, se enrolla formando una bola con la cabeza en el centro. Es tranquila y no tiene veneno.",9],["Cultura","Los animales longevos nos recuerdan lo pequeña que es nuestra vida. Algunos nacieron antes de que nacieran nuestros bisabuelos.","Tortuga gigante de Galápagos","Chelonoidis niger","Islas Galápagos","Chelonoidis niger|Tortuga gigante de Galápagos","La tortuga gigante de Galápagos puede vivir más de cien años. Camina despacio y puede pesar más que un adulto.",9],["Cultura","El Nilo, el Amazonas y el Misisipi son ríos legendarios. En otras partes del mundo, los mares son el hogar de reptiles gigantes.","Cocodrilo marino","Crocodylus porosus","Sureste de Asia y Australia","Crocodylus porosus|Cocodrilo marino|Cocodrilo de agua salada","El cocodrilo marino es el reptil vivo más grande del mundo. Puede medir más de cinco metros y viajar largas distancias por el mar.",9],["Cultura","Los ríos sagrados de la India son parte de su cultura y su religión. En sus aguas viven animales muy antiguos.","Gavial","Gavialis gangeticus","Ríos de India y Nepal","Gavialis gangeticus|Gavial","El gavial tiene el hocico largo y estrecho con muchos dientes, ideal para atrapar peces. Es un cocodrilo en peligro de extinción.",9],["Cultura","Los buzos descubren que los arrecifes de coral son como ciudades llenas de color. Cada habitante tiene su forma y su manera de protegerse.","Pez león","Pterois volitans","Arrecifes del Indo-Pacífico","Pterois volitans|Pez león","El pez león tiene rayas y aletas con forma de abanico, con espinas venenosas. Es muy bonito, pero conviene no tocarlo.",9],["Cultura","Los colores del arrecife son tan vivos que parecen pintados. Algunos peces parecen dibujos hechos con las mejores acuarelas.","Pez mandarín","Synchiropus splendidus","Arrecifes del Pacífico","Synchiropus splendidus|Pez mandarín","El pez mandarín es azul, naranja y verde, como una obra de arte. Es muy pequeño y suele esconderse entre los corales.",9],["Cultura","Los ojos de algunos animales ven colores que nosotros no podemos ver. Por eso la naturaleza guarda secretos que solo ellos conocen.","Mantis camarón pavo real","Odontodactylus scyllarus","Arrecifes del Indo-Pacífico","Odontodactylus scyllarus|Mantis camarón pavo real|Mantis camarón","La mantis camarón pavo real golpea con tanta rapidez que rompe conchas. Sus ojos ven muchos más colores que los nuestros.",9],["Cultura","Los científicos usan microscopios para ver cosas diminutas. Con ellos descubrieron seres tan pequeños que no se ven a simple vista.","Tardígrado","Tardigrada","Casi todo el mundo","Tardigrada|Tardígrado","El tardígrado, u oso de agua, es un animalito microscópico. Resiste el frío, el calor, la falta de agua e incluso el espacio.",9],["Cultura","Dicen que los sabios aprenden a leer despacio y con atención. Con esfuerzo y paciencia, hasta lo const U=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciseis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidos','veintitres','veinticuatro','veinticinco','veintiseis','veintisiete','veintiocho','veintinueve'];
const DEC=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
const CEN=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
function numToEs(n){
  n=Math.floor(n);
  if(n<30)return U[n];
  if(n<100){const d=Math.floor(n/10),u=n%10;return DEC[d]+(u?' y '+U[u]:'')}
  if(n===100)return 'cien';
  if(n<1000){const c=Math.floor(n/100),r=n%100;return CEN[c]+(r?' '+numToEs(r):'')}
  if(n<1000000){const t=Math.floor(n/1000),r=n%1000;return (t===1?'mil':numToEs(t)+' mil')+(r?' '+numToEs(r):'')}
  return String(n);
}
function norm(s){
  s=String(s||'').toLowerCase().replace(/(\d)[.,](\d{3})(?!\d)/g,'$1$2');
  s=s.replace(/\d+/g,m=>' '+numToEs(parseInt(m,10))+' ');
  s=s.replace(/ñ/g,'§').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/§/g,'ñ');
  return s.replace(/[^a-zñ ]+/g,' ').replace(/\s+/g,' ').trim();
}
function tokens(s){const n=norm(s);return n?n.split(' '):[]}
function phon(w){
  return w.replace(/ñ/g,'ny').replace(/h/g,'').replace(/v/g,'b').replace(/ll/g,'y').replace(/w/g,'u')
    .replace(/z/g,'s').replace(/c(?=[ei])/g,'s').replace(/qu/g,'k').replace(/c/g,'k')
    .replace(/gu(?=[ei])/g,'g').replace(/g(?=[ei])/g,'j').replace(/x/g,'ks')
    .replace(/(.)\1+/g,'$1');
}
function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let p=new Array(n+1),c=new Array(n+1);for(let j=0;j<=n;j++)p[j]=j;
  for(let i=1;i<=m;i++){c[0]=i;for(let j=1;j<=n;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1))}[p,c]=[c,p]}
  return p[n];
}
function same(a,b,tol){
  if(a===b)return true;
  const pa=phon(a),pb=phon(b);
  if(pa===pb)return true;
  const L=Math.max(pa.length,pb.length);
  if(Math.min(pa.length,pb.length)<4)return false;
  return lev(pa,pb)<=Math.floor(L*tol);
}
/* Alinea las palabras esperadas con las reconocidas (en orden, con saltos y uniones/separaciones de palabras). */
function align(E,R,tol){
  const n=E.length,m=R.length;
  const dp=[];for(let i=0;i<=n;i++)dp.push(new Array(m+1).fill(0));
  const bk=[];for(let i=0;i<=n;i++)bk.push(new Array(m+1).fill(null));
  for(let i=1;i<=n;i++)for(let j=0;j<=m;j++){
    let best=dp[i-1][j],b=['e'];
    if(j>0&&dp[i][j-1]>best){best=dp[i][j-1];b=['r']}
    if(j>0&&same(E[i-1],R[j-1],tol)&&dp[i-1][j-1]+1>best){best=dp[i-1][j-1]+1;b=['m',1,1]}
    if(j>1&&same(E[i-1],R[j-2]+R[j-1],tol)&&dp[i-1][j-2]+1>best){best=dp[i-1][j-2]+1;b=['m',1,2]}
    if(i>1&&j>0&&same(E[i-2]+E[i-1],R[j-1],tol)&&dp[i-2][j-1]+2>best){best=dp[i-2][j-1]+2;b=['m',2,1]}
    dp[i][j]=best;bk[i][j]=b;
  }
  const matched=new Array(n).fill(false);
  let i=n,j=m;
  while(i>0){
    const b=bk[i][j];
    if(!b){i--;continue}
    if(b[0]==='e'){i--}
    else if(b[0]==='r'){j--}
    else{for(let k=0;k<b[1];k++)matched[i-1-k]=true;i-=b[1];j-=b[2]}
  }
  return {matched,count:matched.filter(Boolean).length};
}

const preset=()=>PRESETS[cfg.level]||PRESETS.normal;
const adultMode=()=>cfg.adult||!SR;
let session=null; // lectura en curso

/* ---------- sonido ---------- */
let AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function melody(kind){
  if(!cfg.sound)return;
  const c=ac();if(!c)return;
  const seqs={
    word:[[523,.16],[659,.16],[784,.16],[1047,.35]],
    stage:[[523,.14],[523,.14],[784,.14],[659,.14],[784,.14],[1047,.2],[988,.14],[1047,.5],[1319,.6]],
    oops:[[392,.2],[330,.3]]
  };
  let t=c.currentTime+.05;
  (seqs[kind]||seqs.word).forEach(([f,d])=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.05);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.08);t+=d;
  });
}
function speak(text){
  try{
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=.8;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- fotos (Wikipedia) ---------- */
const photoCache=new Map();let active=0;const queue=[];
function pump(){while(active<4&&queue.length){const j=queue.shift();active++;j().finally(()=>{active--;pump()})}}
function getPhoto(titles){
  const key=titles.join('|');
  if(photoCache.has(key))return photoCache.get(key);
  const p=new Promise(res=>{
    queue.push(async()=>{
      for(const lang of ['es','en']){
        for(const t of titles){
          try{
            const r=await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t.replace(/ /g,'_'))}`);
            if(!r.ok)continue;
            const d=await r.json();
            const th=d.thumbnail&&d.thumbnail.source;
            if(th){res({thumb:th,big:th.replace(/\/\d+px-/,'/640px-')});return}
          }catch(e){}
        }
      }
      res(null);
    });pump();
  });
  photoCache.set(key,p);return p;
}
function photoHTML(i,cls){
  const s=STAGES[i];
  return `<div class="ph ${cls||''}" data-ph="${i}">${esc(s[2][0])}</div>`;
}
function fillPhoto(el,i,big){
  getPhoto(STAGES[i][5].split('|')).then(p=>{
    if(!p||!el.isConnected)return;
    const img=new Image();img.className=el.className.replace('ph','photo');img.alt=STAGES[i][2];
    img.onload=()=>{if(el.isConnected)el.replaceWith(img)};
    img.src=big?p.big:p.thumb;
  });
}

/* ---------- lectura con reconocimiento ---------- */
const VM={ctx:null,stream:null,an:null,buf:null,raf:0,peaks:[],lvl:0,on:false};
async function volStart(onLevel){
  try{
    const c=ac();if(!c||!navigator.mediaDevices)return false;
    VM.stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const src=c.createMediaStreamSource(VM.stream);
    VM.an=c.createAnalyser();VM.an.fftSize=1024;src.connect(VM.an);
    VM.buf=new Float32Array(VM.an.fftSize);VM.peaks=[];VM.on=true;
    const tick=()=>{
      if(!VM.on)return;
      VM.an.getFloatTimeDomainData(VM.buf);
      let s=0;for(const v of VM.buf)s+=v*v;
      const rms=Math.sqrt(s/VM.buf.length);VM.lvl=rms;VM.peaks.push(rms);
      if(onLevel)onLevel(rms);
      VM.raf=requestAnimationFrame(tick);
    };
    tick();return true;
  }catch(e){return false}
}
function volStop(){
  VM.on=false;cancelAnimationFrame(VM.raf);
  try{VM.stream&&VM.stream.getTracks().forEach(t=>t.stop())}catch(e){}
  VM.stream=null;
  const p=VM.peaks.slice().sort((a,b)=>a-b);
  return p.length?p[Math.floor(p.length*.9)]:0;
}
const VOL_MIN={1:.012,2:.022,3:.04};

function listen(words,ui){
  const P=preset();
  let prev='',cur='',active=true,done=false,confs=[],restarts=0,rec=null;const seen=new Set();
  let t0=0,tFirst=0;const timers={};
  const evalNow=()=>{
    const R=tokens(prev+' '+cur);
    const a=align(words,R,P.tol);
    return {matched:a.matched,count:a.count,cov:a.count/words.length,R,last:a.matched[words.length-1]};
  };
  const clear=()=>Object.values(timers).forEach(clearTimeout);
  function finish(reason){
    if(done)return;done=true;active=false;clear();
    try{rec&&rec.abort()}catch(e){}
    const e=evalNow();
    const avg=confs.length?confs.reduce((a,b)=>a+b,0)/confs.length:0;
    const secs=tFirst?(Date.now()-tFirst)/1000:0;
    ui.end(Object.assign(e,{reason,avg,secs,text:(prev+' '+cur).trim()}));
  }
  function check(early){
    const e=evalNow();
    ui.live(e,(prev+' '+cur).trim());
    if(early&&(e.cov>=.97||(e.cov>=P.thr&&e.last))){
      clearTimeout(timers.ok);timers.ok=setTimeout(()=>finish('done'),650);
    }
  }
  function begin(){
    if(!active)return;
    rec=new SR();rec.lang='es-ES';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
    rec.onresult=ev=>{
      let s='';
      for(let i=0;i<ev.results.length;i++){
        const r=ev.results[i];s+=' '+r[0].transcript;
        const key=restarts+':'+i;if(r.isFinal&&r[0].confidence>0&&!seen.has(key)){seen.add(key);confs.push(r[0].confidence)}
      }
      cur=s.trim();
      if(!tFirst&&cur)tFirst=Date.now();
      clearTimeout(timers.sil);clearTimeout(timers.no);
      timers.sil=setTimeout(()=>{if(tokens(prev+' '+cur).length)finish('silence')},4200);
      check(true);
    };
    rec.onerror=ev=>{
      const e=ev.error;
      if(e==='not-allowed'||e==='service-not-allowed'||e==='audio-capture'||e==='network'||e==='language-not-supported'){finish('err:'+e)}
    };
    rec.onend=()=>{
      if(!active||done)return;
      prev=(prev+' '+cur).trim();cur='';
      if(++restarts>40){finish('silence');return}
      setTimeout(begin,120);
    };
    try{rec.start()}catch(e){if(!done)setTimeout(begin,300)}
  }
  t0=Date.now();
  timers.no=setTimeout(()=>{if(!tokens(prev+' '+cur).length)finish('nospeech')},10000);
  timers.max=setTimeout(()=>finish('silence'),90000);
  begin();
  return {stop:()=>finish('manual'),cancel:()=>{done=true;active=false;clear();try{rec&&rec.abort()}catch(e){}}};
}

/* ---------- mensajes ---------- */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const AGAIN=['¡Casi lo tienes! Inténtalo otra vez, alto y claro.','¡Muy bien intentado! Ahora más alto y clarito, ¿vale?','Respira hondo, lee despacito y con voz fuerte. ¡Tú puedes!','¡Vamos otra vez! Alto y claro para poder avanzar.'];
function failMsg(r,needVol){
  const err={'err:not-allowed':'No tengo permiso para usar el micrófono. Pulsa el candado de la barra del navegador y permite el micrófono.','err:service-not-allowed':'El navegador no deja usar el reconocimiento de voz aquí. Prueba con Chrome.','err:audio-capture':'No encuentro ningún micrófono.','err:network':'El reconocimiento de voz necesita conexión a internet.','err:language-not-supported':'Este navegador no reconoce el español.'};
  if(err[r.reason])return {t:err[r.reason],hard:true};
  if(r.reason==='nospeech'||!r.R.length)return {t:'No te he oído. Acércate un poquito al micrófono y lee alto y claro.'};
  if(needVol)return {t:'Te oigo muy flojito. ¡Más fuerte, que te quiero oír! Alto y claro.'};
  if(r.cov<.35)return {t:'No te he entendido bien. Lee más despacio, abre bien la boca y dilo alto y claro.'};
  const P=preset();
  if(r.cov>=P.thr&&P.conf&&r.avg>0&&r.avg<P.conf)return {t:'Te he oído, pero poco claro. Dilo otra vez más alto y clarito.'};
  if(r.cov>=P.thr&&!r.last)return {t:'¡Casi! Te falta llegar hasta el final. Léelo entero, alto y claro.'};
  return {t:'¡Casi! Faltaron algunas palabras (las marco en rojo). '+pick(AGAIN)};
}

/* ---------- pantallas ---------- */
function level(i){return STAGES[i][7]}
function go(fn,...a){if(session){session.cancel();session=null}volStop();try{speechSynthesis.cancel()}catch(e){}fn(...a);window.scrollTo(0,0)}

function home(){
  const total=STAGES.length;
  const done=N>=total;
  app.innerHTML=`<div class="hero fade"><div class="owl">🦉</div><h1>Lee alto y claro</h1>
  <p>Lee en voz alta, desbloquea animales y avanza de etapa.</p></div>
  <div class="stack fade">
   <button class="btn big sun" id="go">${done?'🏆 ¡Has completado todas las etapas!':(N===0?'▶ Empezar':'▶ Seguir: etapa '+(N+1))}</button>
   <div class="row"><button class="btn ghost" id="alb">📖 Mi álbum (${N}/${total})</button><button class="btn ghost" id="set">⚙ Ajustes</button></div>
   <div class="card"><div class="small">Etapa ${Math.min(N+1,total)} de ${total}</div><div class="bar" style="margin:8px 0"><i style="width:${N/total*100}%"></i></div>
   <div class="small">Nivel ${done?LEVELS.length:level(N)+1}: ${esc(LEVELS[done?LEVELS.length-1:level(N)])}</div></div>
   ${SR?'':'<div class="msg bad">Este navegador no entiende la voz. Se usará el modo con adulto: tú decides si ha leído bien. Para el reconocimiento automático usa Chrome en Android.</div>'}
  </div>`;
  $('#go').onclick=()=>{ac();done?album():stage()};
  $('#alb').onclick=album;$('#set').onclick=()=>go(settings);
}

function readView(o){
  // o: {kind:'par'|'ficha', i, text, head, sub}
  const words=o.text.split(/\s+/);
  const expected=words.map(w=>norm(w)).filter(Boolean);
  // asignar a cada palabra visible su índice esperado
  let k=0;
  const html=words.map(w=>{const n=norm(w);return n?`<span class="w" data-k="${k++}">${esc(w)}</span>`:esc(w)}).join(' ');
  return {html,expected};
}

function stage(){
  if(N>=STAGES.length)return album();
  const s=STAGES[N];
  const lv=level(N);
  const rv=readView({text:s[1]});
  app.innerHTML=`<div class="top"><button class="btn ghost small" id="back">←</button>
    <div class="grow"><div class="small">Etapa ${N+1} de ${STAGES.length} · Nivel ${lv+1}</div><div class="bar"><i style="width:${N/STAGES.length*100}%"></i></div></div></div>
    <div class="card fade"><span class="chip">${esc(s[0])}</span>
    <p class="read" id="txt" style="margin:10px 0 0;--fs:${cfg.fs}rem">${rv.html}</p>
    <div class="live" id="live"></div></div>
    <div id="msg"></div>
    <div class="stack" style="margin-top:14px" id="ctl"></div>
    <div class="tip">💡 Lee despacito, abre bien la boca y usa voz de “lo oigo desde lejos”. Si lo necesitas, pulsa 🔊 para escuchar cómo suena primero.</div>`;
  $('#back').onclick=()=>go(home);
  controls({expected:rv.expected,text:s[1],onOk:()=>{melody('word');reveal()}});
}

function controls(o){
  const ctl=$('#ctl'),msg=$('#msg');
  const spans=[...document.querySelectorAll('#txt .w')];
  const paint=(matched,final)=>spans.forEach((sp,i)=>{sp.classList.toggle('ok',!!matched[i]);sp.classList.toggle('miss',!!final&&!matched[i])});
  const setMsg=(t,cls)=>{msg.innerHTML=t?`<div class="msg ${cls||''} fade">${t}</div>`:''};
  const listenBtns=`<button class="btn big mic" id="mic">🎤 Empezar a leer</button>
    <button class="btn ghost" id="tts">🔊 Escuchar cómo se lee</button>`;
  const adultBtns=`<div class="row"><button class="btn leaf" id="okA">✔ Lo ha leído bien</button><button class="btn coral" id="noA">↻ Otra vez</button></div>
    <button class="btn ghost" id="tts">🔊 Escuchar cómo se lee</button>
    <div class="small">Modo con adulto: escucha y decide si lo ha leído alto, claro y despacio.</div>`;
  ctl.innerHTML=adultMode()?adultBtns:listenBtns;
  $('#tts').onclick=()=>speak(o.text);
  if(adultMode()){
    $('#okA').onclick=()=>{paint(o.expected.map(()=>true));o.onOk()};
    $('#noA').onclick=()=>{melody('oops');setMsg(pick(AGAIN),'bad')};
    return;
  }
  const mic=$('#mic');
  let listening=false;
  mic.onclick=async()=>{
    ac();
    if(listening){session&&session.stop();return}
    listening=true;paint([],false);setMsg('');
    mic.classList.add('on');mic.textContent='⏹ Ya terminé';
    $('#live').textContent='Te escucho…';
    if(cfg.vol)await volStart();
    session=listen(o.expected,{
      live:(e,t)=>{paint(e.matched,false);$('#live').textContent=t?'Te oigo: '+t:'Te escucho…'},
      end:r=>{
        session=null;listening=false;
        const peak=cfg.vol?volStop():0;
        mic.classList.remove('on');mic.textContent='🎤 Empezar a leer';
        const P=preset();
        const volBad=cfg.vol&&r.R.length&&peak<VOL_MIN[cfg.volLvl];
        const confBad=P.conf&&r.avg>0&&r.avg<P.conf;
        const okLast=P.thr<.7?true:(r.last||r.cov>=.95);
        const fastBad=cfg.pace&&r.secs>0&&r.secs<o.expected.length/3.3;
        const ok=r.cov>=P.thr&&okLast&&!confBad&&!volBad&&!fastBad&&!r.reason.startsWith('err');
        paint(r.matched,!ok);
        $('#live').textContent=r.text?'Te he oído: '+r.text:'';
        if(ok){o.onOk(r)}
        else{
          melody('oops');
          if(fastBad)setMsg('¡Vas muy rápido! Léelo otra vez despacito, alto y claro.','bad');
          else{const f=failMsg(r,volBad);setMsg(f.t,'bad')}
        }
      }
    });
  };
}

function reveal(){
  const i=N;const s=STAGES[i];
  const rv=readView({text:s[6]});
  app.innerHTML=`<div class="top"><button class="btn ghost small" id="back">←</button>
    <div class="grow"><div class="small">Etapa ${i+1} · ¡Animal desbloqueado!</div><div class="bar"><i style="width:${(i+.5)/STAGES.length*100}%"></i></div></div></div>
    <div class="msg good fade">🎉 ¡Muy bien! Has desbloqueado un animal. Lee su ficha alto y claro para pasar a la siguiente etapa.</div>
    <div class="card fade" style="margin-top:12px">${photoHTML(i)}
      <h2 style="font-size:1.7rem;margin:12px 0 2px">${esc(s[2])}</h2>
      <div class="facts"><div><i>${esc(s[3])}</i></div><div>📍 ${esc(s[4])}</div></div>
      <p class="read" id="txt" style="margin:0;--fs:${cfg.fs}rem">${rv.html}</p>
      <div class="live" id="live"></div></div>
    <div id="msg"></div>
    <div class="stack" style="margin-top:14px" id="ctl"></div>`;
  fillPhoto(document.querySelector('[data-ph]'),i,true);
  $('#back').onclick=()=>go(home);
  controls({expected:rv.expected,text:s[6],onOk:()=>{
    melody('stage');
    const prevLevel=level(i);
    N=i+1;saveN();
    const done=N>=STAGES.length;
    const newLv=!done&&level(N)!==prevLevel;
    modal(`<div class="big">${done?'🏆':'🎉'}</div><h2 style="margin:6px 0">${done?'¡Enhorabuena, lo has conseguido!':'¡Enhorabuena!'}</h2>
      <p style="font-size:1.15rem;margin:8px 0 16px">${done?'Has leído todas las etapas y desbloqueado todos los animales.':`Has desbloqueado la etapa ${N+1}${newLv?`<br>¡Y empieza un nivel nuevo: <b>${esc(LEVELS[level(N)])}</b>!`:''}`}</p>
      <button class="btn big sun" id="nx">${done?'Ver mi álbum':'Siguiente etapa ▶'}</button>`,()=>{
        $('#nx').onclick=()=>{closeModal();go(done?album:stage)};
    });
  }});
}

function modal(h,after){
  closeModal();
  const m=document.createElement('div');m.className='modal';m.id='modal';
  m.innerHTML=`<div class="card">${h}</div>`;document.body.appendChild(m);
  after&&after();
}
function closeModal(){const m=$('#modal');if(m)m.remove()}

function album(){
  go(()=>{
    app.innerHTML=`<div class="top"><button class="btn ghost small" id="back">←</button><h2 class="grow">Mi álbum (${N}/${STAGES.length})</h2></div><div class="grid fade" id="g"></div>`;
    $('#back').onclick=()=>go(home);
    const g=$('#g');
    const upto=Math.min(STAGES.length,N+8);
    for(let i=0;i<upto;i++){
      const t=document.createElement('div');
      if(i<N){
        t.className='tile';t.innerHTML=photoHTML(i)+`<div style="margin-top:4px">${esc(STAGES[i][2])}</div>`;
        t.onclick=()=>animalModal(i);
      }else{
        t.className='tile lock';t.innerHTML=`<div class="ph">?</div><div style="margin-top:4px">Etapa ${i+1}</div>`;
      }
      g.appendChild(t);
    }
    if(upto<STAGES.length){const t=document.createElement('div');t.className='small';t.style.gridColumn='1/-1';t.textContent=`… y ${STAGES.length-upto} animales más por descubrir.`;g.appendChild(t)}
    // fotos de forma perezosa
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);const p=e.target.querySelector('[data-ph]');if(p)fillPhoto(p,+p.dataset.ph,false)}}),{rootMargin:'200px'});
    g.querySelectorAll('.tile:not(.lock)').forEach(t=>io.observe(t));
  });
}
function animalModal(i){
  const s=STAGES[i];
  modal(`${photoHTML(i)}<h2 style="margin:10px 0 2px">${esc(s[2])}</h2><div class="facts"><i>${esc(s[3])}</i><div>📍 ${esc(s[4])}</div></div>
    <p style="text-align:left;font-size:1.05rem">${esc(s[6])}</p>
    <div class="row"><button class="btn ghost" id="sp">🔊 Escuchar</button><button class="btn sun" id="cl">Cerrar</button></div>`,()=>{
    fillPhoto(document.querySelector('#modal [data-ph]'),i,true);
    $('#sp').onclick=()=>speak(s[6]);$('#cl').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}closeModal()};
  });
}

function settings(){
  app.innerHTML=`<div class="top"><button class="btn ghost small" id="back">←</button><h2 class="grow">Ajustes</h2></div>
  <div class="card fade">
   <h3>¿Cuánto exigir al leer?</h3>
   <div class="small" style="margin:4px 0 8px">Si se frustra, ponlo en Suave. Si lo hace muy fácil, en Estricto.</div>
   <select id="lvl"><option value="suave">Suave (basta con la mayoría de palabras)</option><option value="normal">Normal</option><option value="estricto">Estricto (casi todas las palabras)</option></select>
   <label class="opt"><input type="checkbox" id="adult"><div>Modo con adulto<div class="small">El micrófono no decide: tú pulsas “Lo ha leído bien” o “Otra vez”. Se usa solo si el navegador no entiende la voz.</div></div></label>
   <label class="opt"><input type="checkbox" id="pace"><div>Pedir que lea despacio<div class="small">Si va demasiado rápido (más de unas tres palabras por segundo) le pide repetir.</div></div></label>

   <div id="volrow" style="padding:8px 0">Volumen mínimo: <select id="vl"><option value="1">Bajo</option><option value="2">Medio</option><option value="3">Alto</option></select></div>

   <div style="padding:10px 0">Tamaño del texto: <button class="btn small ghost" id="fm">A−</button> <button class="btn small ghost" id="fp">A+</button></div>
  </div>
  <div class="card fade" style="margin-top:12px">
   <h3>Probar el micrófono</h3>
   <div class="small" style="margin:4px 0 8px">Pulsa y di una frase. Verás lo que entiende el móvil y el nivel de voz.</div>
   <div class="meter"><i id="mt"></i></div>
   <div class="live" id="tt" style="min-height:2.6em;color:var(--ink)"></div>
   <button class="btn" id="test">🎤 Probar</button>
   <div class="small" style="margin-top:8px" id="tinfo"></div>
  </div>
  <div class="card fade" style="margin-top:12px">

   <button class="btn coral small" id="rs" style="margin-top:12px">Borrar todo el progreso</button>
  </div>`;
  const set=(id,k,t)=>{const e=$(id);if(t==='c'){e.checked=cfg[k];e.onchange=()=>{cfg[k]=e.checked;saveCfg();if(k==='vol')$('#volrow').style.display=cfg.vol?'':'none'}}else{e.value=cfg[k];e.onchange=()=>{cfg[k]=t==='n'?+e.value:e.value;saveCfg()}}};
  set('#lvl','level');set('#adult','adult','c');set('#pace','pace','c');set('#vol','vol','c');set('#vl','volLvl','n');set('#snd','sound','c');

  $('#back').onclick=()=>go(home);
  $('#fm').onclick=()=>{cfg.fs=Math.max(1.1,+(cfg.fs-.15).toFixed(2));saveCfg();toast()};
  $('#fp').onclick=()=>{cfg.fs=Math.min(2.6,+(cfg.fs+.15).toFixed(2));saveCfg();toast()};

  $('#jgo').onclick=()=>{const v=Math.max(1,Math.min(STAGES.length,parseInt($('#jn').value,10)||1));N=v-1;saveN();go(home)};
  $('#rs').onclick=()=>{if(confirm('¿Seguro que quieres borrar todo el progreso?')){N=0;saveN();go(home)}};
  // prueba de micrófono
  let ts=null;
  $('#test').onclick=async()=>{
    const b=$('#test');ac();
    if(ts){ts.stop();return}
    if(!SR){$('#tt').textContent='Este navegador no tiene reconocimiento de voz. Usa Chrome.';return}
    b.textContent='⏹ Parar';$('#tt').textContent='Te escucho…';$('#tinfo').textContent='';
    let on=false;
    if(cfg.vol){on=await volStart(r=>{$('#mt').style.width=Math.min(100,r*1800)+'%'})}
    ts=listen(['x'],{live:(e,t)=>{$('#tt').textContent=t||'Te escucho…'},end:r=>{
      ts=null;session=null;b.textContent='🎤 Probar';
      const pk=on?volStop():0;$('#mt').style.width='0';
      let info='';
      if(r.reason.startsWith('err'))info=failMsg(r).t;
      else if(!r.text)info='No he entendido nada. Acércate más o prueba otra vez.';
      else info='Esto es lo que ha entendido el móvil.'+(r.avg?` Claridad: ${Math.round(r.avg*100)}%.`:'')+(on?` Volumen: ${pk<VOL_MIN[1]?'muy bajo':pk<VOL_MIN[2]?'bajo':pk<VOL_MIN[3]?'medio':'alto'}.`:'');
      $('#tt').textContent=r.text||'';$('#tinfo').textContent=info;
    }});
    session=ts;
  };
}

window.__lee={numToEs,norm,tokens,phon,align,same,PRESETS,STAGES,go:(n)=>{N=n;saveN();stage()},getN:()=>N};
home();
</script>
</body>

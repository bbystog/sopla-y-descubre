where":"Océano Índico","titles":["Latimeria chalumnae","Celacanto"],"facts":["Se creía que el celacanto llevaba millones de años extinguido, pero en mil novecientos treinta y ocho se pescó uno vivo.","Vive en aguas profundas."]},{"id":"medusaluna","name":"Medusa luna","sci":"Aurelia aurita","where":"Mares de todo el mundo","titles":["Aurelia aurita","Medusa luna"],"facts":["La medusa luna está formada casi toda por agua.","No tiene cerebro ni corazón, pero se desplaza abriendo y cerrando su cuerpo."]},{"id":"piranaroja","name":"Piraña roja","sci":"Pygocentrus nattereri","where":"Ríos de América del Sur","titles":["Pygocentrus nattereri","Piraña roja","Piraña"],"facts":["La piraña roja tiene dientes afilados y suele nadar en bancos.","Come peces, frutas y restos de animales."]},{"id":"corzo","name":"Corzo","sci":"Capreolus capreolus","where":"Bosques de Europa y Asia","titles":["Capreolus capreolus","Corzo"],"facts":["El corzo es un ciervo pequeño y ágil, de ojos grandes.","Se esconde entre los arbustos y sale a comer al amanecer y al atardecer."]},{"id":"pelicanoblanco","name":"Pelícano blanco","sci":"Pelecanus onocrotalus","where":"Humedales de Europa, Asia y África","titles":["Pelecanus onocrotalus","Pelícano blanco"],"facts":["El pelícano blanco tiene una bolsa grande bajo el pico, con la que atrapa los peces.","Varios pelícanos pescan juntos en equipo."]},{"id":"impala","name":"Impala","sci":"Aepyceros melampus","where":"Sabanas de África","titles":["Aepyceros melampus","Impala"],"facts":["La impala es una antílope ágil que puede saltar más de tres metros de alto.","Cuando huye, da saltos para despistar al enemigo."]},{"id":"ranadeojosrojos","name":"Rana de ojos rojos","sci":"Agalychnis callidryas","where":"Selvas de América Central","titles":["Agalychnis callidryas","Rana de ojos rojos"],"facts":["La rana de ojos rojos duerme de día pegada a una hoja.","Si se asusta, abre los ojos y enseña sus colores para sorprender."]},{"id":"salmonatlantico","name":"Salmón atlántico","sci":"Salmo salar","where":"Atlántico norte y sus ríos","titles":["Salmo salar","Salmón del Atlántico","Salmón atlántico"],"facts":["El salmón atlántico nace en un río, vive en el mar y vuelve al río para poner huevos.","Para llegar hasta allí salta cascadas."]},{"id":"pavorealcomun","name":"Pavo real común","sci":"Pavo cristatus","where":"India y Sri Lanka","titles":["Pavo cristatus","Pavo real común","Pavo real"],"facts":["El pavo real macho abre su cola como un abanico lleno de ojos de colores.","Lo hace para impresionar a las hembras."]},{"id":"tuatara","name":"Tuátara","sci":"Sphenodon punctatus","where":"Nueva Zelanda","titles":["Sphenodon punctatus","Tuátara"],"facts":["El tuátara es un reptil de Nueva Zelanda muy parecido a los de hace doscientos millones de años.","Vive muchísimos años y es muy lento."]},{"id":"calamargigante","name":"Calamar gigante","sci":"Architeuthis dux","where":"Aguas profundas del mundo","titles":["Architeuthis dux","Calamar gigante"],"facts":["El calamar gigante vive en aguas muy profundas y tiene los ojos más grandes del mundo animal, del tamaño de un balón.","Lo puedes encontrar en: aguas profundas del mundo."]},{"id":"monoaulladorrojo","name":"Mono aullador rojo","sci":"Alouatta seniculus","where":"Selvas de América del Sur","titles":["Alouatta seniculus","Mono aullador rojo"],"facts":["El mono aullador tiene una voz tan potente que se oye a varios kilómetros.","Es uno de los animales más ruidosos de la selva."]},{"id":"liebreeuropea","name":"Liebre europea","sci":"Lepus europaeus","where":"Europa y Asia","titles":["Lepus europaeus","Liebre europea","Liebre"],"facts":["La liebre europea corre a más de sesenta kilómetros por hora.","Sus largas patas traseras le permiten esquivar a sus enemigos."]},{"id":"cormorangrande","name":"Cormorán grande","sci":"Phalacrocorax carbo","where":"Costas y ríos de casi todo el mundo","titles":["Phalacrocorax carbo","Cormorán grande"],"facts":["El cormorán grande se zambulle para pescar y después abre las alas al sol para secarlas.","Sus plumas no son tan impermeables como las de otras aves."]},{"id":"bufalocafre","name":"Búfalo cafre","sci":"Syncerus caffer","where":"Sabanas de África","titles":["Syncerus caffer","Búfalo cafre"],"facts":["El búfalo cafre vive en grandes manadas y se defiende en grupo.","Sus cuernos forman una especie de casco sobre la frente."]},{"id":"wombatcomun","name":"Wombat común","sci":"Vombatus ursinus","where":"Australia","titles":["Vombatus ursinus","Wombat común","Wombat"],"facts":["El wombat excava madrigueras con sus fuertes garras.","Es el único animal que produce excrementos con forma de cubito."]},{"id":"flamenco","name":"Flamenco","sci":"Phoenicopterus roseus","where":"Lagunas de agua salada","titles":["Phoenicopterus roseus","Flamenco común"],"facts":["El flamenco es rosa por lo que come.","Descansa a menudo sobre una sola pata y vive en lagunas de agua poco profunda."]},{"id":"cangrejoderio","name":"Cangrejo de río","sci":"Austropotamobius pallipes","where":"Ríos de Europa","titles":["Austropotamobius pallipes","Cangrejo de río"],"facts":["El cangrejo de río tiene diez patas, dos de ellas con grandes pinzas.","Se esconde bajo las piedras de día y sale de noche a comer."]},{"id":"cobrareal","name":"Cobra real","sci":"Ophiophagus hannah","where":"Sur y sureste de Asia","titles":["Ophiophagus hannah","Cobra real"],"facts":["La cobra real es la serpiente venenosa más larga del mundo.","Su alimento favorito son otras serpientes, y es la única que construye un nido."]},{"id":"pulpodeanillosazules","name":"Pulpo de anillos azules","sci":"Hapalochlaena lunulata","where":"Mares del Indo-Pacífico","titles":["Hapalochlaena lunulata","Pulpo de anillos azules"],"facts":["El pulpo de anillos azules es pequeño, pero su veneno es muy peligroso.","Cuando se siente amenazado, sus anillos brillan con un azul intenso."]},{"id":"monoarana","name":"Mono araña","sci":"Ateles","where":"Selvas de América Central y del Sur","titles":["Ateles","Mono araña"],"facts":["El mono araña usa su cola larga como una quinta mano.","Con ella se agarra a las ramas y se balancea por la selva."]},{"id":"ardillaroja","name":"Ardilla roja","sci":"Sciurus vulgaris","where":"Bosques de Europa y Asia","titles":["Sciurus vulgaris","Ardilla roja","Ardilla común"],"facts":["La ardilla roja guarda nueces y bellotas para el invierno.","A veces olvida dónde las ha escondido y así planta nuevos árboles."]},{"id":"gaviotapatiamarilla","name":"Gaviota patiamarilla","sci":"Larus michahellis","where":"Costas de Europa","titles":["Larus michahellis","Gaviota patiamarilla"],"facts":["La gaviota patiamarilla es grande y ruidosa.","Se adapta a vivir en puertos y ciudades, y come peces, restos y huevos."]},{"id":"facoquero","name":"Facóquero","sci":"Phacochoerus africanus","where":"Sabanas de África","titles":["Phacochoerus africanus","Facóquero"],"facts":["El facóquero corre con la cola levantada como si fuera una antena.","Tiene colmillos largos y se refugia en madrigueras."]},{"id":"demoniodetasmania","name":"Demonio de Tasmania","sci":"Sarcophilus harrisii","where":"Tasmania","titles":["Sarcophilus harrisii","Demonio de Tasmania"],"facts":["El demonio de Tasmania suelta chillidos tremendos por la noche.","Tiene una de las mordidas más fuertes entre los mamíferos de su tamaño."]},{"id":"hipopotamo","name":"Hipopótamo","sci":"Hippopotamus amphibius","where":"Ríos de África","titles":["Hippopotamus amphibius","Hipopótamo"],"facts":["El hipopótamo pasa el día dentro del agua para refrescarse.","Sale de noche a comer hierba."]},{"id":"cigarra","name":"Cigarra","sci":"Cicadidae","where":"Zonas cálidas del mundo","titles":["Cicadidae","Cigarra"],"facts":["La cigarra pasa años bajo tierra antes de salir al aire libre.","Los machos cantan con una membrana de su cuerpo que vibra muy deprisa."]},{"id":"equidnadepicocorto","name":"Equidna de pico corto","sci":"Tachyglossus aculeatus","where":"Australia y Nueva Guinea","titles":["Tachyglossus aculeatus","Equidna de pico corto","Equidna"],"facts":["El equidna está cubierto de púas y pone huevos.","Con su larga lengua pegajosa atrapa hormigas y termitas."]},{"id":"cangrejoaranagigante","name":"Cangrejo araña gigante","sci":"Macrocheira kaempferi","where":"Mares de Japón","titles":["Macrocheira kaempferi","Cangrejo araña gigante"],"facts":["El cangrejo araña gigante tiene patas tan largas que, extendidas, miden unos tres metros.","Vive en el fondo del mar de Japón."]},{"id":"osodeanteojos","name":"Oso de anteojos","sci":"Tremarctos ornatus","where":"Andes de América del Sur","titles":["Tremarctos ornatus","Oso de anteojos"],"facts":["El oso de anteojos es el único oso de América del Sur.","Tiene manchas claras alrededor de los ojos, como unas gafas."]},{"id":"lirongris","name":"Lirón gris","sci":"Glis glis","where":"Bosques de Europa","titles":["Glis glis","Lirón gris"],"facts":["El lirón gris duerme el invierno entero en su refugio.","Puede pasar siete meses durmiendo sin apenas moverse."]},{"id":"charranartico","name":"Charrán ártico","sci":"Sterna paradisaea","where":"Del Ártico a la Antártida","titles":["Sterna paradisaea","Charrán ártico"],"facts":["El charrán ártico hace la migración más larga del mundo, de polo a polo.","Cada año recorre decenas de miles de kilómetros."]},{"id":"osobezudo","name":"Oso bezudo","sci":"Melursus ursinus","where":"India y Sri Lanka","titles":["Melursus ursinus","Oso bezudo","Oso perezoso"],"facts":["El oso bezudo tiene el pelaje largo y despeinado.","Usa sus labios para aspirar hormigas y termitas, haciendo mucho ruido."]},{"id":"gorilademontana","name":"Gorila de montaña","sci":"Gorilla beringei beringei","where":"Montañas de África","titles":["Gorilla beringei beringei","Gorila de montaña"],"facts":["El gorila de montaña vive entre volcanes de África.","Es fuerte, pero también muy tranquilo, y vive en familia."]},{"id":"luciernaga","name":"Luciérnaga","sci":"Lampyridae","where":"Zonas templadas y tropicales","titles":["Lampyridae","Luciérnaga"],"facts":["La luciérnaga produce luz en su cuerpo para comunicarse con otras luciérnagas.","Es una luz fría que no quema."]},{"id":"guacamayorojo","name":"Guacamayo rojo","sci":"Ara macao","where":"Selvas de América","titles":["Ara macao","Guacamayo rojo"],"facts":["El guacamayo rojo tiene plumas escarlata, azules y amarillas.","Es muy ruidoso y puede vivir más de cincuenta años."]},{"id":"pezciegodelascuevas","name":"Pez ciego de las cuevas","sci":"Astyanax mexicanus","where":"Cuevas de México","titles":["Astyanax mexicanus","Pez ciego de las cuevas","Pez ciego mexicano"],"facts":["Algunos peces de cueva han perdido los ojos porque en la oscuridad no los necesitan.","Se orientan con otros sentidos, como el tacto."]},{"id":"langostaeuropea","name":"Langosta europea","sci":"Homarus gammarus","where":"Costas del Atlántico y Mediterráneo","titles":["Homarus gammarus","Langosta europea"],"facts":["La langosta europea es azulada y se vuelve roja al cocinarla.","Vive escondida en grietas y sale de noche a buscar comida."]},{"id":"chinchilla","name":"Chinchilla","sci":"Chinchilla lanigera","where":"Andes de Chile","titles":["Chinchilla lanigera","Chinchilla"],"facts":["La chinchilla tiene el pelo más suave y denso que casi cualquier otro mamífero.","Vive en las rocas de los Andes y salta con agilidad."]},{"id":"martacomun","name":"Marta común","sci":"Martes martes","where":"Bosques de Europa","titles":["Martes martes","Marta común","Marta"],"facts":["La marta común es un animal ágil que trepa a los árboles con soltura.","Come ratones, aves, huevos y frutos del bosque."]},{"id":"cisnecantor","name":"Cisne cantor","sci":"Cygnus cygnus","where":"Norte de Europa y Asia","titles":["Cygnus cygnus","Cisne cantor"],"facts":["El cisne cantor tiene el pico amarillo con la punta negra.","Pasa el verano en el norte y vuela hacia el sur cuando llega el frío."]},{"id":"osomalayo","name":"Oso malayo","sci":"Helarctos malayanus","where":"Selvas del sudeste de Asia","titles":["Helarctos malayanus","Oso malayo"],"facts":["El oso malayo es el oso más pequeño del mundo.","Tiene una mancha clara en el pecho y una lengua larguísima para sacar miel."]},{"id":"petaurodelazucar","name":"Petauro del azúcar","sci":"Petaurus breviceps","where":"Australia y Nueva Guinea","titles":["Petaurus breviceps","Petauro del azúcar"],"facts":["El petauro del azúcar planea entre los árboles con una membrana entre sus patas.","Le gusta el néctar y la savia dulce."]},{"id":"alce","name":"Alce","sci":"Alces alces","where":"Bosques del norte","titles":["Alces alces","Alce"],"facts":["El alce es el ciervo más grande del mundo.","Los machos tienen unas astas enormes que pierden y les vuelven a crecer cada año."]},{"id":"mantisreligiosa","name":"Mantis religiosa","sci":"Mantis religiosa","where":"Europa, África y Asia","titles":["Mantis religiosa"],"facts":["La mantis religiosa espera inmóvil con las patas delanteras plegadas.","Cuando pasa un insecto, lo atrapa en un instante."]},{"id":"tapircentroamericano","name":"Tapir centroamericano","sci":"Tapirus bairdii","where":"Centroamérica y norte de Colombia","titles":["Tapirus bairdii","Tapir centroamericano"],"facts":["El tapir centroamericano tiene una pequeña trompa con la que agarra hojas y frutos.","Nada y bucea muy bien, y descansa en la selva."]},{"id":"proteo","name":"Proteo","sci":"Proteus anguinus","where":"Cuevas del sureste de Europa","titles":["Proteus anguinus","Proteo"],"facts":["El proteo es un anfibio ciego de piel clara que vive en cuevas con agua.","Puede pasar años sin comer y vive más de cien años."]},{"id":"anguilaeuropea","name":"Anguila europea","sci":"Anguilla anguilla","where":"Atlántico y ríos de Europa","titles":["Anguilla anguilla","Anguila europea"],"facts":["La anguila europea nace en el mar de los Sargazos, cruza el Atlántico y sube por los ríos.","Años después regresa allí para poner huevos."]},{"id":"guanaco","name":"Guanaco","sci":"Lama guanicoe","where":"Los Andes y la Patagonia","titles":["Lama guanicoe","Guanaco"],"facts":["El guanaco es un pariente salvaje de la llama.","Vive en rebaños y, cuando algo lo asusta, lo avisa con un relincho y echa a correr."]},{"id":"armino","name":"Armiño","sci":"Mustela erminea","where":"Hemisferio norte","titles":["Mustela erminea","Armiño"],"facts":["En invierno el armiño se vuelve completamente blanco, salvo la punta de la cola, que se queda negra.","Es un cazador pequeño pero veloz."]},{"id":"grullacomun","name":"Grulla común","sci":"Grus grus","where":"Europa y Asia","titles":["Grus grus","Grulla común"],"facts":["La grulla común vuela en grandes bandadas con forma de V.","Hace un sonido fuerte y trompeteante que se oye desde lejos."]},{"id":"dingo","name":"Dingo","sci":"Canis lupus dingo","where":"Australia","titles":["Canis lupus dingo","Dingo"],"facts":["El dingo es un perro salvaje de color arena.","Aúlla en vez de ladrar y suele cazar en pequeños grupos."]},{"id":"focaleopardo","name":"Foca leopardo","sci":"Hydrurga leptonyx","where":"Mares helados de la Antártida","titles":["Hydrurga leptonyx","Foca leopardo"],"facts":["La foca leopardo tiene manchas como un leopardo.","Es una gran cazadora y come peces, krill y hasta pingüinos."]},{"id":"escarabajopelotero","name":"Escarabajo pelotero","sci":"Scarabaeus sacer","where":"Zonas cálidas de África y Europa","titles":["Scarabaeus sacer","Escarabajo pelotero"],"facts":["El escarabajo pelotero hace bolas con excrementos de otros animales y las empuja con las patas traseras.","Con ellas se alimenta y cuida a sus crías."]},{"id":"llama","name":"Llama","sci":"Lama glama","where":"Los Andes","titles":["Lama glama","Llama"],"facts":["La llama es un animal fuerte que los incas usaban para transportar cargas.","Cuando se enfada, puede escupir a quien la molesta."]},{"id":"geckoleopardo","name":"Gecko leopardo","sci":"Eublepharis macularius","where":"Asia central y meridional","titles":["Eublepharis macularius","Gecko leopardo"],"facts":["El gecko leopardo tiene manchas y guarda grasa en la cola.","A diferencia de otros geckos, tiene párpados y no trepa por las paredes."]},{"id":"nandu","name":"Ñandú","sci":"Rhea americana","where":"Pampas de América del Sur","titles":["Rhea americana","Ñandú"],"facts":["El ñandú es un ave grande que no puede volar, pero corre muy rápido.","El macho cuida los huevos y a las crías."]},{"id":"ruisenorcomun","name":"Ruiseñor común","sci":"Luscinia megarhynchos","where":"Europa y África","titles":["Luscinia megarhynchos","Ruiseñor común","Ruiseñor"],"facts":["El ruiseñor es pequeño y de color pardo, pero su canto es potente y hermoso.","Muchas veces canta de noche."]},{"id":"picopicapinos","name":"Pico picapinos","sci":"Dendrocopos major","where":"Bosques de Europa y Asia","titles":["Dendrocopos major","Pico picapinos"],"facts":["El pico picapinos golpea los troncos para buscar insectos y hacer su nido.","Su cráneo está preparado para aguantar los golpes."]},{"id":"avestruz","name":"Avestruz","sci":"Struthio camelus","where":"Sabanas y desiertos de África","titles":["Struthio camelus","Avestruz"],"facts":["El avestruz es la mayor ave del mundo y no vuela, pero corre muy rápido.","Sus ojos son más grandes que su cerebro."]},{"id":"camaleonpantera","name":"Camaleón pantera","sci":"Furcifer pardalis","where":"Madagascar","titles":["Furcifer pardalis","Camaleón pantera"],"facts":["El camaleón pantera es un reptil de colores muy vivos, que cambia según las emociones.","Sus ojos giran por separado."]},{"id":"caracoldejardin","name":"Caracol de jardín","sci":"Cornu aspersum","where":"Jardines y campos","titles":["Cornu aspersum","Caracol común"],"facts":["El caracol de jardín se mueve muy despacio, deslizándose sobre una baba.","Sale cuando el suelo está húmedo."]},{"id":"murcielagograndedeherradura","name":"Murciélago grande de herradura","sci":"Rhinolophus ferrumequinum","where":"Cuevas de Europa, África y Asia","titles":["Rhinolophus ferrumequinum","Murciélago grande de herradura"],"facts":["El murciélago de herradura descansa colgado boca abajo en las cuevas.","De noche emite sonidos que rebotan en los objetos y le ayudan a orientarse."]},{"id":"alpaca","name":"Alpaca","sci":"Vicugna pacos","where":"Los Andes","titles":["Vicugna pacos","Alpaca"],"facts":["La alpaca se cría por su lana, muy suave y cálida.","Vive en grupos y en los Andes ayuda a muchas familias a ganarse la vida."]},{"id":"artemia","name":"Artemia","sci":"Artemia salina","where":"Lagos salados del mundo","titles":["Artemia salina","Artemia"],"facts":["La artemia es un diminuto crustáceo que vive en aguas muy saladas.","Sus huevos resisten la sequía durante años y eclosionan al mojarse."]},{"id":"tiburonduende","name":"Tiburón duende","sci":"Mitsukurina owstoni","where":"Aguas profundas del mundo","titles":["Mitsukurina owstoni","Tiburón duende"],"facts":["El tiburón duende vive en aguas profundas y tiene un hocico alargado y una mandíbula que se proyecta hacia adelante para atrapar a sus presas.","Lo puedes encontrar en: aguas profundas del mundo."]},{"id":"tamandua","name":"Tamandúa","sci":"Tamandua tetradactyla","where":"Selvas de América del Sur","titles":["Tamandua tetradactyla","Tamandúa"],"facts":["El tamandúa es un pariente más pequeño del oso hormiguero gigante.","Trepa a los árboles para buscar hormigas y termitas."]},{"id":"petirrojo","name":"Petirrojo","sci":"Erithacus rubecula","where":"Europa y Asia","titles":["Erithacus rubecula","Petirrojo"],"facts":["El petirrojo tiene el pecho de un color naranja rojizo.","Canta incluso en invierno y defiende con valentía su territorio."]},{"id":"aguilapescadora","name":"Águila pescadora","sci":"Pandion haliaetus","where":"Casi todo el mundo","titles":["Pandion haliaetus","Águila pescadora"],"facts":["El águila pescadora se lanza en picado y atrapa los peces con las garras.","Tiene las patas con espinas que evitan que se le resbalen."]},{"id":"casuario","name":"Casuario","sci":"Casuarius casuarius","where":"Selvas de Nueva Guinea y Australia","titles":["Casuarius casuarius","Casuario"],"facts":["El casuario tiene en la cabeza una especie de casco y plumas que parecen pelo.","Es tímido, pero muy fuerte si se siente amenazado."]},{"id":"basiliscoverde","name":"Basilisco verde","sci":"Basiliscus plumifrons","where":"Selvas de América Central","titles":["Basiliscus plumifrons","Basilisco verde"],"facts":["El basilisco verde corre sobre el agua apoyándose en las patas traseras.","Por eso lo llaman el lagarto Jesucristo."]},{"id":"abejamelifera","name":"Abeja melífera","sci":"Apis mellifera","where":"Campos y jardines","titles":["Apis mellifera","Abeja melífera"],"facts":["La abeja melífera vive en colmenas con miles de hermanas.","Con el néctar de las flores fabrica la miel."]},{"id":"focamonjedelmediterraneo","name":"Foca monje del Mediterráneo","sci":"Monachus monachus","where":"Mar Mediterráneo y Atlántico","titles":["Monachus monachus","Foca monje del Mediterráneo"],"facts":["La foca monje del Mediterráneo es una de las focas más escasas del mundo.","Descansa y cría en cuevas junto al mar."]},{"id":"vicuna","name":"Vicuña","sci":"Vicugna vicugna","where":"Los Andes","titles":["Vicugna vicugna","Vicuña"],"facts":["La vicuña es un pariente salvaje y delgado de la llama.","Su lana es finísima y los incas la reservaban para sus reyes."]},{"id":"lampreamarina","name":"Lamprea marina","sci":"Petromyzon marinus","where":"Atlántico norte y sus ríos","titles":["Petromyzon marinus","Lamprea marina"],"facts":["La lamprea marina parece una anguila, pero no tiene mandíbula.","Tiene una boca redonda con dientes, con la que se pega a otros peces."]},{"id":"ocelote","name":"Ocelote","sci":"Leopardus pardalis","where":"América Central y del Sur","titles":["Leopardus pardalis","Ocelote"],"facts":["El ocelote es un gato salvaje de manchas bonitas.","Caza de noche y trepa a los árboles y nada con facilidad."]},{"id":"albatroserrante","name":"Albatros errante","sci":"Diomedea exulans","where":"Océanos del hemisferio sur","titles":["Diomedea exulans","Albatros errante"],"facts":["El albatros errante tiene las alas más largas de todas las aves, de más de tres metros.","Puede volar durante horas sin batirlas."]},{"id":"gansoindio","name":"Ganso indio","sci":"Anser indicus","where":"Asia central y sur de Asia","titles":["Anser indicus","Ganso indio"],"facts":["El ganso indio vuela sobre el Himalaya durante sus viajes migratorios.","Se sabe que cruza cumbres altísimas, donde el aire es muy fino."]},{"id":"emu","name":"Emú","sci":"Dromaius novaehollandiae","where":"Australia","titles":["Dromaius novaehollandiae","Emú"],"facts":["El emú es la segunda ave más grande del mundo.","Corre mucho y el macho cuida los huevos hasta que nacen los polluelos."]},{"id":"gecosatanicodecoladehoja","name":"Geco satánico de cola de hoja","sci":"Uroplatus phantasticus","where":"Madagascar","titles":["Uroplatus phantasticus","Geco satánico de cola de hoja"],"facts":["El geco de cola de hoja se parece a una hoja seca.","De día se queda quieto en una rama y es casi invisible."]},{"id":"zorrorojo","name":"Zorro rojo","sci":"Vulpes vulpes","where":"Bosques y campos","titles":["Vulpes vulpes","Zorro rojo"],"facts":["El zorro rojo tiene una cola larga y muy peluda.","Oye tan bien que puede encontrar ratones debajo de la nieve."]},{"id":"sepiacomun","name":"Sepia común","sci":"Sepia officinalis","where":"Mares templados","titles":["Sepia officinalis","Sepia común","Sepia"],"facts":["La sepia cambia de color en un instante para esconderse o comunicarse.","Tiene tres corazones y lanza tinta cuando se asusta."]},{"id":"condorandino","name":"Cóndor andino","sci":"Vultur gryphus","where":"Los Andes","titles":["Vultur gryphus","Cóndor andino"],"facts":["El cóndor andino es una de las aves voladoras más grandes del mundo.","Con las alas abiertas mide más de tres metros."]},{"id":"iguanamarina","name":"Iguana marina","sci":"Amblyrhynchus cristatus","where":"Islas Galápagos","titles":["Amblyrhynchus cristatus","Iguana marina"],"facts":["La iguana marina de las Galápagos es la única que se zambulle en el mar.","Come algas y luego estornuda para soltar la sal."]},{"id":"pezremo","name":"Pez remo","sci":"Regalecus glesne","where":"Aguas profundas del mundo","titles":["Regalecus glesne","Pez remo"],"facts":["El pez remo es el pez óseo más largo del mundo, pues alcanza ocho metros.","Nada despacio en aguas profundas y se ve muy pocas veces."]},{"id":"frailecilloatlantico","name":"Frailecillo atlántico","sci":"Fratercula arctica","where":"Atlántico norte","titles":["Fratercula arctica","Frailecillo atlántico","Frailecillo"],"facts":["El frailecillo tiene un pico muy colorido.","Bucea para pescar y puede llevar varios peces en el pico a la vez."]},{"id":"mirlocomun","name":"Mirlo común","sci":"Turdus merula","where":"Europa, Asia y norte de África","titles":["Turdus merula","Mirlo común"],"facts":["El mirlo común canta al amanecer y al anochecer.","Los machos son negros con el pico amarillo, y las hembras son marrones."]},{"id":"lorogrisafricano","name":"Loro gris africano","sci":"Psittacus erithacus","where":"Selvas de África","titles":["Psittacus erithacus","Loro gris africano","Loro gris"],"facts":["El loro gris africano es muy listo y puede aprender muchas palabras.","Imita voces y sonidos, y entiende lo que significan algunas de ellas."]},{"id":"ranadardoazul","name":"Rana dardo azul","sci":"Dendrobates tinctorius azureus","where":"Selvas de Surinam","titles":["Dendrobates tinctorius azureus","Rana dardo azul"],"facts":["La rana dardo azul es diminuta y de color azul brillante.","Su piel tiene veneno que avisa a los depredadores de que se alejen."]},{"id":"aguilareal","name":"Águila real","sci":"Aquila chrysaetos","where":"Montañas del hemisferio norte","titles":["Aquila chrysaetos","Águila real"],"facts":["El águila real vuela muy alto sobre las montañas.","Tiene tan buena vista que ve a su presa desde muy lejos."]},{"id":"caballitodemar","name":"Caballito de mar","sci":"Hippocampus","where":"Mares templados y tropicales","titles":["Hippocampus","Caballito de mar"],"facts":["El caballito de mar nada de pie y se agarra a las algas con la cola.","El macho lleva los huevos en una bolsa hasta que nacen las crías."]},{"id":"leonasiatico","name":"León asiático","sci":"Panthera leo persica","where":"Bosque de Gir, India","titles":["Panthera leo persica","León asiático"],"facts":["El león asiático vive hoy solo en un bosque de la India.","Es algo más pequeño que el africano y su melena es más corta."]},{"id":"tritoncrestado","name":"Tritón crestado","sci":"Triturus cristatus","where":"Europa","titles":["Triturus cristatus","Tritón crestado"],"facts":["El tritón crestado macho luce una cresta en el lomo en la época de cría.","Parece un pequeño dragón que vive en las charcas."]},{"id":"pitonbola","name":"Pitón bola","sci":"Python regius","where":"África occidental y central","titles":["Python regius","Pitón bola"],"facts":["La pitón bola, cuando se asusta, se enrolla formando una bola con la cabeza en el centro.","Es tranquila y no tiene veneno."]},{"id":"tortugagigantedegalapagos","name":"Tortuga gigante de Galápagos","sci":"Chelonoidis niger","where":"Islas Galápagos","titles":["Chelonoidis niger","Tortuga gigante de Galápagos"],"facts":["La tortuga gigante de Galápagos puede vivir más de cien años.","Camina despacio y puede pesar más que un adulto."]},{"id":"cocodrilomarino","name":"Cocodrilo marino","sci":"Crocodylus porosus","where":"Sureste de Asia y Australia","titles":["Crocodylus porosus","Cocodrilo marino","Cocodrilo de agua salada"],"facts":["El cocodrilo marino es el reptil vivo más grande del mundo.","Puede medir más de cinco metros y viajar largas distancias por el mar."]},{"id":"pezleon","name":"Pez león","sci":"Pterois volitans","where":"Arrecifes del Indo-Pacífico","titles":["Pterois volitans","Pez león"],"facts":["El pez león tiene rayas y aletas con forma de abanico, con espinas venenosas.","Es muy bonito, pero conviene no tocarlo."]},{"id":"pezmandarin","name":"Pez mandarín","sci":"Synchiropus splendidus","where":"Arrecifes del Pacífico","titles":["Synchiropus splendidus","Pez mandarín"],"facts":["El pez mandarín es azul, naranja y verde, como una obra de arte.","Es muy pequeño y suele esconderse entre los corales."]},{"id":"mantiscamaronpavoreal","name":"Mantis camarón pavo real","sci":"Odontodactylus scyllarus","where":"Arrecifes del Indo-Pacífico","titles":["Odontodactylus scyllarus","Mantis camarón pavo real","Mantis camarón"],"facts":["La mantis camarón pavo real golpea con tanta rapidez que rompe conchas.","Sus ojos ven muchos más colores que los nuestros."]},{"id":"medusainmortal","name":"Medusa inmortal","sci":"Turritopsis dohrnii","where":"Mares del mundo","titles":["Turritopsis dohrnii","Medusa inmortal"],"facts":["La medusa inmortal puede volver a su etapa de pólipo cuando es adulta.","Eso le permite empezar de nuevo y rejuvenecer."]},{"id":"lemmingdenoruega","name":"Lemming de Noruega","sci":"Lemmus lemmus","where":"Montañas del norte de Europa","titles":["Lemmus lemmus","Lemming noruego"],"facts":["Es un roedor pequeño que vive en el frío norte.","En invierno hace túneles bajo la nieve para buscar comida.","Algunos años hay muchísimos y se mueven en grandes grupos."]},{"id":"avutardacomun","name":"Avutarda común","sci":"Otis tarda","where":"Llanuras de Europa y Asia","titles":["Otis tarda","Avutarda común"],"facts":["Es una de las aves voladoras más pesadas del mundo.","Los machos se inflan y abren las plumas para presumir.","Vive en llanuras abiertas con cultivos."]},{"id":"iguanaverde","name":"Iguana verde","sci":"Iguana iguana","where":"Selvas de América","titles":["Iguana iguana","Iguana verde"],"facts":["Es un lagarto grande que vive en los árboles.","Come sobre todo hojas y flores.","Nada muy bien y se tira al agua desde las ramas."]},{"id":"escorpionamarillo","name":"Escorpión amarillo","sci":"Buthus occitanus","where":"Sur de Europa y norte de África","titles":["Buthus occitanus","Escorpión amarillo"],"facts":["Vive bajo las piedras y sale de noche.","Tiene una cola con aguijón en la punta.","Encuentra a sus presas por las vibraciones del suelo."]},{"id":"monorhesus","name":"Mono rhesus","sci":"Macaca mulatta","where":"Asia","titles":["Macaca mulatta","Macaco rhesus"],"facts":["Tiene la cara rosada y el pelo marrón claro.","Vive en grupos y se adapta a muchos lugares.","Es un gran nadador."]},{"id":"marmotaalpina","name":"Marmota alpina","sci":"Marmota marmota","where":"Los Alpes y los Pirineos","titles":["Marmota marmota","Marmota alpina"],"facts":["Silba muy fuerte para avisar a las demás si ve un peligro.","Duerme casi todo el invierno en una madriguera.","Vive en las montañas, en grupos familiares."]},{"id":"abubilla","name":"Abubilla","sci":"Upupa epops","where":"Europa, Asia y África","titles":["Upupa epops","Abubilla"],"facts":["Tiene una cresta de plumas que abre como un abanico.","Su pico largo y curvo busca insectos en el suelo.","Su canto suena como pu-pu-pu."]},{"id":"dragonbarbudo","name":"Dragón barbudo","sci":"Pogona vitticeps","where":"Desiertos de Australia","titles":["Pogona vitticeps","Dragón barbudo"],"facts":["Hincha la barba espinosa cuando se siente amenazado.","Mueve un brazo para saludar a otros dragones.","Le encanta tomar el sol sobre las rocas."]},{"id":"escolopendra","name":"Escolopendra","sci":"Scolopendra cingulata","where":"Mediterráneo","titles":["Scolopendra cingulata","Escolopendra"],"facts":["Tiene el cuerpo largo con muchas patas.","Caza de noche insectos y arañas.","Se esconde bajo las piedras y los troncos."]},{"id":"focacomun","name":"Foca común","sci":"Phoca vitulina","where":"Costas del hemisferio norte","titles":["Phoca vitulina","Foca común"],"facts":["Descansa sobre rocas y playas cuando baja la marea.","Bucea para pescar y puede aguantar mucho sin respirar.","Los bebés saben nadar a las pocas horas de nacer."]},{"id":"hamstereuropeo","name":"Hámster europeo","sci":"Cricetus cricetus","where":"Campos de Europa y Asia","titles":["Cricetus cricetus","Hámster europeo"],"facts":["Guarda semillas en sus mejillas, que se hinchan como globos.","Construye madrigueras con varias salas.","Es mucho más grande que los hámsters de las tiendas."]},{"id":"carracaeuropea","name":"Carraca europea","sci":"Coracias garrulus","where":"Europa, Asia y África","titles":["Coracias garrulus","Carraca europea"],"facts":["Tiene plumas de un azul turquesa precioso.","Se posa en cables y ramas para vigilar insectos.","Viaja a África en invierno."]},{"id":"lagartoocelado","name":"Lagarto ocelado","sci":"Timon lepidus","where":"Península ibérica y Francia","titles":["Timon lepidus","Lagarto ocelado"],"facts":["Es el lagarto más grande de Europa.","Tiene manchas azules a los lados.","Se esconde en madrigueras de conejo."]},{"id":"abejorrocomun","name":"Abejorro común","sci":"Bombus terrestris","where":"Europa y Asia","titles":["Bombus terrestris","Abejorro común"],"facts":["Es grande y peludo, con rayas amarillas y negras.","Vuela incluso con frío, porque calienta su cuerpo.","Poliniza flores y cultivos."]},{"id":"ballenajorobada","name":"Ballena jorobada","sci":"Megaptera novaeangliae","where":"Todos los océanos","titles":["Megaptera novaeangliae","Ballena jorobada"],"facts":["Canta canciones largas que cambian con los años.","Salta fuera del agua y cae de golpe.","Cada cola tiene un dibujo distinto, como una huella."]},{"id":"puercoespincrestado","name":"Puercoespín crestado","sci":"Hystrix cristata","where":"África y Europa","titles":["Hystrix cristata","Puercoespín crestado"],"facts":["Tiene miles de púas largas que levanta cuando se asusta.","Las púas se caen y le salen nuevas.","Sale de noche a comer raíces y frutas."]},{"id":"cucocomun","name":"Cuco común","sci":"Cuculus canorus","where":"Europa, Asia y África","titles":["Cuculus canorus","Cuco común"],"facts":["Pone sus huevos en nidos de otras aves.","Su canto suena como cu-cú.","Viaja a África cuando llega el frío."]},{"id":"lucion","name":"Lución","sci":"Anguis fragilis","where":"Europa","titles":["Anguis fragilis","Lución"],"facts":["Parece una serpiente, pero es un lagarto sin patas.","Puede parpadear, algo que las serpientes no hacen.","Come babosas y lombrices."]},{"id":"avisponeuropeo","name":"Avispón europeo","sci":"Vespa crabro","where":"Europa y Asia","titles":["Vespa crabro","Avispón europeo"],"facts":["Es la avispa más grande de Europa.","Hace su nido de un papel que fabrica masticando madera.","Caza otros insectos y los lleva a sus crías."]},{"id":"marsopacomun","name":"Marsopa común","sci":"Phocoena phocoena","where":"Mares del hemisferio norte","titles":["Phocoena phocoena","Marsopa común"],"facts":["Es parecida a un delfín pequeño, con el hocico corto.","Es tímida y se acerca poco a los barcos.","Nada en grupos pequeños."]},{"id":"coati","name":"Coatí","sci":"Nasua nasua","where":"Selvas de América del Sur","titles":["Nasua nasua","Coatí"],"facts":["Tiene el hocico largo y flexible para buscar insectos.","Camina con la cola levantada como una antena.","Los grupos de hembras y crías se mueven juntos."]},{"id":"buhoreal","name":"Búho real","sci":"Bubo bubo","where":"Europa y Asia","titles":["Bubo bubo","Búho real"],"facts":["Es uno de los búhos más grandes del mundo.","Tiene unos penachos en la cabeza que parecen orejas.","Sus ojos naranjas ven muy bien de noche."]},{"id":"culebrabastarda","name":"Culebra bastarda","sci":"Malpolon monspessulanus","where":"Sur de Europa y norte de África","titles":["Malpolon monspessulanus","Culebra bastarda"],"facts":["Es una de las serpientes más grandes de Europa.","Es muy rápida y levanta la cabeza para mirar.","Tiene los ojos con una ceja prominente."]},{"id":"hormigaroja","name":"Hormiga roja","sci":"Myrmica rubra","where":"Europa","titles":["Myrmica rubra","Hormiga roja"],"facts":["Vive en colonias con una o varias reinas.","Cuida pulgones y les saca un jugo dulce.","Hace sus nidos bajo piedras y troncos."]},{"id":"leonmarinodesteller","name":"León marino de Steller","sci":"Eumetopias jubatus","where":"Costas del Pacífico norte","titles":["Eumetopias jubatus","León marino de Steller"],"facts":["Es el mayor de los leones marinos.","Los machos tienen una melena de pelo grueso en el cuello.","Descansa en grandes grupos sobre las rocas."]},{"id":"kinkaju","name":"Kinkajú","sci":"Potos flavus","where":"Selvas de América","titles":["Potos flavus","Kinkajú"],"facts":["Tiene una cola que usa como una mano para agarrarse.","Su lengua es larguísima y saca la miel de las flores.","Duerme de día y vive en lo alto de los árboles."]},{"id":"carabocomun","name":"Cárabo común","sci":"Strix aluco","where":"Bosques de Europa","titles":["Strix aluco","Cárabo común"],"facts":["Tiene la cara redonda y los ojos oscuros.","Ulula por la noche en los bosques.","Descansa de día pegado a un tronco."]},{"id":"serpientedecascabel","name":"Serpiente de cascabel","sci":"Crotalus","where":"Américas","titles":["Crotalus","Serpiente de cascabel"],"facts":["Hace ruido con el cascabel de la cola cuando se asusta.","Cada vez que cambia de piel, le sale un anillo nuevo.","Detecta el calor de sus presas con unas fositas especiales."]},{"id":"mariposaazulmorfo","name":"Mariposa azul Morfo","sci":"Morpho menelaus","where":"Selvas de América","titles":["Morpho menelaus","Morpho menelaus"],"facts":["Sus alas brillan con un azul metálico.","Ese color viene de la forma de sus escamas.","Por debajo, sus alas son marrones y se esconde bien."]},{"id":"lobomarinodegalapagos","name":"Lobo marino de Galápagos","sci":"Zalophus wollebaeki","where":"Islas Galápagos","titles":["Zalophus wollebaeki","Lobo marino de Galápagos"],"facts":["Juega con las olas y con los visitantes.","Es curioso y no suele tener miedo.","Duerme en las playas de las islas."]},{"id":"tejonmelero","name":"Tejón melero","sci":"Mellivora capensis","where":"África y Asia","titles":["Mellivora capensis","Tejón melero"],"facts":["Es famoso por ser muy valiente, aunque sea pequeño.","Le encanta la miel y las larvas de abeja.","Tiene una piel gruesa que lo protege de las picaduras."]},{"id":"buitrenegro","name":"Buitre negro","sci":"Aegypius monachus","where":"Europa y Asia","titles":["Aegypius monachus","Buitre negro"],"facts":["Es el ave de presa más grande de Europa.","Sus alas abiertas miden casi tres metros.","Anida en lo alto de los árboles."]},{"id":"mambanegra","name":"Mamba negra","sci":"Dendroaspis polylepis","where":"Sabanas de África","titles":["Dendroaspis polylepis","Mamba negra"],"facts":["Es una de las serpientes más rápidas del mundo.","Su boca por dentro es de color negro.","Es muy tímida y evita a las personas."]},{"id":"mariposaapolo","name":"Mariposa Apolo","sci":"Parnassius apollo","where":"Montañas de Europa y Asia","titles":["Parnassius apollo","Parnassius apollo"],"facts":["Tiene alas blancas con manchas rojas.","Vive en las praderas de montaña.","Es una mariposa protegida."]},{"id":"rinocerontenegro","name":"Rinoceronte negro","sci":"Diceros bicornis","where":"África","titles":["Diceros bicornis","Rinoceronte negro"],"facts":["Tiene dos cuernos y el labio superior puntiagudo.","Con él agarra ramas y hojas de los arbustos.","Es muy escaso y se protege."]},{"id":"hurondepatasnegras","name":"Hurón de patas negras","sci":"Mustela nigripes","where":"Praderas de Norteamérica","titles":["Mustela nigripes","Hurón de patas negras"],"facts":["Tiene una máscara negra en la cara y patas oscuras.","Vive en las madrigueras de los perros de la pradera.","Estuvo a punto de desaparecer, pero se está recuperando."]},{"id":"alimochecomun","name":"Alimoche común","sci":"Neophron percnopterus","where":"Europa, Asia y África","titles":["Neophron percnopterus","Alimoche común"],"facts":["Es un pequeño buitre blanco con la cara amarilla.","Usa piedras para romper huevos, y eso muestra que es muy listo.","Viaja a África en invierno."]},{"id":"serpientedecoral","name":"Serpiente de coral","sci":"Micrurus","where":"América","titles":["Micrurus","Serpiente de coral"],"facts":["Tiene anillos rojos, amarillos y negros muy llamativos.","Los colores avisan de que es venenosa.","Casi siempre está escondida bajo las hojas."]},{"id":"mariposapavoreal","name":"Mariposa pavo real","sci":"Aglais io","where":"Europa y Asia","titles":["Aglais io","Aglais io"],"facts":["Tiene manchas en las alas que parecen ojos.","Con ellas asusta a los pájaros.","Pasa el invierno escondida en cuevas o árboles."]},{"id":"elefantedebosqueafricano","name":"Elefante de bosque africano","sci":"Loxodonta cyclotis","where":"Selvas de África central","titles":["Loxodonta cyclotis","Elefante de selva africano"],"facts":["Es más pequeño que el elefante de sabana.","Tiene los colmillos rectos y orientados hacia abajo.","Abre caminos en la selva para otros animales."]},{"id":"visoneuropeo","name":"Visón europeo","sci":"Mustela lutreola","where":"Ríos de Europa","titles":["Mustela lutreola","Visón europeo"],"facts":["Nada muy bien y caza peces y ranas.","Tiene el pelo marrón oscuro y suave.","Es muy escaso y necesita ríos limpios."]},{"id":"milanoreal","name":"Milano real","sci":"Milvus milvus","where":"Europa","titles":["Milvus milvus","Milano real"],"facts":["Tiene la cola en forma de horquilla.","Planea durante horas sin mover las alas.","Su silueta rojiza se reconoce desde lejos."]},{"id":"boaesmeralda","name":"Boa esmeralda","sci":"Corallus caninus","where":"Selvas de América del Sur","titles":["Corallus caninus","Boa esmeralda"],"facts":["Es verde brillante y vive enrollada en las ramas.","De bebé es amarilla o naranja.","Tiene dientes largos para sujetar a sus presas."]},{"id":"esfingecabezademuerto","name":"Esfinge cabeza de muerto","sci":"Acherontia atropos","where":"Europa, África y Asia","titles":["Acherontia atropos","Esfinge cabeza de muerto"],"facts":["Tiene en el dorso un dibujo que parece una calavera.","Es una polilla grande que sale de noche.","Puede hacer un chillido al sentirse en peligro."]},{"id":"bufalodeagua","name":"Búfalo de agua","sci":"Bubalus bubalis","where":"Asia","titles":["Bubalus bubalis","Búfalo de agua"],"facts":["Le encanta meterse en el agua y el barro.","Tiene cuernos grandes y curvos.","Se usa para trabajar los campos de arroz."]},{"id":"turon","name":"Turón","sci":"Mustela putorius","where":"Bosques y campos de Europa","titles":["Mustela putorius","Turón"],"facts":["Tiene una máscara oscura sobre los ojos.","Caza ratones y ranas por la noche.","Cuando se asusta, suelta un olor fuerte."]},{"id":"cernicalocomun","name":"Cernícalo común","sci":"Falco tinnunculus","where":"Europa, Asia y África","titles":["Falco tinnunculus","Cernícalo común"],"facts":["Se queda parado en el aire moviendo las alas.","Desde allí ve los ratones del suelo.","Ve la luz ultravioleta, y así sigue el rastro de sus presas."]},{"id":"pitonreticulada","name":"Pitón reticulada","sci":"Malayopython reticulatus","where":"Sureste de Asia","titles":["Malayopython reticulatus","Pitón reticulada"],"facts":["Es la serpiente más larga del mundo.","Tiene un dibujo de rombos en el cuerpo.","Nada muy bien y llega a las islas."]},{"id":"escarabajorinoceronte","name":"Escarabajo rinoceronte","sci":"Oryctes nasicornis","where":"Europa y norte de África","titles":["Oryctes nasicornis","Escarabajo rinoceronte"],"facts":["El macho tiene un cuerno en la cabeza.","Es fuerte y brillante.","Sus larvas viven en la madera podrida."]},{"id":"gaur","name":"Gaur","sci":"Bos gaurus","where":"Bosques de Asia","titles":["Bos gaurus","Gaur"],"facts":["Es el bóvido salvaje más grande del mundo.","Tiene los cuernos curvados y las patas blancas.","Vive en manadas en los bosques de India."]},{"id":"ualabi","name":"Ualabí","sci":"Notamacropus rufogriseus","where":"Australia y Tasmania","titles":["Notamacropus rufogriseus","Ualabí de cuello rojo"],"facts":["Es un pariente pequeño del canguro.","Salta con sus fuertes patas traseras.","La cría vive en la bolsa de su mamá durante meses."]},{"id":"pinzonvulgar","name":"Pinzón vulgar","sci":"Fringilla coelebs","where":"Europa y Asia","titles":["Fringilla coelebs","Pinzón vulgar"],"facts":["Es un pajarito de pecho rosado y alas con rayas.","Canta en primavera desde las ramas.","Come semillas e insectos pequeños."]},{"id":"tortugamora","name":"Tortuga mora","sci":"Testudo graeca","where":"Sur de Europa y norte de África","titles":["Testudo graeca","Tortuga mora"],"facts":["Tiene un caparazón abombado con manchas.","Duerme en invierno bajo tierra.","Come hierbas, flores y frutas."]},{"id":"ciervovolante","name":"Ciervo volante","sci":"Lucanus cervus","where":"Bosques de Europa","titles":["Lucanus cervus","Ciervo volante"],"facts":["Es el escarabajo más grande de Europa.","Los machos tienen mandíbulas como astas de ciervo.","Las larvas viven años en la madera de los robles."]},{"id":"tapirmalayo","name":"Tapir malayo","sci":"Tapirus indicus","where":"Selvas de Asia","titles":["Tapirus indicus","Tapir malayo"],"facts":["Su cuerpo tiene dos colores: negro delante y blanco detrás.","Ese dibujo lo camufla en la oscuridad.","Es buen nadador y pasa tiempo en los ríos."]},{"id":"canguroarboricola","name":"Canguro arborícola","sci":"Dendrolagus","where":"Selvas de Nueva Guinea y Australia","titles":["Dendrolagus","Canguro arborícola"],"facts":["Es un canguro que vive subido a los árboles.","Salta de rama en rama con mucha agilidad.","Tiene una cola larga que le ayuda a mantener el equilibrio."]},{"id":"jilgueroeuropeo","name":"Jilguero europeo","sci":"Carduelis carduelis","where":"Europa y Asia","titles":["Carduelis carduelis","Jilguero europeo"],"facts":["Tiene la cara roja, blanca y negra, y las alas amarillas.","Le gustan las semillas de los cardos.","Su canto es suave y musical."]},{"id":"galapagoleproso","name":"Galápago leproso","sci":"Mauremys leprosa","where":"Península ibérica y norte de África","titles":["Mauremys leprosa","Galápago leproso"],"facts":["Es una tortuga de agua dulce que vive en ríos y charcas.","Le gusta tomar el sol sobre las piedras.","Tiene un caparazón liso de color oscuro."]},{"id":"escarabajotigre","name":"Escarabajo tigre","sci":"Cicindela campestris","where":"Europa","titles":["Cicindela campestris","Cicindela campestris"],"facts":["Es uno de los insectos más rápidos corriendo.","Corre tan deprisa que se para a ratos para ver.","Es un gran cazador de hormigas y moscas."]},{"id":"osohormigueroenano","name":"Oso hormiguero enano","sci":"Cyclopes didactylus","where":"Selvas de América","titles":["Cyclopes didactylus","Oso hormiguero sedoso"],"facts":["Es del tamaño de una ardilla y tiene el pelo suave.","Duerme de día enroscado en una rama.","Come hormigas con su lengua larguísima."]},{"id":"bandicut","name":"Bandicut","sci":"Perameles","where":"Australia","titles":["Perameles","Bandicut"],"facts":["Es un marsupial pequeño con el hocico largo.","Cava agujeritos en el suelo para buscar gusanos.","Su bebé crece en una bolsa que se abre hacia atrás."]},{"id":"carbonerocomun","name":"Carbonero común","sci":"Parus major","where":"Europa y Asia","titles":["Parus major","Carbonero común"],"facts":["Tiene el pecho amarillo con una raya negra.","Es muy ágil y cuelga boca abajo de las ramas.","Hace nidos en huecos de árboles y cajas nido."]},{"id":"tortugamordedora","name":"Tortuga mordedora","sci":"Chelydra serpentina","where":"Norteamérica","titles":["Chelydra serpentina","Tortuga mordedora"],"facts":["Tiene el cuello largo y una mordida fuerte.","Su caparazón parece de roca con musgo.","Se queda quieta bajo el agua esperando a su presa."]},{"id":"ciervoalmizclero","name":"Ciervo almizclero","sci":"Moschus moschiferus","where":"Montañas de Asia","titles":["Moschus moschiferus","Ciervo almizclero siberiano"],"facts":["No tiene astas, pero los machos tienen colmillos largos.","Es muy ágil y salta entre las rocas.","Vive en bosques fríos de montaña."]},{"id":"zorrovolador","name":"Zorro volador","sci":"Pteropus","where":"Islas de Asia y Oceanía","titles":["Pteropus","Zorro volador"],"facts":["Es un murciélago enorme con cara de zorro.","Sus alas abiertas pueden medir casi dos metros.","Come frutas y néctar, y vuela por la noche."]},{"id":"herrerillocomun","name":"Herrerillo común","sci":"Cyanistes caeruleus","where":"Europa","titles":["Cyanistes caeruleus","Herrerillo común"],"facts":["Es un pajarito de gorro azul y pecho amarillo.","Es muy curioso y acrobático.","Come orugas y semillas."]},{"id":"tortugadecaja","name":"Tortuga de caja","sci":"Terrapene carolina","where":"Norteamérica","titles":["Terrapene carolina","Tortuga de caja"],"facts":["Puede cerrar su caparazón por completo, como una caja.","Es una tortuga terrestre muy longeva.","Come bayas, hongos y lombrices."]},{"id":"insectopalo","name":"Insecto palo","sci":"Phasmatodea","where":"Zonas cálidas del mundo","titles":["Phasmatodea","Insecto palo"],"facts":["Parece una ramita seca.","Se queda inmóvil para pasar desapercibido.","Algunos miden más de treinta centímetros."]},{"id":"murcielagovampirocomun","name":"Murciélago vampiro común","sci":"Desmodus rotundus","where":"América","titles":["Desmodus rotundus","Murciélago vampiro común"],"facts":["Es un murciélago pequeño que se alimenta de sangre.","Puede caminar y saltar por el suelo.","Los miembros de un grupo comparten la comida entre ellos."]},{"id":"reyezuelolistado","name":"Reyezuelo listado","sci":"Regulus ignicapilla","where":"Europa","titles":["Regulus ignicapilla","Reyezuelo listado"],"facts":["Es una de las aves más pequeñas de Europa.","Tiene una raya naranja brillante en la cabeza.","Pesa lo que una moneda."]},{"id":"caimanyacare","name":"Caimán yacaré","sci":"Caiman yacare","where":"Humedales de América del Sur","titles":["Caiman yacare","Caimán yacaré"],"facts":["Vive en el Pantanal, entre ríos y lagunas.","Tiene unas protuberancias como gafas entre los ojos.","Cuida a sus huevos y a sus crías."]},{"id":"insectohoja","name":"Insecto hoja","sci":"Phyllium","where":"Selvas de Asia","titles":["Phyllium","Insecto hoja"],"facts":["Su cuerpo parece una hoja verde con nervaduras.","Se mueve como una hoja al viento.","Es un maestro del camuflaje."]},{"id":"pudu","name":"Pudú","sci":"Pudu puda","where":"Bosques de Chile y Argentina","titles":["Pudu puda","Pudú"],"facts":["Es el ciervo más pequeño del mundo.","Mide apenas la altura de una rodilla de un adulto.","Vive en los bosques húmedos del sur de América."]},{"id":"chochin","name":"Chochín","sci":"Troglodytes troglodytes","where":"Europa, Asia y Norteamérica","titles":["Troglodytes troglodytes","Chochín"],"facts":["Es diminuto, pero su canto es muy potente.","Levanta la cola cuando canta.","Se esconde entre arbustos y ramas bajas."]},{"id":"aligatoramericano","name":"Aligátor americano","sci":"Alligator mississippiensis","where":"Sureste de Estados Unidos","titles":["Alligator mississippiensis","Caimán americano"],"facts":["Es uno de los reptiles más grandes de América.","Cava charcas que sirven de refugio a otros animales.","Las crías llaman a su mamá desde el huevo."]},{"id":"chincheapestosa","name":"Chinche apestosa","sci":"Nezara viridula","where":"Zonas cálidas y templadas","titles":["Nezara viridula","Chinche verde"],"facts":["Tiene forma de escudo y es de color verde.","Suelta un olor fuerte para defenderse.","Pincha las plantas para chupar su savia."]},{"id":"gaceladethomson","name":"Gacela de Thomson","sci":"Eudorcas thomsonii","where":"Sabanas de África oriental","titles":["Eudorcas thomsonii","Gacela de Thomson"],"facts":["Tiene una franja negra a cada lado del cuerpo.","Da saltos para avisar a los demás de que hay peligro.","Es muy veloz y escapa de los guepardos zigzagueando."]},{"id":"oropendolaeuropea","name":"Oropéndola europea","sci":"Oriolus oriolus","where":"Europa, Asia y África","titles":["Oriolus oriolus","Oropéndola europea"],"facts":["El macho es amarillo brillante con alas negras.","Es difícil de ver, porque se esconde entre las hojas.","Su canto parece una flauta."]},{"id":"ranaverdecomun","name":"Rana verde común","sci":"Pelophylax perezi","where":"Península ibérica","titles":["Pelophylax perezi","Rana común"],"facts":["Vive en charcas y arroyos.","Croa en grupo, sobre todo al anochecer.","Atrapa insectos con su lengua pegajosa."]},{"id":"caballitodeldiablo","name":"Caballito del diablo","sci":"Calopteryx","where":"Ríos de Europa","titles":["Calopteryx","Caballito del diablo"],"facts":["Se parece a una libélula, pero pliega las alas al posarse.","Las alas de los machos brillan con tonos azules y verdes.","Sus larvas viven en el agua."]},{"id":"grankudu","name":"Gran kudú","sci":"Tragelaphus strepsiceros","where":"Sabanas de África","titles":["Tragelaphus strepsiceros","Gran kudú"],"facts":["Los machos tienen cuernos enormes en espiral.","Tiene rayas blancas en los costados.","Es tímido y se esconde entre los arbustos."]},{"id":"urracacomun","name":"Urraca común","sci":"Pica pica","where":"Europa y Asia","titles":["Pica pica","Urraca común"],"facts":["Tiene plumas negras, blancas y con brillos azules.","Es muy lista y reconoce su reflejo en el espejo.","Hace grandes nidos de ramas."]},{"id":"sapoparterocomun","name":"Sapo partero común","sci":"Alytes obstetricans","where":"Europa","titles":["Alytes obstetricans","Sapo partero común"],"facts":["El macho lleva los huevos pegados a las patas traseras.","Su canto parece un pitido suave.","Cuando los huevos están listos, los lleva al agua."]},{"id":"efimera","name":"Efímera","sci":"Ephemeroptera","where":"Ríos de todo el mundo","titles":["Ephemeroptera","Efímera"],"facts":["Los adultos viven solo uno o dos días.","Las larvas pasan hasta dos años en el agua.","Salen de los ríos al atardecer en grandes enjambres."]},{"id":"oricedearabia","name":"Órice de Arabia","sci":"Oryx leucoryx","where":"Desiertos de Arabia","titles":["Oryx leucoryx","Órice de Arabia"],"facts":["Tiene los cuernos largos y rectos.","Su pelo blanco refleja el sol del desierto.","Aguanta mucho tiempo sin beber agua."]},{"id":"arrendajoeuroasiatico","name":"Arrendajo euroasiático","sci":"Garrulus glandarius","where":"Bosques de Europa y Asia","titles":["Garrulus glandarius","Arrendajo euroasiático"],"facts":["Tiene plumas azules con rayas negras en las alas.","Entierra bellotas, y así planta nuevos robles.","Imita sonidos de otras aves."]},{"id":"ranatoro","name":"Rana toro","sci":"Aquarana catesbeiana","where":"Norteamérica","titles":["Aquarana catesbeiana","Rana toro"],"facts":["Es una de las ranas más grandes del mundo.","Su croar suena como el mugido de un toro.","Come casi cualquier cosa que cabe en su boca."]},{"id":"cigarron","name":"Cigarrón","sci":"Gryllotalpa gryllotalpa","where":"Europa","titles":["Gryllotalpa gryllotalpa","Grillotopo"],"facts":["Tiene patas delanteras como palas para excavar.","Vive bajo tierra, como un topo.","También sabe volar y nadar."]},{"id":"pecaridecollar","name":"Pecarí de collar","sci":"Dicotyles tajacu","where":"América","titles":["Dicotyles tajacu","Pecarí de collar"],"facts":["Se parece a un jabalí pequeño.","Tiene una franja clara como un collar alrededor del cuello.","Vive en grupos y busca raíces y frutos."]},{"id":"chovapiquirroja","name":"Chova piquirroja","sci":"Pyrrhocorax pyrrhocorax","where":"Montañas y costas de Europa y Asia","titles":["Pyrrhocorax pyrrhocorax","Chova piquirroja"],"facts":["Tiene el pico y las patas de color rojo.","Vuela en grupos haciendo acrobacias.","Vive en acantilados y montañas."]},{"id":"langostadeldesierto","name":"Langosta del desierto","sci":"Schistocerca gregaria","where":"África y Asia","titles":["Schistocerca gregaria","Langosta del desierto"],"facts":["A veces forma enormes nubes de millones de insectos.","Un grupo puede comer tanto como mucha gente en un día.","Viaja grandes distancias empujado por el viento."]},{"id":"babirusa","name":"Babirusa","sci":"Babyrousa babyrussa","where":"Islas de Indonesia","titles":["Babyrousa babyrussa","Babirusa"],"facts":["Los machos tienen colmillos que crecen hacia arriba y se curvan.","Se parece a un cerdo, pero vive en las selvas de Indonesia.","Le gusta bañarse en el barro y en los ríos."]},{"id":"perdizroja","name":"Perdiz roja","sci":"Alectoris rufa","where":"Península ibérica y Francia","titles":["Alectoris rufa","Perdiz roja"],"facts":["Tiene rayas negras en los costados.","Prefiere correr antes que volar.","Vive en los campos de cereal y los matorrales."]},{"id":"tritonalpino","name":"Tritón alpino","sci":"Ichthyosaura alpestris","where":"Montañas de Europa","titles":["Ichthyosaura alpestris","Tritón alpino"],"facts":["Tiene el vientre naranja brillante.","Vive en charcas de montaña.","Los machos cambian de color en la época de cría."]},{"id":"caracolmanzana","name":"Caracol manzana","sci":"Pomacea canaliculata","where":"Aguas dulces de América del Sur","titles":["Pomacea canaliculata","Caracol manzana"],"facts":["Es un caracol acuático de gran tamaño.","Pone huevos rosados fuera del agua.","Respira con una especie de tubo, como un snorkel."]},{"id":"lemurdegorguera","name":"Lémur de gorguera","sci":"Varecia variegata","where":"Selvas de Madagascar","titles":["Varecia variegata","Lémur de gorguera blanco y negro"],"facts":["Tiene un pelaje blanco y negro con un collar de pelo.","Es uno de los lémures más ruidosos.","Construye nidos de hojas en lo alto de los árboles."]},{"id":"codornizcomun","name":"Codorniz común","sci":"Coturnix coturnix","where":"Europa, Asia y África","titles":["Coturnix coturnix","Codorniz común"],"facts":["Es una de las aves de caza más pequeñas.","Se esconde tan bien entre la hierba que es difícil verla.","Cada año hace un largo viaje migratorio."]},{"id":"sapodesurinam","name":"Sapo de Surinam","sci":"Pipa pipa","where":"Selvas de América del Sur","titles":["Pipa pipa","Sapo de Surinam"],"facts":["Es plano como una hoja y casi no tiene lengua.","Las crías nacen de la espalda de la mamá.","Vive siempre en el agua."]},{"id":"babosaleopardo","name":"Babosa leopardo","sci":"Limax maximus","where":"Europa","titles":["Limax maximus","Babosa leopardo"],"facts":["Tiene manchas oscuras en la piel como un leopardo.","Se cuelga de un hilo de moco para aparearse.","Es una de las babosas más grandes."]},{"id":"indri","name":"Indri","sci":"Indri indri","where":"Selvas de Madagascar","titles":["Indri indri","Indri"],"facts":["Es el lémur más grande que existe.","Canta con una voz muy potente que se oye a kilómetros.","Salta de árbol en árbol con las piernas largas."]},{"id":"faisancomun","name":"Faisán común","sci":"Phasianus colchicus","where":"Asia y Europa","titles":["Phasianus colchicus","Faisán común"],"facts":["El macho tiene colores brillantes y una cola larguísima.","Prefiere caminar y vuela solo en distancias cortas.","Fue llevado desde Asia a Europa hace siglos."]},{"id":"ranaarboricolaverde","name":"Rana arborícola verde","sci":"Hyla arborea","where":"Europa","titles":["Hyla arborea","Ranita de San Antonio"],"facts":["Tiene ventosas en los dedos para trepar.","Cambia de color entre verde y gris.","El macho hincha una bolsa en la garganta para croar."]},{"id":"vieira","name":"Vieira","sci":"Pecten maximus","where":"Mares del Atlántico","titles":["Pecten maximus","Vieira"],"facts":["Su concha tiene forma de abanico.","Nada abriendo y cerrando la concha.","Tiene muchos ojitos azules en el borde."]},{"id":"coloboblancoynegro","name":"Colobo blanco y negro","sci":"Colobus guereza","where":"Selvas de África","titles":["Colobus guereza","Colobo guereza"],"facts":["Tiene una larga capa de pelo blanco sobre el cuerpo negro.","Vive en los árboles y casi no baja al suelo.","Los bebés nacen completamente blancos."]},{"id":"palomatorcaz","name":"Paloma torcaz","sci":"Columba palumbus","where":"Europa y Asia","titles":["Columba palumbus","Paloma torcaz"],"facts":["Tiene una mancha blanca en cada lado del cuello.","Es la paloma más grande de Europa.","Arrulla con un sonido suave."]},{"id":"ranaleopardo","name":"Rana leopardo","sci":"Lithobates pipiens","where":"Norteamérica","titles":["Lithobates pipiens","Rana leopardo"],"facts":["Tiene manchas oscuras como un leopardo.","Salta muy lejos y muy rápido.","Vive cerca de lagunas y praderas húmedas."]},{"id":"calamarcomun","name":"Calamar común","sci":"Loligo vulgaris","where":"Atlántico y Mediterráneo","titles":["Loligo vulgaris","Calamar común"],"facts":["Nada propulsado por un chorro de agua.","Tiene tres corazones.","Lanza tinta para escapar."]},{"id":"langurdorado","name":"Langur dorado","sci":"Trachypithecus geei","where":"Bosques de India y Bután","titles":["Trachypithecus geei","Langur dorado"],"facts":["Su pelaje cambia de dorado a crema según la estación.","Tiene la cara negra.","Es muy escaso y vive en pocos bosques."]},{"id":"colibrigargantaderubi","name":"Colibrí garganta de rubí","sci":"Archilochus colubris","where":"Norteamérica y Centroamérica","titles":["Archilochus colubris","Colibrí garganta de rubí"],"facts":["Su garganta brilla roja como un rubí.","Mueve las alas decenas de veces por segundo.","Cruza el golfo de México en su migración."]},{"id":"pezangel","name":"Pez ángel","sci":"Pterophyllum scalare","where":"Ríos del Amazonas","titles":["Pterophyllum scalare","Pez ángel"],"facts":["Tiene el cuerpo plano y alto, como un triángulo.","Sus aletas largas parecen alas.","Vive entre las plantas de los ríos tranquilos."]},{"id":"pulpomimo","name":"Pulpo mimo","sci":"Thaumoctopus mimicus","where":"Mares del sudeste de Asia","titles":["Thaumoctopus mimicus","Pulpo mimo"],"facts":["Se disfraza de otros animales, como la medusa o el pez león.","Cambia su forma y su color.","Así engaña a los que quieren comérselo."]},{"id":"macacojapones","name":"Macaco japonés","sci":"Macaca fuscata","where":"Islas de Japón","titles":["Macaca fuscata","Macaco japonés"],"facts":["Es famoso porque se baña en aguas termales en invierno.","Vive en lugares fríos y nevados.","Hace bolas de nieve y juega con ellas."]},{"id":"pinzondedarwin","name":"Pinzón de Darwin","sci":"Geospiza","where":"Islas Galápagos","titles":["Geospiza","Pinzones de Darwin"],"facts":["Cada isla tiene pinzones con picos distintos.","Con ellos, Darwin entendió cómo cambian los animales.","Algunos usan espinas de cactus para sacar insectos."]},{"id":"pezcirujanoazul","name":"Pez cirujano azul","sci":"Paracanthurus hepatus","where":"Arrecifes del Indo-Pacífico","titles":["Paracanthurus hepatus","Pez cirujano azul"],"facts":["Es azul brillante con una marca negra.","Tiene una espina afilada junto a la cola.","Vive entre los corales."]},{"id":"carabelaportuguesa","name":"Carabela portuguesa","sci":"Physalia physalis","where":"Mares cálidos","titles":["Physalia physalis","Carabela portuguesa"],"facts":["Flota en la superficie como un globo azul.","Es en realidad un grupo de pequeños animales unidos.","Sus tentáculos pican y es mejor no tocarla."]},{"id":"gelada","name":"Gelada","sci":"Theropithecus gelada","where":"Montañas de Etiopía","titles":["Theropithecus gelada","Gelada"],"facts":["Tiene una zona roja en el pecho, como un corazón.","Come sobre todo hierba, algo raro entre los monos.","Vive en las altas montañas de Etiopía."]},{"id":"guacamayoazulyamarillo","name":"Guacamayo azul y amarillo","sci":"Ara ararauna","where":"Selvas de América del Sur","titles":["Ara ararauna","Guacamayo azul y amarillo"],"facts":["Tiene plumas azules por arriba y amarillas por abajo.","Es muy ruidoso y se oye desde lejos.","Puede vivir más de cincuenta años."]},{"id":"pezcofre","name":"Pez cofre","sci":"Ostracion cubicus","where":"Arrecifes tropicales","titles":["Ostracion cubicus","Pez cofre amarillo"],"facts":["Su cuerpo tiene forma de caja.","Tiene una armadura de placas duras.","De joven es amarillo con puntitos negros."]},{"id":"anemonademar","name":"Anémona de mar","sci":"Actinia equina","where":"Mares del mundo","titles":["Actinia equina","Anémona de mar"],"facts":["Parece una flor, pero es un animal.","Sus tentáculos paralizan a sus presas.","Los peces payaso viven protegidos entre ellos."]},{"id":"goriladellanuraoccidental","name":"Gorila de llanura occidental","sci":"Gorilla gorilla gorilla","where":"Selvas de África central","titles":["Gorilla gorilla gorilla","Gorila occidental de llanura"],"facts":["Es el gorila más numeroso.","Vive en familia, dirigida por un macho de lomo plateado.","Come hojas, brotes y frutas."]},{"id":"periquitocomun","name":"Periquito común","sci":"Melopsittacus undulatus","where":"Australia","titles":["Melopsittacus undulatus","Periquito común"],"facts":["En libertad es verde y amarillo, y forma bandadas enormes.","Vive en las zonas secas de Australia.","Puede aprender a imitar palabras."]},{"id":"pezloro","name":"Pez loro","sci":"Scarus","where":"Arrecifes tropicales","titles":["Scarus","Pez loro"],"facts":["Tiene una boca parecida a un pico de loro.","Con ella muerde el coral y produce arena fina.","Por la noche se envuelve en una burbuja de moco para dormir."]},{"id":"esponjademar","name":"Esponja de mar","sci":"Porifera","where":"Mares del mundo","titles":["Porifera","Esponja de mar"],"facts":["Es un animal que no se mueve del sitio.","Filtra el agua para tomar su alimento.","Su cuerpo está lleno de agujeritos."]},{"id":"siamang","name":"Siamang","sci":"Symphalangus syndactylus","where":"Selvas de Sumatra y Malasia","titles":["Symphalangus syndactylus","Siamang"],"facts":["Es el gibón más grande.","Tiene una bolsa en la garganta que se infla para cantar.","Se desplaza balanceándose con sus largos brazos."]},{"id":"cacatuaninfa","name":"Cacatúa ninfa","sci":"Nymphicus hollandicus","where":"Australia","titles":["Nymphicus hollandicus","Cacatúa ninfa"],"facts":["Tiene una cresta amarilla y mejillas anaranjadas.","Es muy sociable y silba melodías.","Vive en zonas secas y abiertas de Australia."]},{"id":"pezescorpion","name":"Pez escorpión","sci":"Scorpaena porcus","where":"Mares templados","titles":["Scorpaena porcus","Rascacio"],"facts":["Se parece a una roca llena de algas.","Tiene espinas con veneno.","Espera inmóvil a que pase una presa."]},{"id":"pepinodemar","name":"Pepino de mar","sci":"Holothuroidea","where":"Mares del mundo","titles":["Holothuroidea","Pepino de mar"],"facts":["Parece un pepino blando que se arrastra por el fondo.","Limpia la arena comiéndose los restos.","Algunos sueltan partes de su cuerpo para escapar."]},{"id":"monoardilla","name":"Mono ardilla","sci":"Saimiri sciureus","where":"Selvas de América del Sur","titles":["Saimiri sciureus","Mono ardilla común"],"facts":["Es un mono pequeño y muy rápido.","Su cola larga le ayuda a equilibrarse.","Vive en grupos de muchos individuos."]},{"id":"pajarocampana","name":"Pájaro campana","sci":"Procnias","where":"Selvas de América","titles":["Procnias","Pájaro campana"],"facts":["Su canto suena como una campana metálica.","Es uno de los sonidos más fuertes entre las aves.","Los machos tienen una carúncula que cuelga del pico."]},{"id":"pezpiedra","name":"Pez piedra","sci":"Synanceia verrucosa","where":"Arrecifes del Indo-Pacífico","titles":["Synanceia verrucosa","Pez piedra"],"facts":["Se confunde con una piedra del fondo.","Es el pez más venenoso del mundo.","No se mueve, para pasar desapercibido."]},{"id":"liriodemar","name":"Lirio de mar","sci":"Crinoidea","where":"Mares del mundo","titles":["Crinoidea","Lirio de mar"],"facts":["Parece una planta, pero es un animal.","Es pariente de la estrella de mar.","Algunos nadan moviendo sus brazos con plumas."]},{"id":"titileondorado","name":"Tití león dorado","sci":"Leontopithecus rosalia","where":"Selvas de Brasil","titles":["Leontopithecus rosalia","Tití león dorado"],"facts":["Tiene el pelo de color dorado como una melena de león.","Es muy pequeño y ágil.","Estuvo en peligro, pero hoy se está recuperando."]},{"id":"gallitodelasrocas","name":"Gallito de las rocas","sci":"Rupicola peruvianus","where":"Selvas de los Andes","titles":["Rupicola peruvianus","Gallito de las rocas andino"],"facts":["Los machos son de un naranja muy brillante.","Tienen una cresta redonda como un abanico.","Bailan en grupo para atraer a las hembras."]},{"id":"pezsapo","name":"Pez sapo","sci":"Antennarius","where":"Mares tropicales","titles":["Antennarius","Pez sapo"],"facts":["Tiene una pequeña caña de pescar sobre la cabeza.","La mueve como un gusanito para atraer a otros peces.","Puede caminar con sus aletas."]},{"id":"krillantartico","name":"Krill antártico","sci":"Euphausia superba","where":"Océano Antártico","titles":["Euphausia superba","Krill antártico"],"facts":["Es un crustáceo diminuto que vive en enormes nubes.","Es el alimento de las ballenas azules.","Brilla en la oscuridad con luz propia."]},{"id":"uakaricalvo","name":"Uakarí calvo","sci":"Cacajao calvus","where":"Selvas del Amazonas","titles":["Cacajao calvus","Uakarí calvo"],"facts":["Tiene la cara roja y sin pelo.","Vive en los bosques que se inundan.","Su cola es corta, distinta a la de otros monos."]},{"id":"pelicanopardo","name":"Pelícano pardo","sci":"Pelecanus occidentalis","where":"Costas de América","titles":["Pelecanus occidentalis","Pelícano pardo"],"facts":["Se lanza en picado al mar para pescar.","Su bolsa del pico se llena de agua y peces.","Es el pelícano más pequeño del mundo."]},{"id":"pezvolador","name":"Pez volador","sci":"Exocoetidae","where":"Mares tropicales","titles":["Exocoetidae","Pez volador"],"facts":["Salta fuera del agua y planea con sus aletas largas.","Así escapa de los peces que lo persiguen.","Puede recorrer decenas de metros en el aire."]},{"id":"cangrejoviolinista","name":"Cangrejo violinista","sci":"Uca","where":"Costas tropicales","titles":["Uca","Cangrejo violinista"],"facts":["Los machos tienen una pinza enorme y la otra pequeña.","Mueven la pinza grande para llamar a las hembras.","Viven en agujeros en la arena y el barro."]},{"id":"pichiciego","name":"Pichiciego","sci":"Chlamyphorus truncatus","where":"Desiertos de Argentina","titles":["Chlamyphorus truncatus","Pichiciego"],"facts":["Es el armadillo más pequeño del mundo.","Pasa casi toda la vida bajo la arena.","Tiene una especie de escudo rosado en la espalda."]},{"id":"fragatamagnifica","name":"Fragata magnífica","sci":"Fregata magnificens","where":"Costas de América","titles":["Fregata magnificens","Fragata magnífica"],"facts":["El macho infla una bolsa roja en el cuello como un globo.","Pasa días planeando sobre el mar.","Tiene las alas largas y la cola en forma de tijera."]},{"id":"pezpipa","name":"Pez pipa","sci":"Syngnathus","where":"Mares templados","titles":["Syngnathus","Pez pipa"],"facts":["Es largo y delgado como un palito.","Es pariente del caballito de mar.","El macho cuida los huevos en el cuerpo."]},{"id":"cangrejoazul","name":"Cangrejo azul","sci":"Callinectes sapidus","where":"Costas de América","titles":["Callinectes sapidus","Cangrejo azul"],"facts":["Tiene las patas traseras con forma de remo para nadar.","Sus pinzas son de color azul.","Vive cerca de la desembocadura de los ríos."]},{"id":"lincerojo","name":"Lince rojo","sci":"Lynx rufus","where":"Norteamérica","titles":["Lynx rufus","Lince rojo"],"facts":["Tiene la cola corta, como cortada.","Caza conejos y roedores.","Se adapta a bosques, desiertos y montañas."]},{"id":"alcatrazatlantico","name":"Alcatraz atlántico","sci":"Morus bassanus","where":"Costas del Atlántico norte","titles":["Morus bassanus","Alcatraz atlántico"],"facts":["Se zambulle desde lo alto como una flecha.","Anida en grandes colonias en los acantilados.","Tiene ojos con un borde azul y la cabeza amarilla."]},{"id":"tiburonmartillo","name":"Tiburón martillo","sci":"Sphyrna","where":"Mares templados y tropicales","titles":["Sphyrna","Tiburón martillo"],"facts":["Su cabeza tiene forma de martillo.","Tiene los ojos a los extremos y ve muy bien.","Nada en grandes grupos de día."]},{"id":"cangrejorojodenavidad","name":"Cangrejo rojo de Navidad","sci":"Gecarcoidea natalis","where":"Isla de Navidad","titles":["Gecarcoidea natalis","Cangrejo rojo de la isla de Navidad"],"facts":["Una vez al año millones de cangrejos cruzan la isla hacia el mar.","Tiene un caparazón rojo brillante.","Los veci function chime(kind) {
  if (!S.sounds) return;
  const c = ac(); if (!c) return;
  try { if (c.state === 'suspended') c.resume(); } catch (e) {}
  const notes = kind === 'win' ? [523.25, 659.25, 783.99] : [587.33, 740];
  const now = c.currentTime;

/* ---------- Micrófono y detección de soplido ---------- */
const Mic = {
  state: 'idle', // idle | on | denied | unavailable
  async start() {
    if (this.state === 'on') return true;
    this.err = '';
    // El audio se activa dentro del gesto del usuario (necesario en iPhone/iPad).
    const c0 = ac();
    try { if (c0 && c0.state === 'suspended') c0.resume(); } catch (e0) {}
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { this.state = window.isSecureContext === false ? 'insecure' : 'unavailable'; return false; }
    try {
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      } catch (e1) {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      }
      const c = ac();
      if (!c) { this.state = 'unavailable'; return false; }
      if (c.state === 'suspended') { try { await c.resume(); } catch (e) {} }
      const src = c.createMediaStreamSource(stream);
      const an = c.createAnalyser();
      an.fftSize = 2048; an.smoothingTimeConstant = 0.2;
      src.connect(an);
      this.stream = stream; this.an = an;
      this.td = new Float32Array(an.fftSize);
      this.fd = new Float32Array(an.frequencyBinCount);
      this.binHz = c.sampleRate / an.fftSize;
      this.state = 'on';
      return true;
    } catch (e) {
      const n = (e && e.name) || 'Error';
      this.err = n;
      let perm = '';
      try { perm = (await navigator.permissions.query({ name: 'microphone' })).state; } catch (e2) {}
      let framed = false;
      try { framed = window.self !== window.top; } catch (e3) { framed = true; }
      if (window.isSecureContext === false) this.state = 'insecure';
      else if (n === 'NotReadableError' || n === 'AbortError') this.state = 'busy';
      else if (n === 'NotFoundError' || n === 'DevicesNotFoundError') this.state = 'nomic';
      else if (perm === 'granted' || (perm !== 'denied' && framed)) this.state = 'blocked';
      else if (n === 'NotAllowedError' || n === 'SecurityError' || n === 'PermissionDeniedError') this.state = 'denied';
      else this.state = 'unavailable';
      return false;
    }
  }
};
const MIC_MSG = {
  idle: 'El micrófono aún no está activado.',
  on: 'Micrófono activo.',
  denied: 'El navegador tiene el micrófono bloqueado para esta página. Toca el candado (o los ajustes del sitio) junto a la dirección, permite el micrófono y pulsa «Probar de nuevo».',
  blocked: 'El micrófono tiene permiso, pero la página no puede usarlo desde aquí. Pasa cuando el juego está abierto dentro de otra app o vista previa. Ábrelo directamente en Chrome o Safari.',
  insecure: 'Este navegador solo deja usar el micrófono en direcciones https. Sube el archivo a Netlify Drop o GitHub Pages y ábrelo desde esa dirección.',
  busy: 'Otra aplicación está usando el micrófono. Ciérrala y prueba de nuevo.',
  nomic: 'No se encuentra ningún micrófono en este dispositivo.',
  unavailable: 'Este navegador no permite usar el micrófono aquí.'
};
function micMessage() {
  return MIC_MSG[Mic.state] + (Mic.err && Mic.state !== 'on' ? ' (Detalle técnico: ' + Mic.err + ')' : '');
}
const Det = {
  base: 0.004, level: 0, on: 0, off: 0, blowing: false, thr: 0.01, rms: 0, flat: 0, rec: null,
  update(dt) {
    if (Mic.state !== 'on') { this.blowing = false; this.level = 0; this.rms = 0; return { blowing: false, level: 0, rms: 0, thr: this.thr, flat: 0 }; }
    Mic.an.getFloatTimeDomainData(Mic.td);
    let s = 0; for (let i = 0; i < Mic.td.length; i++) s += Mic.td[i] * Mic.td[i];
    const rms = Math.sqrt(s / Mic.td.length);
    Mic.an.getFloatFrequencyData(Mic.fd);
    const lo = Math.max(1, Math.floor(100 / Mic.binHz)), hi = Math.min(Mic.fd.length - 1, Math.floor(4000 / Mic.binHz));
    let sl = 0, sp = 0, n = 0;
    for (let i = lo; i <= hi; i++) { const p = Math.pow(10, Math.max(Mic.fd[i], -120) / 10); sl += Math.log(p); sp += p; n++; }
    const flat = n ? Math.exp(sl / n) / (sp / n) : 0;
    this.rms = rms; this.flat = flat;
    if (this.rec) this.rec.push([rms, flat]);
    // Umbral: el calibrado con el niño, o uno automático que depende del ruido de la sala.
    const cal = S.cal && S.cal.on ? S.cal : null;
    const thr = cal ? cal.on : Math.max(0.022 - S.sens * 0.002, this.base * (6.5 - S.sens * 0.5));
    this.thr = thr;
    // Ruido de fondo: baja rápido y sube muy despacio, y solo con sonidos claramente por debajo del umbral,
    // para que un soplido suave no lo suba y se vuelva cada vez más difícil de detectar.
    if (rms < this.base) this.base += (rms - this.base) * Math.min(1, dt * 3);
    else if (!this.blowing && rms < thr * 0.6) this.base += (rms - this.base) * Math.min(1, dt * 0.15);

    } else {

      const keep = rms > Math.max(thr * 0.45, this.base * 1.6) && (!S.voiceFilter || flat > flatMin * 0.5);

      if (this.off > 0.45) { this.blowing = false; this.on = 0; }
    }
    const target = clamp(rms / (thr * 2.5), 0, 1);
    this.level += (target - this.level) * Math.min(1, dt * 12);
    return { blowing: this.blowing, level: this.level, rms, thr, flat };
  }
};

/* ---------- Fotos desde Wikipedia (con plan B sin internet) ---------- */
function fetchPhoto(a) {
  if (a._p) return a._p;
  a._p = (async () => {
    for (const t of a.titles) {
      try {
        const r = await fetch('https://es.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(t));
        if (!r.ok) continue;
        const j = await r.json();
        const th = j.thumbnail && j.thumbnail.source;
        if (th) return { thumb: th, big: th.replace(/\/\d+px-/, '/640px-'), page: (j.content_urls && j.content_urls.desktop && j.content_urls.desktop.page) || '' };
      } catch (e) {}
    }
    return null;
  })().then(v => { if (!v) a._p = null; return v; });
  return a._p;
}
function photoInto(wrap, a, useThumb) {
  wrap.append(h('span', { class: 'ph', 'aria-hidden': 'true' }, a.name[0]));
  const go = () => fetchPhoto(a).then(info => {
    if (!info) return;
    const img = h('img', { alt: a.name, loading: 'lazy', referrerpolicy: 'no-referrer' });
    img.addEventListener('load', () => wrap.classList.add('ok'));
    img.addEventListener('error', () => { if (img.src !== info.thumb) img.src = info.thumb; });
    img.src = useThumb ? info.thumb : info.big;
    wrap.append(img);
  });
  if (useThumb && window.IntersectionObserver) {
    const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { io.disconnect(); go(); } }, { rootMargin: '300px' });
    io.observe(wrap);
  } else go();
}

  const mill = h('div', { class: 'mill' }); mill.innerHTML = pinwheel();
  mill.querySelector('.blades').setAttribute('transform', 'rotate(12 100 100)');

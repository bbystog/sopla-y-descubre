<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sopla y Descubre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Diseño: una sola columna calmada. Arriba el camino de 3 pasos (siempre igual),
   en el centro la actividad, abajo el álbum de animales descubiertos. */
:root{
  --ink:#13353d;
  --ink-soft:#4b6a70;
  --mist:#e8f2f0;
  --paper:#ffffff;
  --line:#cfe1de;
  --sea:#1d7f86;
  --sea-deep:#145e64;
  --sun:#f2b84b;
  --leaf:#4f9d69;
  --coral:#e56f56;
  --hint:#dcebf3;
  --hint-ink:#24566f;
  --display:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',ui-rounded,system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--mist);color:var(--ink);
  font-family:var(--body);font-size:18px;line-height:1.5;min-height:100vh;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
h1,h2,h3,p{margin:0}
.app{max-width:760px;margin:0 auto;display:grid;gap:16px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:1.3rem}
.brand .mark{width:30px;height:40px;display:block}
.brand .mark svg{width:100%;height:100%;display:block}
.ghost{display:inline-flex;align-items:center;gap:8px;background:transparent;border:2px solid var(--line);border-radius:14px;padding:6px 14px;min-height:44px;color:var(--ink-soft);font-weight:700}
.ghost svg{width:20px;height:20px}

.trail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;list-style:none;margin:0;padding:0}
.trail li{border-radius:14px;padding:8px 6px;background:var(--paper);border:2px solid var(--line);font-weight:800;font-size:.92rem;text-align:center;color:var(--ink-soft)}
.trail li.on{border-color:var(--sea);color:var(--sea-deep);background:#f2fbfa}
.trail li.done{background:var(--sea);border-color:var(--sea);color:#fff}

.stage{
  background:var(--paper);border:2px solid var(--line);border-radius:28px;
  padding:clamp(18px,4vw,32px);display:grid;gap:18px;justify-items:center;align-content:start;
  text-align:center;min-height:400px;
}
.q-row{display:flex;align-items:center;justify-content:center;gap:12px}
.q{font-family:var(--display);font-weight:600;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.15;text-wrap:balance}
.help{color:var(--ink-soft);font-size:1.05rem;max-width:34rem;text-wrap:balance}
.say{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--mist);color:var(--sea-deep);display:grid;place-items:center}
.say svg{width:24px;height:24px}

.group{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:100%}
.animal{
  position:relative;display:inline-block;border:0;background:transparent;padding:2px 4px;margin:0;
  font-family:var(--emoji);font-size:var(--em,3.2rem);line-height:1.1;border-radius:16px;
}
button.animal:active{background:var(--mist)}
.animal .n{
  position:absolute;right:-2px;bottom:-6px;min-width:1.7rem;height:1.7rem;padding:0 6px;border-radius:999px;
  background:var(--sea);color:#fff;font-family:var(--body);font-weight:800;font-size:1rem;line-height:1;
  display:grid;place-items:center;border:2px solid var(--paper);
}
.animal.leaving{opacity:.3;filter:grayscale(1);outline:2px dashed var(--ink-soft);outline-offset:-3px}

.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%}
.pick{
  background:var(--paper);border:3px solid var(--sea);border-radius:24px;padding:14px 8px;min-height:150px;
  display:grid;gap:8px;align-content:center;justify-items:center;min-width:0;
}
.pick .cnt{font-family:var(--display);font-size:2.2rem;font-weight:600;color:var(--sea-deep);min-height:2.6rem}
.pick.is-hint{background:var(--hint);border-color:#a9c9da}
.pick.guide{border-color:var(--sun);background:#fff7e3;border-width:5px}

.eq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px;width:100%}
.eq .box{border:2px dashed var(--line);border-radius:22px;padding:10px 8px;max-width:100%}
.eq .op{font-family:var(--display);font-size:2.8rem;font-weight:600;color:var(--sea-deep);line-height:1}
.eq .res{font-family:var(--display);font-size:3rem;font-weight:600;color:var(--sea-deep);line-height:1;min-width:2.2rem}

.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:480px}
.choice{
  min-height:88px;border-radius:24px;border:3px solid var(--sea);background:var(--paper);color:var(--sea-deep);
  font-family:var(--display);font-size:2.7rem;font-weight:600;line-height:1;
}
.choice:active{background:#f2fbfa}
.choice.is-hint{background:var(--hint);border-color:#a9c9da;color:var(--hint-ink)}
.choice.guide{border-color:var(--sun);background:#fff7e3;border-width:5px}
.choice.right{background:var(--leaf);border-color:var(--leaf);color:#fff}
.locked .choices,.locked .pair,.locked .animal{pointer-events:none}

.fb{min-height:2.6rem;font-weight:800;font-size:1.2rem;border-radius:14px;padding:6px 16px;max-width:100%}
.fb:empty{padding:0}
.fb.good{color:#1d5f38;background:#e3f4e8}
.fb.hint{color:var(--hint-ink);background:var(--hint)}
.next{min-height:70px;display:grid;place-items:center}

.go{
  background:var(--sea);color:#fff;border:0;border-radius:20px;min-height:64px;padding:12px 34px;
  font-family:var(--display);font-size:1.5rem;font-weight:600;box-shadow:0 4px 0 var(--sea-deep);
}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 var(--sea-deep)}
.soft{background:var(--paper);color:var(--sea-deep);border:2px solid var(--sea);border-radius:16px;min-height:52px;padding:8px 20px;font-weight:800}

.mill{width:min(60vw,250px)}
.mill svg{width:100%;height:auto;display:block}
.meter{width:min(100%,420px);height:22px;border-radius:999px;background:var(--mist);border:2px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--sun);border-radius:999px}
.airwrap{position:relative;width:min(100%,360px)}
.airwrap .meter{height:12px;width:100%}
.airwrap::after{content:"";position:absolute;left:40%;top:-3px;bottom:-3px;width:3px;border-radius:2px;background:var(--sea-deep);opacity:.5}
.air-label{font-size:.85rem;color:var(--ink-soft);font-weight:700}
.blow-status{font-weight:800;color:var(--sea-deep);min-height:1.7rem}
.hold{
  background:var(--mist);border:2px dashed var(--line);border-radius:16px;padding:10px 18px;min-height:52px;
  color:var(--ink-soft);font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none;
}
.hold.down{background:var(--hint);border-color:#a9c9da}

.start-title{font-family:var(--display);font-weight:600;font-size:clamp(2.2rem,8vw,3.2rem);line-height:1.05}
.note{max-width:34rem;text-align:left;font-size:.95rem;color:var(--ink-soft);background:var(--mist);border-radius:18px;padding:12px 16px}
.note b{color:var(--ink)}

.album{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:18px;display:grid;gap:14px}
.album-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.album-head h2{font-family:var(--display);font-weight:600;font-size:1.35rem}
.album-head span{color:var(--ink-soft);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.tile{
  border:2px solid var(--line);border-radius:18px;background:var(--mist);padding:8px 4px;
  display:grid;gap:4px;justify-items:center;align-content:start;min-width:0;font-weight:800;font-size:.82rem;line-height:1.2;text-align:center;
}
button.tile:active{background:var(--hint)}
.tile .th{width:64px;height:64px;border-radius:50%;overflow:hidden;position:relative;background:var(--hint);display:grid;place-items:center}
.tile.locked-tile{color:var(--ink-soft);border-style:dashed;background:transparent}
.tile.locked-tile .th{background:var(--mist);font-family:var(--display);font-size:2rem;color:var(--line)}
.tile .nm{overflow-wrap:anywhere}

.photo{position:relative;width:100%;aspect-ratio:4/3;border-radius:22px;overflow:hidden;background:var(--hint);display:grid;place-items:center}
.photo .ph{font-family:var(--display);font-size:5rem;color:#a9c9da}
.photo img,.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.photo.ok img,.th.ok img{opacity:1}
.photo.ok .ph,.th.ok .ph{display:none}
.th .ph{font-family:var(--display);font-size:1.8rem;color:#a9c9da}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(19,53,61,.6);overflow:auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));display:grid;justify-items:center;align-items:start}
.sheet-card{width:min(100%,560px);background:var(--paper);border-radius:28px;padding:clamp(16px,4vw,26px);display:grid;gap:14px;margin-block:auto;animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.kicker{font-weight:800;color:var(--sea-deep);letter-spacing:.06em;text-transform:uppercase;font-size:.85rem}
.card-name{font-family:var(--display);font-weight:600;font-size:clamp(2.2rem,8vw,3rem);line-height:1.05}
.sci{font-style:italic;color:var(--ink-soft)}
.where{display:inline-flex;gap:8px;align-items:center;background:var(--mist);border-radius:999px;padding:6px 14px;font-weight:800;width:fit-content}
.card-sub{font-family:var(--display);font-weight:500;font-size:1.3rem}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.facts li{position:relative;padding:12px 14px 12px 44px;border-radius:16px;background:var(--mist);font-size:1.18rem;line-height:1.4}
.facts li::before{content:"";position:absolute;left:17px;top:1.05em;width:13px;height:13px;border-radius:50%;background:var(--sun)}
.credit{font-size:.82rem;color:var(--ink-soft)}
.credit a{color:var(--sea-deep)}
.row-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.set-title{font-family:var(--display);font-weight:600;font-size:1.6rem}
.set-group{display:grid;gap:4px}
.set-group>h3{font-family:var(--display);font-weight:500;font-size:1.1rem;color:var(--sea-deep);margin-top:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row label,.row .lbl{font-weight:700}
.row small{display:block;color:var(--ink-soft);font-weight:400;font-size:.88rem;line-height:1.3}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:8px 14px;min-height:44px;font-weight:800;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--sea);color:#fff}
input[type=range]{width:min(100%,220px);accent-color:var(--sea);height:32px}
input[type=checkbox][role=switch]{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;border:0;margin:0;transition:background .2s}
input[type=checkbox][role=switch]::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
input[type=checkbox][role=switch]:checked{background:var(--sea)}
input[type=checkbox][role=switch]:checked::after{transform:translateX(22px)}
.chip{display:inline-block;border-radius:999px;padding:2px 12px;background:var(--mist);font-weight:800;color:var(--ink-soft);min-width:5.5rem;text-align:center}
.chip.on{background:#e3f4e8;color:#1d5f38}
.danger{background:var(--paper);border:2px solid var(--coral);color:#a43d27;border-radius:14px;padding:8px 16px;min-height:44px;font-weight:800}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
body.calm *,body.calm *::before,body.calm *::after{animation:none!important;transition:none!important}
@media (max-width:420px){
  body{font-size:17px}
  .choice{font-size:2.3rem;min-height:80px}
  .pick{padding:10px 4px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="mark" id="brandMark" aria-hidden="true"></span><span>Sopla y Descubre</span></div>
    <button class="ghost" id="openSettings" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.4"/><circle cx="9" cy="17" r="2.4"/></svg>
      Ajustes
    </button>
  </header>
  <ol class="trail" id="trail" hidden aria-label="Pasos">
    <li>Actividad 1</li>
    <li>Actividad 2</li>
    <li>Soplar</li>
  </ol>
  <main class="stage" id="stage"></main>
  <section class="album" id="album" aria-labelledby="albumH"></section>
</div>
<noscript>Este juego necesita JavaScript.</noscript>

<script>
(() => {
'use strict';

/* ---------- Datos: animales raros ---------- */
const ANIMALS = [{"id":"ajolote","name":"Ajolote","sci":"Ambystoma mexicanum","where":"Lagos de México","titles":["Ambystoma mexicanum","Ajolote"],"facts":["Es un anfibio y casi siempre vive dentro del agua.","Si pierde una pata, le vuelve a crecer una nueva.","Conserva sus branquias de bebé: parecen plumas rosas a los lados de la cabeza."]},{"id":"ornitorrinco","name":"Ornitorrinco","sci":"Ornithorhynchus anatinus","where":"Ríos de Australia","titles":["Ornithorhynchus anatinus","Ornitorrinco"],"facts":["Es un mamífero, pero pone huevos.","Con su pico de pato detecta la electricidad de sus presas bajo el agua.","El macho tiene un espolón con veneno en cada pata trasera."]},{"id":"pangolin","name":"Pangolín","sci":"Familia Manidae","where":"África y Asia","titles":["Pangolín","Manidae"],"facts":["Es el único mamífero cubierto de escamas.","Cuando tiene miedo se enrolla como una pelota.","No tiene dientes: come hormigas y termitas con su lengua larguísima."]},{"id":"okapi","name":"Okapi","sci":"Okapia johnstoni","where":"Selva del Congo","titles":["Okapia johnstoni","Okapi"],"facts":["Parece una mezcla de cebra y jirafa, pero es pariente de la jirafa.","Su lengua mide más de 30 centímetros y con ella se limpia hasta las orejas.","Es muy tímido y se esconde en la selva."]},{"id":"narval","name":"Narval","sci":"Monodon monoceros","where":"Mares fríos del Ártico","titles":["Monodon monoceros","Narval"],"facts":["Vive en el mar helado del Ártico.","Su colmillo largo y en espiral es en realidad un diente.","Puede medir hasta 3 metros, por eso lo llaman el unicornio del mar."]},{"id":"quokka","name":"Quokka","sci":"Setonix brachyurus","where":"Australia occidental","titles":["Setonix brachyurus","Quokka"],"facts":["Parece que siempre sonríe, por eso es famoso.","Es un marsupial: su bebé crece en una bolsa de la mamá.","Vive sobre todo en la isla Rottnest, en Australia."]},{"id":"pezluna","name":"Pez luna","sci":"Mola mola","where":"Mares templados y tropicales","titles":["Mola mola","Pez luna"],"facts":["Es el pez óseo más pesado del mundo: puede pesar más de dos toneladas.","Parece una cabeza gigante con aletas.","Le gusta tumbarse de lado cerca de la superficie para calentarse al sol, y come medusas."]},{"id":"perezoso","name":"Perezoso","sci":"Bradypus variegatus","where":"Selvas de América","titles":["Bradypus variegatus","Perezoso"],"facts":["Se mueve tan despacio que a su pelo le crecen algas verdes.","Pasa casi toda la vida colgado de los árboles.","Aunque parezca torpe, nada muy bien."]},{"id":"tapir","name":"Tapir","sci":"Tapirus terrestris","where":"Selvas de Sudamérica","titles":["Tapirus terrestris","Tapir"],"facts":["Su nariz es una trompa corta con la que agarra hojas y ramitas.","Las crías tienen rayas y manchas, como una sandía con patas.","Le encanta el agua y se zambulle para escapar del peligro."]},{"id":"piquero","name":"Piquero de patas azules","sci":"Sula nebouxii","where":"Costas del Pacífico de América","titles":["Sula nebouxii","Piquero patiazul"],"facts":["Sus patas son de un azul muy brillante.","El macho las levanta y baila para presumir ante la hembra.","Pesca lanzándose al mar en picado desde el aire."]},{"id":"ayeaye","name":"Aye-aye","sci":"Daubentonia madagascariensis","where":"Madagascar","titles":["Daubentonia madagascariensis","Aye-aye"],"facts":["Sale de noche y vive en los árboles de Madagascar.","Tiene un dedo larguísimo y fino para sacar bichitos de los troncos.","Golpea la madera y escucha con sus orejas enormes para encontrar larvas."]},{"id":"kakapo","name":"Kakapo","sci":"Strigops habroptilus","where":"Bosques de Nueva Zelanda","titles":["Strigops habroptilus","Kakapo"],"facts":["Es un loro que no puede volar.","Es el loro más pesado del mundo y sale de noche.","Quedan muy pocos, así que mucha gente lo cuida en Nueva Zelanda."]},{"id":"saiga","name":"Saiga","sci":"Saiga tatarica","where":"Estepas de Asia central","titles":["Saiga tatarica","Saiga"],"facts":["Es un antílope que corre en grandes grupos.","Su nariz grande y blanda calienta el aire frío antes de que llegue a sus pulmones.","Esa nariz también filtra el polvo del camino."]},{"id":"tarsero","name":"Tarsero","sci":"Familia Tarsiidae","where":"Selvas del sudeste de Asia","titles":["Tarsiidae","Tarsero"],"facts":["Es un primate diminuto que cabe en la palma de una mano.","Cada uno de sus ojos es más grande que su cerebro.","Puede girar la cabeza casi hasta atrás, porque sus ojos no se mueven."]},{"id":"dragonmarino","name":"Dragón marino foliáceo","sci":"Phycodurus eques","where":"Costas del sur de Australia","titles":["Phycodurus eques","Dragón marino foliáceo"],"facts":["Parece un trozo de alga flotando, así se esconde.","Es pariente del caballito de mar.","El papá lleva los huevitos pegados a su cola."]},{"id":"pezgota","name":"Pez gota","sci":"Psychrolutes marcidus","where":"Fondo del mar, cerca de Australia","titles":["Psychrolutes marcidus","Pez gota"],"facts":["Vive en el fondo del mar, muy profundo.","Su cuerpo es blando como una gelatina.","Fuera del agua se aplasta y su cara parece triste, pero en el mar es normal."]},{"id":"numbat","name":"Numbat","sci":"Myrmecobius fasciatus","where":"Bosques del suroeste de Australia","titles":["Myrmecobius fasciatus","Numbat"],"facts":["Tiene rayas claras en el lomo y una cola peluda.","Come casi solo termitas, miles cada día.","Es un marsupial que sale de día, algo raro en su familia."]},{"id":"fosa","name":"Fosa","sci":"Cryptoprocta ferox","where":"Madagascar","titles":["Cryptoprocta ferox","Fosa"],"facts":["Es el mayor carnívoro de Madagascar.","Parece un gato, pero es pariente de las mangostas.","Trepa genial: sus tobillos giran y puede bajar de los árboles de cabeza."]},{"id":"kiwi","name":"Kiwi","sci":"Apteryx","where":"Bosques de Nueva Zelanda","titles":["Apteryx","Kiwi (ave)"],"facts":["Es un ave que no puede volar y sale de noche.","Tiene los agujeros de la nariz en la punta del pico, para oler la comida bajo tierra.","Pone un huevo enorme comparado con su tamaño."]},{"id":"ranacristal","name":"Rana de cristal","sci":"Familia Centrolenidae","where":"Selvas de América Central y del Sur","titles":["Centrolenidae","Rana de cristal"],"facts":["Su barriga es transparente: se le ven el corazón y las tripas.","Es pequeñita y verde, y vive entre las hojas.","En muchas especies, el papá vigila los huevos."]},{"id":"narigudo","name":"Mono narigudo","sci":"Nasalis larvatus","where":"Selvas de la isla de Borneo","titles":["Nasalis larvatus","Mono narigudo"],"facts":["El macho tiene una nariz enorme que cuelga sobre la boca.","Es muy buen nadador y cruza ríos.","Tiene una barriga grande porque come muchas hojas."]},{"id":"dumbo","name":"Pulpo Dumbo","sci":"Grimpoteuthis","where":"Fondo del océano, muy profundo","titles":["Grimpoteuthis","Pulpo dumbo"],"facts":["Tiene dos aletas en la cabeza que parecen las orejas del elefante Dumbo.","Vive en el fondo del mar, donde no llega la luz.","Nada moviendo esas aletas como si volara."]},{"id":"colugo","name":"Colugo","sci":"Orden Dermoptera","where":"Selvas del sudeste de Asia","titles":["Dermoptera","Colugo"],"facts":["A veces lo llaman lémur volador, pero ni es lémur ni vuela.","Planea de árbol en árbol con una piel que une sus patas.","Puede recorrer muchos metros planeando de un solo salto."]},{"id":"lori","name":"Loris perezoso","sci":"Nycticebus","where":"Selvas del sur de Asia","titles":["Nycticebus","Loris perezoso"],"facts":["Tiene unos ojos enormes para ver de noche.","Se mueve despacio y sin hacer ruido.","Es de los pocos mamíferos con mordedura venenosa."]},{"id":"secretario","name":"Ave secretario","sci":"Sagittarius serpentarius","where":"Sabanas de África","titles":["Sagittarius serpentarius","Ave secretario"],"facts":["Tiene patas larguísimas y plumas en la cabeza.","Caza serpientes pisándolas con fuerza.","Camina muchos kilómetros al día por la sabana."]},{"id":"gavial","name":"Gavial","sci":"Gavialis gangeticus","where":"Ríos del norte de la India y Nepal","titles":["Gavialis gangeticus","Gavial"],"facts":["Es un cocodrilo con el hocico larguísimo y finito.","Con ese hocico atrapa peces rápidos en el agua.","El macho tiene un bulto en la punta de la nariz que usa para hacer zumbidos."]},{"id":"hormiguero","name":"Oso hormiguero gigante","sci":"Myrmecophaga tridactyla","where":"Sabanas y selvas de Sudamérica","titles":["Myrmecophaga tridactyla","Oso hormiguero gigante"],"facts":["No tiene dientes y come hormigas y termitas con su lengua larguísima.","Su cola es tan peluda que la usa como manta para dormir.","La cría viaja subida a la espalda de su mamá."]},{"id":"mantis","name":"Mantis orquídea","sci":"Hymenopus coronatus","where":"Selvas del sudeste de Asia","titles":["Hymenopus coronatus","Mantis orquídea"],"facts":["Parece una flor rosa y blanca.","Se queda quieta entre las flores para que los insectos se acerquen.","Va cambiando de piel a medida que crece."]},{"id":"hercules","name":"Escarabajo Hércules","sci":"Dynastes hercules","where":"Selvas de América Central y del Sur","titles":["Dynastes hercules","Escarabajo Hércules"],"facts":["Es uno de los escarabajos más grandes del mundo.","El macho tiene un cuerno largo con forma de pinza.","Puede cargar un peso muchísimo mayor que el suyo."]},{"id":"rape","name":"Pez rape abisal","sci":"Orden Lophiiformes","where":"Océanos profundos","titles":["Lophiiformes","Pez rape"],"facts":["Lleva una lucecita colgando delante de la boca, como una linterna.","Vive en la oscuridad del fondo del mar.","La luz atrae a otros peces, que se acercan a su boca."]},{"id":"lira","name":"Ave lira","sci":"Menura","where":"Bosques de Australia","titles":["Menura","Ave lira"],"facts":["La cola del macho tiene forma de lira, un instrumento de música.","Imita sonidos que oye, como el canto de otros pájaros.","El macho canta y baila para presumir."]},{"id":"matamata","name":"Tortuga mata mata","sci":"Chelus fimbriata","where":"Ríos del Amazonas y el Orinoco","titles":["Chelus fimbriata","Mata mata"],"facts":["Parece una hoja seca o un trozo de madera.","Se queda quieta en el agua y abre la boca de golpe para atrapar peces.","Tiene el cuello largo y la cabeza plana y triangular."]},{"id":"hipopigmeo","name":"Hipopótamo pigmeo","sci":"Choeropsis liberiensis","where":"Bosques de África occidental","titles":["Choeropsis liberiensis","Hipopótamo pigmeo"],"facts":["Es mucho más pequeño que el hipopótamo común.","Vive en bosques húmedos y pasa mucho tiempo cerca del agua.","Su piel suelta un líquido rosado que la protege del sol."]},{"id":"komodo","name":"Dragón de Komodo","sci":"Varanus komodoensis","where":"Islas de Indonesia","titles":["Varanus komodoensis","Dragón de Komodo"],"facts":["Es el lagarto más grande del mundo.","Huele con la lengua, que tiene dos puntas.","Solo vive en unas pocas islas de Indonesia."]},{"id":"jerbo","name":"Jerbo","sci":"Familia Dipodidae","where":"Desiertos de África y Asia","titles":["Dipodidae","Jerbo"],"facts":["Salta como un canguro pequeñito con sus patas traseras largas.","Tiene las orejas grandes y una cola larguísima.","Sale de noche, cuando hace menos calor."]},{"id":"fenec","name":"Fénec","sci":"Vulpes zerda","where":"Desierto del Sáhara","titles":["Vulpes zerda","Fénec"],"facts":["Es el zorro más pequeño del mundo.","Sus orejas enormes oyen muy bien y le ayudan a soltar calor.","Vive en cuevas que excava en la arena."]},{"id":"nautilus","name":"Nautilus","sci":"Nautilus pompilius","where":"Mares cálidos del Pacífico","titles":["Nautilus pompilius","Nautilus"],"facts":["Tiene una concha en espiral con muchas habitaciones.","Casi no ha cambiado desde hace millones de años.","Se mueve lanzando chorros de agua."]},{"id":"salamandra","name":"Salamandra gigante china","sci":"Andrias davidianus","where":"Ríos de China","titles":["Andrias davidianus","Salamandra gigante china"],"facts":["Es el anfibio más grande del mundo.","Tiene la piel arrugada y ve muy poco.","Pasa toda la vida en ríos de agua fresca."]},{"id":"barrileye","name":"Pez barrileye","sci":"Macropinna microstoma","where":"Aguas profundas del Pacífico norte","titles":["Macropinna microstoma","Pez barrileye"],"facts":["Su cabeza es transparente como una burbuja.","Sus ojos verdes están dentro de la cabeza y miran hacia arriba.","Vive muy hondo, donde casi no llega la luz."]},{"id":"binturong","name":"Binturong","sci":"Arctictis binturong","where":"Selvas del sudeste de Asia","titles":["Arctictis binturong","Binturong"],"facts":["Huele a palomitas de maíz.","Su cola agarra las ramas como si fuera una mano.","Vive en los árboles y sale sobre todo de noche."]},{"id":"picozapato","name":"Picozapato","sci":"Balaeniceps rex","where":"Pantanos de África","titles":["Balaeniceps rex","Picozapato"],"facts":["Su pico enorme parece un zapato de madera.","Puede quedarse quieto muchísimo tiempo esperando a un pez.","Para saludar golpea el pico y suena como una matraca."]},{"id":"tardigrado","name":"Tardígrado","sci":"Phylum Tardigrada","where":"Casi cualquier lugar, hasta en el musgo","titles":["Tardigrada","Tardígrado"],"facts":["Mide menos de un milímetro y tiene ocho patitas.","Puede quedarse dormido sin agua durante años y despertarse.","Incluso ha sobrevivido en el espacio en un experimento."]},{"id":"gerenuc","name":"Gerenuc","sci":"Litocranius walleri","where":"Sabanas del este de África","titles":["Litocranius walleri","Gerenuc"],"facts":["Es una gacela de cuello larguísimo, por eso la llaman gacela jirafa.","Se pone de pie sobre las patas traseras para comer hojas altas.","Casi no necesita beber: le basta con lo que come."]},{"id":"sifaka","name":"Sifaka","sci":"Propithecus","where":"Madagascar","titles":["Propithecus","Sifaka"],"facts":["Es un lémur que salta de árbol en árbol.","En el suelo avanza dando saltitos de lado, como si bailara.","Vive solo en la isla de Madagascar."]},{"id":"calamarvampiro","name":"Calamar vampiro","sci":"Vampyroteuthis infernalis","where":"Mares muy profundos","titles":["Vampyroteuthis infernalis","Calamar vampiro"],"facts":["Vive muy hondo, donde casi no hay luz ni oxígeno.","Si se asusta, suelta una nube de moco que brilla en la oscuridad.","Aunque se llame vampiro, se alimenta de restos pequeños que caen desde arriba."]},{"id":"quetzal","name":"Quetzal","sci":"Pharomachrus mocinno","where":"Bosques de Centroamérica","titles":["Pharomachrus mocinno","Quetzal"],"facts":["Es un ave de plumas verdes que brillan.","El macho tiene unas plumas larguísimas en la cola.","Los mayas y los aztecas lo consideraban un ave sagrada."]},{"id":"nudibranquio","name":"Nudibranquio","sci":"Orden Nudibranchia","where":"Mares de todo el mundo","titles":["Nudibranchia","Nudibranquio"],"facts":["Es una babosa de mar de colores muy vivos.","No tiene concha para protegerse.","Algunos guardan el veneno de lo que comen para defenderse."]},{"id":"paraiso","name":"Ave del paraíso","sci":"Familia Paradisaeidae","where":"Nueva Guinea y Australia","titles":["Paradisaeidae","Ave del paraíso"],"facts":["Los machos tienen plumas de colores increíbles.","Hacen bailes muy raros para impresionar a las hembras.","Casi todas viven en la isla de Nueva Guinea."]},{"id":"dragonazul","name":"Dragón azul","sci":"Glaucus atlanticus","where":"Océanos cálidos","titles":["Glaucus atlanticus","Dragón azul"],"facts":["Es una babosa de mar de unos tres centímetros.","Flota boca arriba en la superficie del agua.","Come medusas venenosas y guarda su veneno para defenderse."]},{"id":"ratatopo","name":"Rata topo desnuda","sci":"Heterocephalus glaber","where":"Subsuelo de África oriental","titles":["Heterocephalus glaber","Rata topo desnuda"],"facts":["Vive bajo tierra, en grupos con una reina, como las abejas.","Casi no tiene pelo y sus dientes salen por fuera de los labios para excavar.","Vive muchos años para ser un animal tan pequeño."]},{"id":"ballenaazul","name":"Ballena azul","sci":"Balaenoptera musculus","where":"Todos los océanos","titles":["Balaenoptera musculus","Ballena azul"],"facts":["La ballena azul es el animal más grande que ha existido.","Vive en los océanos y come animalitos diminutos llamados krill."]},{"id":"linceiberico","name":"Lince ibérico","sci":"Lynx pardinus","where":"España y Portugal","titles":["Lynx pardinus","Lince ibérico"],"facts":["El lince ibérico es un gato salvaje con pinceles en las orejas y una pequeña barba.","Vive solo en España y Portugal y come sobre todo conejos."]},{"id":"ibissagrado","name":"Ibis sagrado","sci":"Threskiornis aethiopicus","where":"África","titles":["Threskiornis aethiopicus","Ibis sagrado"],"facts":["El ibis sagrado es un ave blanca de cuello y cabeza negros, con un pico largo y curvado.","Los antiguos egipcios lo respetaban mucho y lo representaban en sus dibujos."]},{"id":"topoeuropeo","name":"Topo europeo","sci":"Talpa europaea","where":"Europa y Asia","titles":["Talpa europaea","Topo europeo"],"facts":["El topo europeo pasa casi toda la vida bajo tierra.","Con sus patas delanteras, anchas como palas, excava largos túneles en busca de lombrices."]},{"id":"tiburonballena","name":"Tiburón ballena","sci":"Rhincodon typus","where":"Mares cálidos","titles":["Rhincodon typus","Tiburón ballena"],"facts":["El tiburón ballena es el pez más grande del mundo.","A pesar de su tamaño, solo come plancton, es decir, animalitos y algas diminutos."]},{"id":"osonegroamericano","name":"Oso negro americano","sci":"Ursus americanus","where":"Bosques de Norteamérica","titles":["Ursus americanus","Oso negro americano"],"facts":["El oso negro americano trepa a los árboles con facilidad y come de todo: frutas, raíces, pescado y miel.","En invierno duerme en una cueva."]},{"id":"caballo","name":"Caballo","sci":"Equus ferus caballus","where":"Todo el mundo","titles":["Equus caballus","Caballo"],"facts":["El caballo ha acompañado a las personas durante miles de años.","Es rápido, fuerte e inteligente, y se comunica con relinchos y con el cuerpo."]},{"id":"mariquitadesietepuntos","name":"Mariquita de siete puntos","sci":"Coccinella septempunctata","where":"Europa, Asia y norte de África","titles":["Coccinella septempunctata","Mariquita de siete puntos","Mariquita"],"facts":["La mariquita es un escarabajo pequeño, rojo con puntos negros.","Se alimenta de pulgones, así que ayuda a cuidar las plantas."]},{"id":"guepardo","name":"Guepardo","sci":"Acinonyx jubatus","where":"Sabanas de África","titles":["Acinonyx jubatus","Guepardo"],"facts":["El guepardo es el animal terrestre más rápido del mundo.","En carreras cortas llega a cien kilómetros por hora, aunque se cansa pronto."]},{"id":"osopolar","name":"Oso polar","sci":"Ursus maritimus","where":"El Ártico","titles":["Ursus maritimus","Oso polar"],"facts":["El oso polar vive cerca del Polo Norte.","Su pelo parece blanco, pero debajo tiene la piel negra, que le ayuda a guardar el calor."]},{"id":"osopardo","name":"Oso pardo","sci":"Ursus arctos","where":"Montañas y bosques de Europa","titles":["Ursus arctos","Oso pardo"],"facts":["El oso pardo es uno de los animales salvajes más grandes de España.","Come frutos, raíces y miel, y pasa parte del invierno durmiendo en una cueva."]},{"id":"cocodrilodelnilo","name":"Cocodrilo del Nilo","sci":"Crocodylus niloticus","where":"Ríos y lagos de África","titles":["Crocodylus niloticus","Cocodrilo del Nilo"],"facts":["El cocodrilo del Nilo puede pasar horas casi sin moverse, esperando una presa.","Las mamás cuidan sus huevos y llevan a las crías al agua con la boca."]},{"id":"tiburonblanco","name":"Tiburón blanco","sci":"Carcharodon carcharias","where":"Mares templados y cálidos","titles":["Carcharodon carcharias","Tiburón blanco"],"facts":["El tiburón blanco tiene muchas filas de dientes.","Cuando pierde uno, otro nuevo ocupa su lugar, así que nunca se queda sin dientes."]},{"id":"bisonteamericano","name":"Bisonte americano","sci":"Bison bison","where":"Praderas de Norteamérica","titles":["Bison bison","Bisonte americano"],"facts":["El bisonte americano es el mamífero terrestre más grande de Norteamérica.","Estuvo a punto de desaparecer, pero hoy se protege en parques."]},{"id":"burro","name":"Burro","sci":"Equus africanus asinus","where":"Todo el mundo","titles":["Equus africanus asinus","Burro"],"facts":["El burro es un animal resistente y tranquilo.","Puede cargar peso durante horas y recorrer caminos difíciles sin quejarse."]},{"id":"hormigacortadoradehojas","name":"Hormiga cortadora de hojas","sci":"Atta cephalotes","where":"Selvas de América","titles":["Atta cephalotes","Hormiga cortadora de hojas"],"facts":["La hormiga cortadora de hojas lleva trocitos de hoja al hormiguero.","Con ellos cultiva un hongo, que es su comida."]},{"id":"leopardo","name":"Leopardo","sci":"Panthera pardus","where":"África y Asia","titles":["Panthera pardus","Leopardo"],"facts":["El leopardo trepa a los árboles llevando a su presa para que otros animales no se la quiten.","Tiene el pelaje cubierto de manchas en forma de rosetas."]},{"id":"pinguinoemperador","name":"Pingüino emperador","sci":"Aptenodytes forsteri","where":"La Antártida","titles":["Aptenodytes forsteri","Pingüino emperador"],"facts":["El pingüino emperador es el más grande de todos los pingüinos.","El papá cuida el huevo sobre sus patas para que no se enfríe."]},{"id":"ciguenablanca","name":"Cigüeña blanca","sci":"Ciconia ciconia","where":"Europa y África","titles":["Ciconia ciconia","Cigüeña blanca"],"facts":["La cigüeña blanca construye enormes nidos en torres y tejados.","Muchas viajan a África cuando llega el frío y vuelven en primavera."]},{"id":"cobraegipcia","name":"Cobra egipcia","sci":"Naja haje","where":"África","titles":["Naja haje","Cobra egipcia"],"facts":["La cobra egipcia levanta el cuerpo y abre su capucha cuando se siente amenazada.","Su veneno es muy fuerte, así que es mejor mantenerse lejos."]},{"id":"armadillodenuevebandas","name":"Armadillo de nueve bandas","sci":"Dasypus novemcinctus","where":"América","titles":["Dasypus novemcinctus","Armadillo de nueve bandas"],"facts":["El armadillo tiene una coraza de placas duras que lo protege.","Excava con sus garras para buscar insectos y gusanos."]},{"id":"mantarayagigante","name":"Manta raya gigante","sci":"Mobula birostris","where":"Mares tropicales y templados","titles":["Mobula birostris","Manta raya gigante","Manta raya"],"facts":["La manta raya gigante parece que vuela bajo el agua moviendo sus enormes aletas.","Con las alas abiertas puede medir siete metros."]},{"id":"puma","name":"Puma","sci":"Puma concolor","where":"América","titles":["Puma concolor","Puma"],"facts":["El puma es un gran felino que vive desde Canadá hasta la Patagonia.","Salta muy alto y no ruge, pero ronronea y maúlla."]},{"id":"vaca","name":"Vaca","sci":"Bos taurus","where":"Todo el mundo","titles":["Bos taurus","Vaca"],"facts":["La vaca pasa muchas horas pastando y rumiando.","Tiene cuatro cámaras en el estómago para digerir bien la hierba."]},{"id":"termita","name":"Termita","sci":"Isoptera","where":"Zonas cálidas del mundo","titles":["Isoptera","Termita"],"facts":["Las termitas construyen enormes termiteros con túneles y cámaras.","En ellos viven millones de individuos, cada uno con su trabajo."]},{"id":"leopardodelasnieves","name":"Leopardo de las nieves","sci":"Panthera uncia","where":"Montañas de Asia central","titles":["Panthera uncia","Leopardo de las nieves"],"facts":["El leopardo de las nieves vive en altas montañas de Asia.","Tiene una cola larga y gruesa con la que se abriga el cuerpo cuando duerme."]},{"id":"saola","name":"Saola","sci":"Pseudoryx nghetinhensis","where":"Montañas de Vietnam y Laos","titles":["Pseudoryx nghetinhensis","Saola"],"facts":["El saola es un animal tan raro que se descubrió en mil novecientos noventa y dos.","Casi nadie lo ha visto en libertad, y lo llaman el unicornio de Asia."]},{"id":"elefanteafricano","name":"Elefante africano","sci":"Loxodonta africana","where":"Sabanas de África","titles":["Loxodonta africana","Elefante africano"],"facts":["El elefante africano es el animal terrestre más grande.","Usa su trompa para beber, oler y saludar a otros elefantes."]},{"id":"cabramontes","name":"Cabra montés","sci":"Capra pyrenaica","where":"Montañas de España","titles":["Capra pyrenaica","Cabra montés"],"facts":["La cabra montés trepa por las rocas con una agilidad asombrosa.","Los machos tienen cuernos largos y curvados que les crecen toda la vida."]},{"id":"mangostaegipcia","name":"Mangosta egipcia","sci":"Herpestes ichneumon","where":"África y sur de Europa","titles":["Herpestes ichneumon","Mangosta egipcia"],"facts":["La mangosta egipcia es rápida y valiente.","Puede cazar serpientes, ratones y huevos de aves, y los antiguos egipcios la apreciaban por eso."]},{"id":"pangolinterrestre","name":"Pangolín terrestre","sci":"Smutsia temminckii","where":"África","titles":["Smutsia temminckii","Pangolín terrestre"],"facts":["El pangolín está cubierto de escamas duras, del mismo material que nuestras uñas.","Cuando se asusta, se enrolla como una bola."]},{"id":"coyote","name":"Coyote","sci":"Canis latrans","where":"Norteamérica y Centroamérica","titles":["Canis latrans","Coyote"],"facts":["El coyote es un animal muy adaptable y listo.","Aúlla al atardecer y vive en desiertos, praderas, bosques e incluso ciudades."]},{"id":"oveja","name":"Oveja","sci":"Ovis aries","where":"Todo el mundo","titles":["Ovis aries","Oveja doméstica","Oveja"],"facts":["La oveja vive en rebaño y reconoce las caras de otras ovejas y de personas.","Su lana se esquila una vez al año."]},{"id":"libelulaemperador","name":"Libélula emperador","sci":"Anax imperator","where":"Europa, Asia y África","titles":["Anax imperator","Libélula emperador","Libélula"],"facts":["La libélula emperador vuela muy deprisa y puede frenar en el aire.","Sus ojos enormes ven casi en todas las direcciones."]},{"id":"tigresiberiano","name":"Tigre siberiano","sci":"Panthera tigris altaica","where":"Bosques fríos del este de Rusia","titles":["Panthera tigris altaica","Tigre siberiano"],"facts":["El tigre siberiano es el felino más grande del mundo.","Tiene un pelaje espeso que lo protege del frío intenso de su hogar."]},{"id":"takin","name":"Takín","sci":"Budorcas taxicolor","where":"Montañas del Himalaya","titles":["Budorcas taxicolor","Takín"],"facts":["El takín parece una mezcla de cabra y vaca.","Vive en las montañas del Himalaya y tiene una capa de pelo espeso, a veces dorado."]},{"id":"cangurorojo","name":"Canguro rojo","sci":"Osphranter rufus","where":"Australia","titles":["Osphranter rufus","Canguro rojo"],"facts":["El canguro rojo es el marsupial más grande del mundo.","Se mueve a saltos y sus crías crecen en una bolsa de su mamá."]},{"id":"delfinmular","name":"Delfín mular","sci":"Tursiops truncatus","where":"Mares templados","titles":["Tursiops truncatus","Delfín mular"],"facts":["El delfín mular es muy listo y sociable.","Se comunica con silbidos y chasquidos, y le gusta saltar y jugar con las olas."]},{"id":"babuinosagrado","name":"Babuino sagrado","sci":"Papio hamadryas","where":"Noreste de África y Arabia","titles":["Papio hamadryas","Babuino sagrado"],"facts":["El babuino sagrado vive en grupos grandes y pasa la noche en las rocas.","Los egipcios lo asociaban con el dios de la escritura, Thot."]},{"id":"pezpayaso","name":"Pez payaso","sci":"Amphiprion ocellaris","where":"Arrecifes del Indo-Pacífico","titles":["Amphiprion ocellaris","Pez payaso"],"facts":["El pez payaso vive protegido entre los tentáculos de las anémonas.","Su piel tiene una capa especial que evita que le piquen."]},{"id":"castoramericano","name":"Castor americano","sci":"Castor canadensis","where":"Ríos y lagos de Norteamérica","titles":["Castor canadensis","Castor americano","Castor"],"facts":["El castor americano construye diques de ramas y barro para formar lagunas.","Sus dientes son tan duros que pueden cortar troncos de árboles."]},{"id":"cerdo","name":"Cerdo","sci":"Sus scrofa domesticus","where":"Todo el mundo","titles":["Sus scrofa domesticus","Cerdo"],"facts":["El cerdo es un animal muy inteligente y limpio.","Desciende del jabalí y tiene un olfato finísimo."]},{"id":"saltamontes","name":"Saltamontes","sci":"Caelifera","where":"Todo el mundo","titles":["Caelifera","Saltamontes"],"facts":["El saltamontes tiene patas traseras muy fuertes para dar grandes saltos.","Algunos producen sonidos frotando las patas contra las alas."]},{"id":"hienamanchada","name":"Hiena manchada","sci":"Crocuta crocuta","where":"África","titles":["Crocuta crocuta","Hiena manchada"],"facts":["La hiena manchada vive en grupos dirigidos por hembras.","Emite una voz parecida a una risa, y sus mandíbulas son muy fuertes."]},{"id":"pandagigante","name":"Panda gigante","sci":"Ailuropoda melanoleuca","where":"Montañas de China","titles":["Ailuropoda melanoleuca","Panda gigante"],"facts":["El panda gigante vive en las montañas de China.","Come bambú casi todo el día y puede comer muchos kilos."]},{"id":"quebrantahuesos","name":"Quebrantahuesos","sci":"Gypaetus barbatus","where":"Montañas de Europa, África y Asia","titles":["Gypaetus barbatus","Quebrantahuesos"],"facts":["El quebrantahuesos es un buitre enorme que vive en las montañas.","Deja caer huesos desde el aire para romperlos y comer lo que hay dentro."]},{"id":"chacaldorado","name":"Chacal dorado","sci":"Canis aureus","where":"África, Europa y Asia","titles":["Canis aureus","Chacal dorado"],"facts":["El chacal dorado se parece a un lobo pequeño y vive en parejas o en grupos familiares.","Come frutos, insectos y pequeños animales, y aúlla al atardecer."]},{"id":"cerdohormiguero","name":"Cerdo hormiguero","sci":"Orycteropus afer","where":"África","titles":["Orycteropus afer","Cerdo hormiguero"],"facts":["El cerdo hormiguero es un animal nocturno que excava madrigueras y se alimenta de termitas.","Tiene orejas largas y un hocico en forma de tubo."]},{"id":"pezglobo","name":"Pez globo","sci":"Tetraodontidae","where":"Mares tropicales","titles":["Tetraodontidae","Pez globo"],"facts":["Cuando se asusta, el pez globo se llena de agua y se hincha como una pelota.","Muchos de ellos son venenosos."]},{"id":"mapache","name":"Mapache","sci":"Procyon lotor","where":"Norteamérica","titles":["Procyon lotor","Mapache"],"facts":["El mapache tiene una máscara oscura sobre los ojos y patas muy hábiles.","Parece lavar la comida entre sus manos antes de comerla."]},{"id":"perro","name":"Perro","sci":"Canis lupus familiaris","where":"Todo el mundo","titles":["Perro"],"facts":["El perro fue el primer animal domesticado por las personas.","Entiende nuestros gestos y es capaz de reconocer muchas palabras."]},{"id":"grillocampestre","name":"Grillo campestre","sci":"Gryllus campestris","where":"Europa y norte de África","titles":["Gryllus campestris","Grillo campestre","Grillo común"],"facts":["El grillo campestre canta al atardecer.","Lo hace frotando las alas, y con ese sonido llama a sus hembras."]},{"id":"licaon","name":"Licaón","sci":"Lycaon pictus","where":"Sabanas de África","titles":["Lycaon pictus","Licaón"],"facts":["El licaón caza en manada con mucha cooperación.","Cada uno tiene un dibujo distinto de manchas en el pelaje, como una huella."]},{"id":"cuon","name":"Cuón","sci":"Cuon alpinus","where":"Bosques de Asia","titles":["Cuon alpinus","Cuón","Perro salvaje asiático"],"facts":["El cuón es un perro salvaje de pelaje rojizo.","Caza en manada y se comunica con silbidos muy particulares."]},{"id":"jaguar","name":"Jaguar","sci":"Panthera onca","where":"Selvas de América","titles":["Panthera onca","Jaguar"],"facts":["El jaguar es el felino más grande de América.","Le gusta el agua y nada muy bien, algo raro entre los gatos."]},{"id":"tortugaboba","name":"Tortuga boba","sci":"Caretta caretta","where":"Mares templados del mundo","titles":["Caretta caretta","Tortuga boba"],"facts":["La tortuga boba nada por el Mediterráneo y por el Atlántico.","Pone sus huevos en la arena de las playas, de noche y con mucha tranquilidad."]},{"id":"halconperegrino","name":"Halcón peregrino","sci":"Falco peregrinus","where":"Casi todo el mundo","titles":["Falco peregrinus","Halcón peregrino"],"facts":["El halcón peregrino es el animal más rápido del mundo.","Cuando se lanza en picado sobre su presa, supera los trescientos kilómetros por hora."]},{"id":"lagartocornudo","name":"Lagarto cornudo","sci":"Phrynosoma","where":"Desiertos de América del Norte","titles":["Phrynosoma","Lagarto cornudo"],"facts":["El lagarto cornudo tiene el cuerpo plano y lleno de espinas.","Su color se parece tanto a la arena que es muy difícil verlo."]},{"id":"pezvela","name":"Pez vela","sci":"Istiophorus platypterus","where":"Mares tropicales y templados","titles":["Istiophorus platypterus","Pez vela"],"facts":["El pez vela abre una gran aleta en el lomo, que parece una vela.","Es uno de los peces más rápidos que existen."]},{"id":"zarigueya","name":"Zarigüeya","sci":"Didelphis virginiana","where":"Norteamérica","titles":["Didelphis virginiana","Zarigüeya de Virginia","Zarigüeya"],"facts":["La zarigüeya es un marsupial.","Cuando tiene miedo se queda inmóvil, como si estuviera dormida, hasta que pasa el peligro."]},{"id":"gatodomestico","name":"Gato doméstico","sci":"Felis catus","where":"Todo el mundo","titles":["Felis catus","Gato doméstico","Gato"],"facts":["El gato doméstico caza con sigilo y puede saltar varias veces su altura.","Ronronea cuando está contento y también cuando se siente mal."]},{"id":"delfinrosado","name":"Delfín rosado","sci":"Inia geoffrensis","where":"Ríos del Amazonas","titles":["Inia geoffrensis","Delfín rosado del Amazonas"],"facts":["El delfín rosado vive en los ríos del Amazonas.","Cuando crece, su piel se vuelve rosada, y nada entre los árboles inundados."]},{"id":"camaleoncomun","name":"Camaleón común","sci":"Chamaeleo chamaeleon","where":"Sur de España y norte de África","titles":["Chamaeleo chamaeleon","Camaleón común"],"facts":["El camaleón común vive en el sur de España.","Cada uno de sus ojos se mueve por su lado y su lengua es larguísima para atrapar insectos."]},{"id":"mochueloeuropeo","name":"Mochuelo europeo","sci":"Athene noctua","where":"Europa, Asia y norte de África","titles":["Athene noctua","Mochuelo europeo"],"facts":["El mochuelo europeo es un búho pequeño con ojos amarillos y mirada seria.","Los atenienses lo ponían en sus monedas como símbolo de sabiduría."]},{"id":"monstruodegila","name":"Monstruo de Gila","sci":"Heloderma suspectum","where":"Desiertos de México y Estados Unidos","titles":["Heloderma suspectum","Monstruo de Gila"],"facts":["El monstruo de Gila es un lagarto lento, de piel negra y naranja.","Guarda reservas de grasa en la cola y puede pasar meses sin comer."]},{"id":"atunrojo","name":"Atún rojo","sci":"Thunnus thynnus","where":"Océano Atlántico y Mediterráneo","titles":["Thunnus thynnus","Atún rojo"],"facts":["El atún rojo cruza el océano Atlántico en largos viajes.","Es un nadador potente y puede pesar cientos de kilos."]},{"id":"aguilacalva","name":"Águila calva","sci":"Haliaeetus leucocephalus","where":"Norteamérica","titles":["Haliaeetus leucocephalus","Águila calva","Pigargo americano"],"facts":["El águila calva no es calva, pues tiene plumas blancas en la cabeza.","Construye nidos enormes y se alimenta sobre todo de peces."]},{"id":"anadereal","name":"Ánade real","sci":"Anas platyrhynchos","where":"Europa, Asia y Norteamérica","titles":["Anas platyrhynchos","Ánade real","Pato real"],"facts":["El ánade real, o pato real, vuela, nada y camina.","Sus plumas tienen una grasa especial que impide que se empapen."]},{"id":"polillaatlas","name":"Polilla atlas","sci":"Attacus atlas","where":"Selvas de Asia","titles":["Attacus atlas","Polilla atlas"],"facts":["La polilla atlas es una de las mariposas nocturnas más grandes del mundo.","Sus alas pueden medir veinticinco centímetros de punta a punta."]},{"id":"mandril","name":"Mandril","sci":"Mandrillus sphinx","where":"Selvas de África central","titles":["Mandrillus sphinx","Mandril"],"facts":["El mandril tiene la cara con rayas rojas y azules muy llamativas.","Es el mono más grande del mundo y vive en grupos numerosos."]},{"id":"dromedario","name":"Dromedario","sci":"Camelus dromedarius","where":"Desiertos de África y Asia","titles":["Camelus dromedarius","Dromedario"],"facts":["El dromedario tiene una sola joroba y aguanta muchos días sin beber.","En la joroba guarda grasa, que le da energía."]},{"id":"urogallo","name":"Urogallo","sci":"Tetrao urogallus","where":"Bosques de montaña de Europa","titles":["Tetrao urogallus","Urogallo"],"facts":["El urogallo es un ave grande del bosque.","Los machos hacen sonidos extraños y bailan para llamar la atención de las hembras."]},{"id":"caballodeprzewalski","name":"Caballo de Przewalski","sci":"Equus ferus przewalskii","where":"Estepas de Mongolia","titles":["Equus ferus przewalskii","Caballo de Przewalski"],"facts":["El caballo de Przewalski es el último caballo realmente salvaje.","Es bajo y fuerte, con una melena corta y erguida, y vive en las estepas de Mongolia."]},{"id":"orca","name":"Orca","sci":"Orcinus orca","where":"Todos los océanos","titles":["Orcinus orca","Orca"],"facts":["La orca es el delfín más grande del mundo.","Vive en familias y caza en equipo, comunicándose con silbidos y chasquidos."]},{"id":"pavosalvaje","name":"Pavo salvaje","sci":"Meleagris gallopavo","where":"Norteamérica","titles":["Meleagris gallopavo","Pavo salvaje"],"facts":["El pavo salvaje es un ave grande que prefiere caminar antes que volar.","Los machos abren la cola en abanico para atraer a las hembras."]},{"id":"conejoeuropeo","name":"Conejo europeo","sci":"Oryctolagus cuniculus","where":"Península ibérica y Europa","titles":["Oryctolagus cuniculus","Conejo europeo","Conejo"],"facts":["El conejo europeo vive en madrigueras llamadas vivares.","Tiene los dientes siempre creciendo, y por eso necesita roer."]},{"id":"aranadejardin","name":"Araña de jardín","sci":"Araneus diadematus","where":"Europa y Norteamérica","titles":["Araneus diadematus","Araña de jardín"],"facts":["La araña de jardín teje redes redondas muy bonitas.","Cada mañana puede reparar su tela o fabricar una nueva."]},{"id":"chimpance","name":"Chimpancé","sci":"Pan troglodytes","where":"África central y occidental","titles":["Pan troglodytes","Chimpancé"],"facts":["El chimpancé usa herramientas, como palitos, para sacar termitas de sus nidos.","Es muy inteligente y se parece mucho a las personas."]},{"id":"sifakadeverreaux","name":"Sifaka de Verreaux","sci":"Propithecus verreauxi","where":"Madagascar","titles":["Propithecus verreauxi","Sifaka de Verreaux","Sifaka"],"facts":["El sifaka salta de un árbol a otro con una fuerza impresionante.","Cuando baja al suelo, avanza dando saltitos laterales como si bailara."]},{"id":"zorroartico","name":"Zorro ártico","sci":"Vulpes lagopus","where":"La tundra del Ártico","titles":["Vulpes lagopus","Zorro ártico"],"facts":["El zorro ártico cambia de color con las estaciones.","En invierno es blanco como la nieve y en verano es de color marrón grisáceo."]},{"id":"bisonteeuropeo","name":"Bisonte europeo","sci":"Bison bonasus","where":"Bosques del este de Europa","titles":["Bison bonasus","Bisonte europeo"],"facts":["El bisonte europeo es el mamífero terrestre más pesado de Europa.","Estuvo a punto de desaparecer, pero hoy vive otra vez en libertad en algunos bosques."]},{"id":"elefanteasiatico","name":"Elefante asiático","sci":"Elephas maximus","where":"Sur y sureste de Asia","titles":["Elephas maximus","Elefante asiático"],"facts":["El elefante asiático es más pequeño que el africano y tiene las orejas menores.","Desde hace siglos las personas lo han usado para trabajar."]},{"id":"suricata","name":"Suricata","sci":"Suricata suricatta","where":"Desiertos del sur de África","titles":["Suricata suricatta","Suricata"],"facts":["La suricata vive en grupos familiares.","Siempre hay una vigilante que se pone de pie y avisa a las demás si ve algún peligro."]},{"id":"cachalote","name":"Cachalote","sci":"Physeter macrocephalus","where":"Todos los océanos","titles":["Physeter macrocephalus","Cachalote"],"facts":["El cachalote puede sumergirse más de mil metros y aguantar una hora sin respirar.","Allí caza calamares gigantes en total oscuridad."]},{"id":"wapiti","name":"Wapití","sci":"Cervus canadensis","where":"Bosques y montañas de Norteamérica","titles":["Cervus canadensis","Wapití"],"facts":["El wapití es un ciervo grande con enormes astas.","En otoño los machos hacen un sonido muy potente llamado berrea."]},{"id":"palomabravia","name":"Paloma bravía","sci":"Columba livia","where":"Casi todo el mundo","titles":["Columba livia","Paloma bravía"],"facts":["La paloma bravía tiene una gran orientación y puede volver a su palomar desde cientos de kilómetros.","Por eso se usó como mensajera."]},{"id":"viudanegra","name":"Viuda negra","sci":"Latrodectus mactans","where":"Américas","titles":["Latrodectus mactans","Viuda negra"],"facts":["La viuda negra es una araña de color oscuro con una mancha roja en el vientre.","Es tímida y se esconde en lugares apartados."]},{"id":"orangutandeborneo","name":"Orangután de Borneo","sci":"Pongo pygmaeus","where":"Selvas de Borneo","titles":["Pongo pygmaeus","Orangután de Borneo","Orangután"],"facts":["La palabra orangután significa hombre del bosque.","Es un gran simio de pelo rojizo, que vive en los árboles y construye un nido nuevo cada noche."]},{"id":"avelirasoberbia","name":"Ave lira soberbia","sci":"Menura novaehollandiae","where":"Bosques de Australia","titles":["Menura novaehollandiae","Ave lira soberbia","Ave lira"],"facts":["El ave lira macho tiene una cola con forma de lira.","Imita los sonidos que oye, incluso el de una cámara o una sierra."]},{"id":"tortugaverde","name":"Tortuga verde","sci":"Chelonia mydas","where":"Mares cálidos","titles":["Chelonia mydas","Tortuga verde"],"facts":["La tortuga verde recorre miles de kilómetros por el mar.","Cuando va a poner huevos, vuelve a la playa donde nació."]},{"id":"loboiberico","name":"Lobo ibérico","sci":"Canis lupus signatus","where":"Península ibérica","titles":["Canis lupus signatus","Lobo ibérico","Lobo"],"facts":["El lobo ibérico vive en grupos familiares llamados manadas.","Aúlla para comunicarse con los suyos y su aullido se oye muy lejos."]},{"id":"lobogris","name":"Lobo gris","sci":"Canis lupus","where":"Norteamérica, Europa y Asia","titles":["Canis lupus","Lobo gris"],"facts":["El lobo gris vive y caza en manada.","Cada manada tiene un territorio, y los lobos se comunican con aullidos que se oyen a muchos kilómetros."]},{"id":"escorpionemperador","name":"Escorpión emperador","sci":"Pandinus imperator","where":"África occidental","titles":["Pandinus imperator","Escorpión emperador"],"facts":["El escorpión emperador es grande y de color negro.","Si se le ilumina con luz ultravioleta, su cuerpo brilla con un color azul verdoso."]},{"id":"cabradelasnieves","name":"Cabra de las nieves","sci":"Oreamnos americanus","where":"Montañas de Norteamérica","titles":["Oreamnos americanus","Cabra de las nieves"],"facts":["La cabra de las nieves es blanca y tiene pezuñas especiales que le permiten caminar con seguridad sobre las rocas heladas.","Lo puedes encontrar en: montañas de Norteamérica."]},{"id":"halconsacre","name":"Halcón sacre","sci":"Falco cherrug","where":"Europa del este y Asia","titles":["Falco cherrug","Halcón sacre"],"facts":["El halcón sacre es un ave de presa grande y poderosa.","Durante siglos fue uno de los favoritos de los reyes para cazar."]},{"id":"tarantulagoliat","name":"Tarántula goliat","sci":"Theraphosa blondi","where":"Selvas de América del Sur","titles":["Theraphosa blondi","Tarántula goliat"],"facts":["La tarántula goliat es la araña más grande del mundo en peso.","Vive en madrigueras y sale de noche a cazar."]},{"id":"bonobo","name":"Bonobo","sci":"Pan paniscus","where":"Selvas del Congo","titles":["Pan paniscus","Bonobo"],"facts":["El bonobo es un simio muy parecido al chimpancé, pero más tranquilo.","Vive en grupos pacíficos y solo se encuentra en un país de África."]},{"id":"mariposamonarca","name":"Mariposa monarca","sci":"Danaus plexippus","where":"Norteamérica y México","titles":["Danaus plexippus","Mariposa monarca"],"facts":["La mariposa monarca viaja miles de kilómetros hasta México.","Es un viaje larguísimo para un insecto tan pequeño."]},{"id":"gineta","name":"Gineta","sci":"Genetta genetta","where":"Europa y África","titles":["Genetta genetta","Gineta"],"facts":["La gineta parece un gato muy esbelto con una larga cola de anillos.","Sale de noche, trepa muy bien y caza ratones, pájaros e insectos."]},{"id":"gansocomun","name":"Ganso común","sci":"Anser anser","where":"Europa y Asia","titles":["Anser anser","Ganso común","Ganso silvestre"],"facts":["Los gansos advirtieron con sus graznidos a los romanos de un ataque nocturno al Capitolio, según cuenta la historia.","Son aves vigilantes y muy ruidosas."]},{"id":"cangrejoermitano","name":"Cangrejo ermitaño","sci":"Pagurus bernhardus","where":"Costas de Europa","titles":["Pagurus bernhardus","Cangrejo ermitaño"],"facts":["El cangrejo ermitaño no tiene concha propia, así que se protege dentro de la de un caracol vacío.","Cuando crece, se muda a una más grande."]},{"id":"beluga","name":"Beluga","sci":"Delphinapterus leucas","where":"Mares del Ártico","titles":["Delphinapterus leucas","Beluga"],"facts":["La beluga es una ballena pequeña de color blanco.","Hace tantos sonidos distintos que se la llama el canario del mar."]},{"id":"borregocimarron","name":"Borrego cimarrón","sci":"Ovis canadensis","where":"Montañas y desiertos de Norteamérica","titles":["Ovis canadensis","Borrego cimarrón"],"facts":["Los machos del borrego cimarrón chocan sus cuernos con gran estruendo para demostrar quién manda.","Tienen la cabeza muy fuerte."]},{"id":"azorcomun","name":"Azor común","sci":"Accipiter gentilis","where":"Bosques del hemisferio norte","titles":["Accipiter gentilis","Azor común"],"facts":["El azor común es un ave rápida y ágil que caza entre los árboles.","Sus alas cortas y su cola larga le permiten girar sin chocar."]},{"id":"milpiesgiganteafricano","name":"Milpiés gigante africano","sci":"Archispirostreptus gigas","where":"África oriental","titles":["Archispirostreptus gigas","Milpiés gigante africano"],"facts":["El milpiés gigante africano tiene cientos de patas y puede medir más de treinta centímetros.","Cuando se asusta, se enrolla como un caracol."]},{"id":"lemurdecolaanillada","name":"Lémur de cola anillada","sci":"Lemur catta","where":"Madagascar","titles":["Lemur catta","Lémur de cola anillada","Lémur"],"facts":["El lémur de cola anillada tiene trece anillos negros y blancos en la cola.","Por la mañana se sienta al sol con los brazos abiertos para calentarse."]},{"id":"calaorinoceronte","name":"Cálao rinoceronte","sci":"Buceros rhinoceros","where":"Selvas del sudeste de Asia","titles":["Buceros rhinoceros","Cálao rinoceronte"],"facts":["El cálao rinoceronte tiene sobre el pico una prominencia en forma de cuerno.","Es un ave grande que vive en las selvas de Asia."]},{"id":"colibriabeja","name":"Colibrí abeja","sci":"Mellisuga helenae","where":"Cuba","titles":["Mellisuga helenae","Colibrí abeja"],"facts":["El colibrí abeja es el ave más pequeña del mundo.","Vive en Cuba y mueve las alas tan deprisa que casi no se ven."]},{"id":"nutriaeuropea","name":"Nutria europea","sci":"Lutra lutra","where":"Ríos de Europa y Asia","titles":["Lutra lutra","Nutria europea","Nutria"],"facts":["La nutria europea nada de maravilla y tiene el pelo tan denso que no deja pasar el agua.","Come peces, ranas y cangrejos."]},{"id":"buitreleonado","name":"Buitre leonado","sci":"Gyps fulvus","where":"Sur de Europa, norte de África y Asia","titles":["Gyps fulvus","Buitre leonado"],"facts":["El buitre leonado planea durante horas sin batir las alas.","Se alimenta de animales muertos, y así mantiene limpio el campo."]},{"id":"coralcerebro","name":"Coral cerebro","sci":"Diploria labyrinthiformis","where":"Mares cálidos del Caribe","titles":["Diploria labyrinthiformis","Coral cerebro"],"facts":["El coral cerebro está formado por muchos pólipos diminutos que construyen un esqueleto de piedra.","Su superficie recuerda a un cerebro."]},{"id":"morsa","name":"Morsa","sci":"Odobenus rosmarus","where":"Mares del Ártico","titles":["Odobenus rosmarus","Morsa"],"facts":["La morsa tiene dos grandes colmillos que usa para salir del agua y subirse al hielo.","Vive en grupos numerosos y le gusta estar muy junta."]},{"id":"gloton","name":"Glotón","sci":"Gulo gulo","where":"Bosques fríos del norte","titles":["Gulo gulo","Glotón"],"facts":["El glotón es pequeño pero fuerte y valiente.","Recorre grandes distancias por la nieve y puede enfrentarse a animales más grandes."]},{"id":"cuervogrande","name":"Cuervo grande","sci":"Corvus corax","where":"Hemisferio norte","titles":["Corvus corax","Cuervo grande","Cuervo"],"facts":["El cuervo es uno de los pájaros más listos.","Puede resolver problemas, imitar sonidos y recordar a las personas."]},{"id":"cochinilladelahumedad","name":"Cochinilla de la humedad","sci":"Armadillidium vulgare","where":"Europa y América","titles":["Armadillidium vulgare","Cochinilla de la humedad"],"facts":["La cochinilla de la humedad no es un insecto, sino un crustáceo terrestre.","Cuando tiene miedo se enrolla como una pequeña bola."]},{"id":"jirafa","name":"Jirafa","sci":"Giraffa camelopardalis","where":"Sabanas de África","titles":["Giraffa camelopardalis","Jirafa"],"facts":["La jirafa es el animal más alto del mundo.","Con su cuello largo llega a las hojas más altas de los árboles."]},{"id":"salamandracomun","name":"Salamandra común","sci":"Salamandra salamandra","where":"Bosques húmedos de Europa","titles":["Salamandra salamandra","Salamandra común"],"facts":["La salamandra común tiene la piel negra con manchas amarillas, que avisan de que no conviene comerla.","Sale en las noches húmedas."]},{"id":"camellobactriano","name":"Camello bactriano","sci":"Camelus bactrianus","where":"Desiertos de Asia central","titles":["Camelus bactrianus","Camello bactriano"],"facts":["El camello bactriano tiene dos jorobas y soporta el frío del invierno y el calor del verano.","Cargaba con mercancías por la Ruta de la Seda."]},{"id":"estrellademarcomun","name":"Estrella de mar común","sci":"Asterias rubens","where":"Costas del Atlántico norte","titles":["Asterias rubens","Estrella de mar común","Estrella de mar"],"facts":["La estrella de mar tiene cinco brazos y no tiene cerebro.","Si pierde un brazo, puede hacer que le crezca otro."]},{"id":"manati","name":"Manatí","sci":"Trichechus manatus","where":"Costas y ríos tropicales","titles":["Trichechus manatus","Manatí"],"facts":["El manatí es un animal grande, lento y tranquilo.","Pasa el día comiendo plantas acuáticas y sale a respirar cada pocos minutos."]},{"id":"lincecanadiense","name":"Lince canadiense","sci":"Lynx canadensis","where":"Bosques del norte de América","titles":["Lynx canadensis","Lince canadiense"],"facts":["El lince canadiense tiene patas anchas y peludas que funcionan como raquetas de nieve.","Caza sobre todo liebres."]},{"id":"ratanegra","name":"Rata negra","sci":"Rattus rattus","where":"Casi todo el mundo","titles":["Rattus rattus","Rata negra"],"facts":["La rata negra trepa muy bien y vive en edificios y barcos.","Es lista y se adapta a casi cualquier lugar."]},{"id":"lombrizdetierra","name":"Lombriz de tierra","sci":"Lumbricus terrestris","where":"Casi todo el mundo","titles":["Lumbricus terrestris","Lombriz de tierra"],"facts":["La lombriz de tierra abre pequeños túneles en el suelo y lo mezcla.","Así deja la tierra suelta y fértil para las plantas."]},{"id":"pinguinorey","name":"Pingüino rey","sci":"Aptenodytes patagonicus","where":"Islas del océano Antártico","titles":["Aptenodytes patagonicus","Pingüino rey"],"facts":["El pingüino rey es el segundo pingüino más grande.","Se reconoce por las manchas anaranjadas del cuello y de la cabeza."]},{"id":"leon","name":"León","sci":"Panthera leo","where":"Sabanas de África","titles":["Panthera leo","León"],"facts":["El león vive en grupos llamados manadas.","Los machos tienen una gran melena y su rugido se oye muy lejos."]},{"id":"erizoeuropeo","name":"Erizo europeo","sci":"Erinaceus europaeus","where":"Bosques y jardines de Europa","titles":["Erinaceus europaeus","Erizo europeo"],"facts":["El erizo europeo está cubierto de miles de púas.","Cuando tiene miedo se hace una bola, y en invierno duerme en un refugio."]},{"id":"yak","name":"Yak","sci":"Bos grunniens","where":"Montañas del Himalaya y Tíbet","titles":["Bos grunniens","Yak"],"facts":["El yak tiene un pelaje largo y espeso que lo protege del frío extremo.","Vive a gran altura, donde el aire tiene poco oxígeno."]},{"id":"erizodemar","name":"Erizo de mar","sci":"Paracentrotus lividus","where":"Mar Mediterráneo y Atlántico","titles":["Paracentrotus lividus","Erizo de mar"],"facts":["El erizo de mar es una bola cubierta de púas.","Se mueve despacio sobre las rocas con unos pequeños pies con ventosas."]},{"id":"dugongo","name":"Dugongo","sci":"Dugong dugon","where":"Costas del Indo-Pacífico","titles":["Dugong dugon","Dugongo"],"facts":["El dugongo se alimenta de hierbas marinas que crecen en el fondo.","Se dice que los marineros antiguos lo confundían con las sirenas."]},{"id":"perrodelapradera","name":"Perro de la pradera","sci":"Cynomys ludovicianus","where":"Praderas de Norteamérica","titles":["Cynomys ludovicianus","Perro de la pradera"],"facts":["El perro de la pradera vive en colonias subterráneas con muchas galerías.","Cuando hay peligro, lanza ladridos para avisar a todos."]},{"id":"cisnevulgar","name":"Cisne vulgar","sci":"Cygnus olor","where":"Lagos y ríos de Europa y Asia","titles":["Cygnus olor","Cisne vulgar","Cisne"],"facts":["El cisne vulgar tiene un cuello largo y curvado.","Forma parejas para toda la vida y cuida mucho a sus crías."]},{"id":"estorninopinto","name":"Estornino pinto","sci":"Sturnus vulgaris","where":"Europa, Asia y Norteamérica","titles":["Sturnus vulgaris","Estornino pinto","Estornino"],"facts":["El estornino pinto vuela en bandadas enormes que dibujan formas en el cielo.","También puede imitar sonidos que oye."]},{"id":"cisnenegro","name":"Cisne negro","sci":"Cygnus atratus","where":"Australia","titles":["Cygnus atratus","Cisne negro"],"facts":["El cisne negro es originario de Australia.","Tiene el plumaje oscuro y el pico rojo, y le gusta nadar en lagos tranquilos."]},{"id":"koala","name":"Koala","sci":"Phascolarctos cinereus","where":"Bosques de Australia","titles":["Phascolarctos cinereus","Koala"],"facts":["El koala come hojas de eucalipto y duerme muchas horas al día.","No es un oso, es un marsupial."]},{"id":"tejoneuropeo","name":"Tejón europeo","sci":"Meles meles","where":"Bosques de Europa","titles":["Meles meles","Tejón europeo","Tejón"],"facts":["El tejón excava grandes madrigueras con muchas entradas.","Sale de noche a buscar lombrices, frutas y pequeños animales."]},{"id":"gallobankiva","name":"Gallo bankiva","sci":"Gallus gallus","where":"Sureste de Asia","titles":["Gallus gallus","Gallo bankiva"],"facts":["El gallo bankiva es el antepasado salvaje de las gallinas.","Vive en los bosques del sureste de Asia, y el macho tiene plumas brillantes."]},{"id":"ostraperlifera","name":"Ostra perlífera","sci":"Pinctada margaritifera","where":"Mares cálidos del Pacífico e Índico","titles":["Pinctada margaritifera","Ostra perlífera"],"facts":["Cuando un grano de arena entra en la ostra, ella lo cubre capa a capa con una sustancia suave y brillante.","Así se forma la perla."]},{"id":"leonmarinodecalifornia","name":"León marino de California","sci":"Zalophus californianus","where":"Costa del Pacífico de Norteamérica","titles":["Zalophus californianus","León marino de California"],"facts":["El león marino de California es sociable y muy ruidoso, y ladra para comunicarse.","Nada rápido y le gusta jugar con las olas."]},{"id":"mofetarayada","name":"Mofeta rayada","sci":"Mephitis mephitis","where":"Norteamérica","titles":["Mephitis mephitis","Mofeta rayada"],"facts":["La mofeta rayada avisa antes de atacar: levanta la cola y patalea.","Si no funciona, lanza un líquido con olor intenso."]},{"id":"garzareal","name":"Garza real","sci":"Ardea cinerea","where":"Europa, Asia y África","titles":["Ardea cinerea","Garza real"],"facts":["La garza real puede quedarse quieta durante un buen rato.","Cuando pasa un pez, lanza su largo pico y lo atrapa."]},{"id":"golondrinacomun","name":"Golondrina común","sci":"Hirundo rustica","where":"Casi todo el mundo","titles":["Hirundo rustica","Golondrina común"],"facts":["La golondrina construye su nido de barro bajo los tejados.","En otoño viaja a África y en primavera regresa al mismo sitio."]},{"id":"gibondemanosblancas","name":"Gibón de manos blancas","sci":"Hylobates lar","where":"Selvas del sudeste de Asia","titles":["Hylobates lar","Gibón de manos blancas","Gibón"],"facts":["El gibón se balancea de rama en rama con sus largos brazos.","Las parejas cantan juntas por la mañana, y su canto se oye muy lejos."]},{"id":"ibisescarlata","name":"Ibis escarlata","sci":"Eudocimus ruber","where":"América del Sur","titles":["Eudocimus ruber","Ibis escarlata"],"facts":["El ibis escarlata es de un rojo intenso por los crustáceos que come.","Vive en bandadas sobre manglares y costas."]},{"id":"tucan","name":"Tucán","sci":"Ramphastos toco","where":"Selvas de América","titles":["Ramphastos toco","Tucán toco"],"facts":["El tucán tiene un pico enorme y de muchos colores.","Aunque parece pesado, es muy ligero y le sirve para alcanzar la fruta."]},{"id":"desmaniberico","name":"Desmán ibérico","sci":"Galemys pyrenaicus","where":"Ríos de montaña de España y Portugal","titles":["Galemys pyrenaicus","Desmán ibérico"],"facts":["El desmán ibérico es un pequeño mamífero con una trompa larga y móvil.","Nada muy bien y vive solo en algunos ríos de montaña de España y Portugal."]},{"id":"gusanodeseda","name":"Gusano de seda","sci":"Bombyx mori","where":"China","titles":["Bombyx mori","Gusano de seda"],"facts":["El gusano de seda es la oruga de una polilla.","Se envuelve en un capullo hecho de un único hilo larguísimo, del que se obtiene la seda."]},{"id":"almejagigante","name":"Almeja gigante","sci":"Tridacna gigas","where":"Mares cálidos del Pacífico","titles":["Tridacna gigas","Almeja gigante"],"facts":["La almeja gigante es el molusco con concha más grande del mundo.","Puede medir más de un metro y vivir cien años."]},{"id":"elefantemarinodelsur","name":"Elefante marino del sur","sci":"Mirounga leonina","where":"Antártida y mares del sur","titles":["Mirounga leonina","Elefante marino del sur"],"facts":["El elefante marino del sur es la foca más grande del mundo.","El macho tiene una nariz grande y blanda, como una pequeña trompa."]},{"id":"martinpescador","name":"Martín pescador","sci":"Alcedo atthis","where":"Europa, Asia y norte de África","titles":["Alcedo atthis","Martín pescador"],"facts":["El martín pescador es un ave de color azul brillante.","Se lanza en picado al agua y sale con un pez en el pico."]},{"id":"vencejocomun","name":"Vencejo común","sci":"Apus apus","where":"Europa, Asia y África","titles":["Apus apus","Vencejo común"],"facts":["El vencejo común pasa casi toda la vida volando.","Come, bebe y hasta duerme en el aire, y solo se posa para criar."]},{"id":"monocapuchino","name":"Mono capuchino","sci":"Cebus","where":"Selvas de América Central y del Sur","titles":["Cebus","Mono capuchino"],"facts":["El mono capuchino usa piedras para romper nueces duras.","Es muy listo y vive en grupos ruidosos y sociables."]},{"id":"espatulacomun","name":"Espátula común","sci":"Platalea leucorodia","where":"Europa, Asia y África","titles":["Platalea leucorodia","Espátula común"],"facts":["La espátula común tiene el pico plano, con forma de cuchara.","Lo mueve de un lado a otro dentro del agua para atrapar peces."]},{"id":"pulpocomun","name":"Pulpo común","sci":"Octopus vulgaris","where":"Mares del mundo","titles":["Octopus vulgaris","Pulpo común"],"facts":["El pulpo tiene ocho brazos y tres corazones.","Es muy listo y puede cambiar de color para esconderse."]},{"id":"aguilaimperialiberica","name":"Águila imperial ibérica","sci":"Aquila adalberti","where":"España y Portugal","titles":["Aquila adalberti","Águila imperial ibérica"],"facts":["El águila imperial ibérica tiene manchas blancas en los hombros.","Vive en España y Portugal y construye su nido en lo alto de los árboles."]},{"id":"pandarojo","name":"Panda rojo","sci":"Ailurus fulgens","where":"Montañas del Himalaya y China","titles":["Ailurus fulgens","Panda rojo"],"facts":["El panda rojo vive en los bosques de montaña y trepa a los árboles con facilidad.","Su cola larga y anillada le sirve de abrigo."]},{"id":"nutriamarina","name":"Nutria marina","sci":"Enhydra lutris","where":"Costas del Pacífico norte","titles":["Enhydra lutris","Nutria marina"],"facts":["La nutria marina flota de espaldas y usa piedras para abrir mariscos.","Tiene el pelo más denso de todos los animales."]},{"id":"capibara","name":"Capibara","sci":"Hydrochoerus hydrochaeris","where":"Ríos y lagunas de América del Sur","titles":["Hydrochoerus hydrochaeris","Capibara","Carpincho"],"facts":["El capibara es el roedor más grande del mundo.","Le encanta el agua, vive en grupos y se lleva bien con otros animales."]},{"id":"jabali","name":"Jabalí","sci":"Sus scrofa","where":"Europa, Asia y norte de África","titles":["Sus scrofa","Jabalí"],"facts":["El jabalí tiene un hocico potente con el que remueve la tierra en busca de raíces.","Vive en grupos y sale sobre todo de noche."]},{"id":"gorrioncomun","name":"Gorrión común","sci":"Passer domesticus","where":"Casi todo el mundo","titles":["Passer domesticus","Gorrión común"],"facts":["El gorrión común vive cerca de las personas y se alimenta de semillas y migas.","Le gusta bañarse en polvo y en agua."]},{"id":"rinoceronteblanco","name":"Rinoceronte blanco","sci":"Ceratotherium simum","where":"Sabanas de África","titles":["Ceratotherium simum","Rinoceronte blanco"],"facts":["El rinoceronte blanco es el segundo animal terrestre más grande.","Tiene la boca ancha y plana, perfecta para pastar la hierba."]},{"id":"buhonival","name":"Búho nival","sci":"Bubo scandiacus","where":"El Ártico","titles":["Bubo scandiacus","Búho nival"],"facts":["El búho nival tiene plumas blancas y vive en el Ártico.","También caza de día, sobre todo pequeños roedores llamados lemmings."]},{"id":"mirloacuatico","name":"Mirlo acuático","sci":"Cinclus cinclus","where":"Arroyos de montaña de Europa","titles":["Cinclus cinclus","Mirlo acuático"],"facts":["El mirlo acuático es un pájaro que camina por el fondo de los arroyos.","Se sumerge para buscar larvas de insectos entre las piedras."]},{"id":"tigredebengala","name":"Tigre de Bengala","sci":"Panthera tigris tigris","where":"India y países vecinos","titles":["Panthera tigris tigris","Tigre de Bengala"],"facts":["El tigre de Bengala tiene un pelaje anaranjado con rayas negras, distintas en cada individuo.","Es buen nadador y caza sobre todo de noche."]},{"id":"cangrejoherradura","name":"Cangrejo herradura","sci":"Limulus polyphemus","where":"Costas de América del Norte","titles":["Limulus polyphemus","Cangrejo herradura"],"facts":["El cangrejo herradura tiene sangre de color azul y existe desde hace más de cuatrocientos millones de años.","Es un auténtico fósil viviente."]},{"id":"tortugalaud","name":"Tortuga laúd","sci":"Dermochelys coriacea","where":"Todos los océanos tropicales y templados","titles":["Dermochelys coriacea","Tortuga laúd"],"facts":["La tortuga laúd es la tortuga más grande del mundo.","En lugar de un caparazón duro, tiene una piel gruesa y resistente."]},{"id":"anacondaverde","name":"Anaconda verde","sci":"Eunectes murinus","where":"Selvas y pantanos de América del Sur","titles":["Eunectes murinus","Anaconda verde"],"facts":["La anaconda verde es una de las serpientes más pesadas del mundo.","Nada muy bien y pasa mucho tiempo dentro del agua."]},{"id":"ciervorojo","name":"Ciervo rojo","sci":"Cervus elaphus","where":"Europa, Asia y norte de África","titles":["Cervus elaphus","Ciervo rojo","Ciervo"],"facts":["Los machos del ciervo rojo tienen astas que se caen y vuelven a crecer cada año.","En otoño berrean para atraer a las hembras."]},{"id":"lechuzacomun","name":"Lechuza común","sci":"Tyto alba","where":"Casi todo el mundo","titles":["Tyto alba","Lechuza común"],"facts":["La lechuza común vuela sin hacer ruido.","Su cara tiene forma de corazón y oye tan bien que caza ratones sin verlos."]},{"id":"nuazul","name":"Ñu azul","sci":"Connochaetes taurinus","where":"Sabanas de África","titles":["Connochaetes taurinus","Ñu azul","Ñu"],"facts":["Cada año, millones de ñus recorren la sabana buscando hierba fresca.","Es una de las migraciones de animales más grandes del planeta."]},{"id":"marabuafricano","name":"Marabú africano","sci":"Leptoptilos crumenifer","where":"África","titles":["Leptoptilos crumenifer","Marabú africano","Marabú"],"facts":["El marabú es una cigüeña enorme con las alas muy largas.","Se alimenta de carroña y de pequeños animales, y vive en la sabana."]},{"id":"cebra","name":"Cebra","sci":"Equus quagga","where":"Sabanas de África","titles":["Equus quagga","Cebra"],"facts":["La cebra vive en grupos en África.","Se piensa que sus rayas ayudan a espantar insectos y a confundir a los depredadores."]},{"id":"truchacomun","name":"Trucha común","sci":"Salmo trutta","where":"Ríos fríos de Europa","titles":["Salmo trutta","Trucha común","Trucha"],"facts":["La trucha común vive en ríos fríos de aguas limpias.","Salta fuera del agua para atrapar insectos y nada contra la corriente."]},{"id":"rinoceronteindio","name":"Rinoceronte indio","sci":"Rhinoceros unicornis","where":"India y Nepal","titles":["Rhinoceros unicornis","Rinoceronte indio"],"facts":["El rinoceronte indio tiene un solo cuerno y una piel con pliegues, como si llevara armadura.","Le gusta bañarse en el barro y en los ríos."]},{"id":"celacanto","name":"Celacanto","sci":"Latimeria chalumnae","
